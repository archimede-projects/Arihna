name: Qibla STEP 4 implementation writer
on:
  push:
    branches: [qibla-step4-impl-writer-temp]
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/qibla_step4_implement.py /tmp/qibla_step4_implement.py
          git checkout -B qibla-step4-orchestration e10b39c613a25c42cc28dfcb1ee855d60998132d
          python3 /tmp/qibla_step4_implement.py
          git add app/src/main/java/com/archimedeprojects/arihna/feature/qibla/domain app/src/test/java/com/archimedeprojects/arihna/feature/qibla/domain
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          ! git diff --cached --name-only | grep -Ev '^app/src/(main|test)/java/com/archimedeprojects/arihna/feature/qibla/domain/'
          ! git diff --cached --name-only | grep -qE 'AndroidManifest|build.gradle|AppContainer|ArihnaApp|ArihnaNavHost|core/location|core/prayer'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(qibla): orchestrate location and heading state'
          git push --force-with-lease origin HEAD:qibla-step4-orchestration
