name: Quran Tajwid runtime exact-SHA gate

on:
  push:
    branches:
      - driver/quran-tajwid-runtime-gate-20260910
    paths:
      - .github/workflows/quran-tajwid-runtime-exact-sha-gate.yml

permissions:
  contents: read

env:
  SPEC_SHA: 30f8ad09b4303715b2d89716dd8cb9be756e3ad8
  CANDIDATE_SHA: b90473abc2e56111b87901710ae973f0419e345d
  BASELINE_SHA: 99ed8a0ae257f917443dffd6315057b967fdec9c
  GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
  FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
  FROZEN_ASSET_APK: arihna-settings-s25-premium.apk

jobs:
  static-jvm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b90473abc2e56111b87901710ae973f0419e345d
          fetch-depth: 0

      - name: Verify exact lineage scope and Tajwid contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test "$(git merge-base "$SPEC_SHA" "$CANDIDATE_SHA")" = "$SPEC_SHA"

          mapfile -t CHANGED < <(git diff --name-only "$SPEC_SHA..$CANDIDATE_SHA" | sort)
          EXPECTED=(
            'app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/quran/UthmaniTajwidEngine.kt'
            'app/src/test/java/com/archimedeprojects/arihna/feature/quran/UthmaniTajwidEngineTest.kt'
            'docs/third-party/tajweed-api-mit.md'
          )
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${CHANGED[@]}")
          ! printf '%s\n' "${CHANGED[@]}" | grep -E '/(prayers|location|qibla)/'

          Q=app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          R=app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt
          E=app/src/main/java/com/archimedeprojects/arihna/feature/quran/UthmaniTajwidEngine.kt
          U=app/src/test/java/com/archimedeprojects/arihna/feature/quran/UthmaniTajwidEngineTest.kt
          A=app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt
          N=docs/third-party/tajweed-api-mit.md

          for token in \
            'QuranReadingMode.HAFS_TAJWID' \
            'quran-mode-tajwid' \
            'Ḥafṣ Tajwid · Beta' \
            'quran-tajwid-beta-disclaimer' \
            'Beta / regole principali' \
            'quran-tajwid-fullscreen-reader' \
            'WindowInsets.displayCutout.union(WindowInsets.statusBars)' \
            'CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl)'; do
            grep -Fq "$token" "$Q"
          done
          for token in \
            'KEY_TAJWID_BOOKMARKS' \
            'KEY_TAJWID_LAST_SURAH' \
            'KEY_TAJWID_RECENT' \
            'tajwidBookmarkedSurahs' \
            'recordVisitedTajwidSurah'; do
            grep -Fq "$token" "$R"
          done
          for token in \
            'internal object UthmaniTajwidEngine' \
            'QALQALAH' 'IKHFA' 'IQLAB' \
            'IDGHAM_WITH_GHUNNAH' 'IDGHAM_WITHOUT_GHUNNAH' 'GHUNNAH'; do
            grep -Fq "$token" "$E"
          done
          grep -Fq 'outputIsDeterministicValidAndNeverMutatesText' "$U"
          grep -Fq 'tajwid' "$A"
          grep -Fq 'fcat97/tajweedApi' "$N"
          grep -Fq 'MIT' "$N"

          ! grep -R -Fq 'text_uthmani_tajweed' app/src/main app/build.gradle.kts
          ! find app/src/main -type f \( -iname '*qcf*' -o -iname '*tajweed*.ttf' -o -iname '*tajweed*.otf' \) | grep -q .
          grep -Fq 'quranSourceCommit = "a5284b17034d36567e4a4bac982a17ba56837448"' app/build.gradle.kts
          grep -Fq '<item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>' app/src/main/res/values/themes.xml
          grep -Fq 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -Fq 'minSdk = 28' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3

      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Unit tests instrumentation compile and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace

      - name: Verify generated Quran corpus and APK contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('app/build/generated/quranAssets'); q=root/'quran'
          verses=[]
          for line in (q/'quran-uthmani.txt').read_text(encoding='utf-8').splitlines():
              p=line.split('|',2)
              if len(p)==3 and p[0].isdigit() and p[1].isdigit(): verses.append(p)
          assert len(verses)==6236
          assert len({v[0] for v in verses})==114
          assert len(list((root/'mushaf').glob('[0-9][0-9][0-9].svg')))==604
          assert len(json.loads((root/'mushaf-surah.json').read_text(encoding='utf-8')))==114
          assert 'MIT' in (root/'QURAN_SVG_LICENSE.txt').read_text(encoding='utf-8')
          assert len(list((root/'mushaf-warsh').glob('[0-9][0-9][0-9].svg')))==604
          surahs=json.loads((root/'mushaf-warsh-surah.json').read_text(encoding='utf-8'))
          assert len(surahs)==114
          assert sum(int(s['ayahCount']) for s in surahs)==6214
          PY
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.archimedeprojects.arihna'" /tmp/badging.txt
          grep -F "sdkVersion:'28'" /tmp/badging.txt
          grep -F "targetSdkVersion:'37'" /tmp/badging.txt
          grep -F "compileSdkVersion='37'" /tmp/badging.txt
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | awk '{print $1}')" = "$GEONAMES_SHA256"

  api28-full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b90473abc2e56111b87901710ae973f0419e345d
          fetch-depth: 0
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          ! git diff --name-only "$SPEC_SHA..$CANDIDATE_SHA" | grep -E '/(prayers|location|qibla)/'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - run: sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Require zero instrumentation failures errors and skips
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files, 'no connected test XML found'
          tests=failures=errors=skipped=0
          for f in files:
              root=ET.parse(f).getroot()
              tests += int(root.attrib.get('tests','0'))
              failures += int(root.attrib.get('failures','0'))
              errors += int(root.attrib.get('errors','0'))
              skipped += int(root.attrib.get('skipped',root.attrib.get('disabled','0')))
          print(f'API28_CONNECTED_XML tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 87, tests
          assert failures == errors == skipped == 0, (failures,errors,skipped)
          PY

  api36-quran-and-permission-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b90473abc2e56111b87901710ae973f0419e345d
          fetch-depth: 0
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          ! git diff --name-only "$SPEC_SHA..$CANDIDATE_SHA" | grep -E '/(prayers|location|qibla)/'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - run: sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.archimedeprojects.arihna.feature.quran.QuranFullscreenAndroidTest --stacktrace
            P=com.archimedeprojects.arihna
            ./gradlew :app:installDebug --stacktrace
            adb shell pm revoke "$P" android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm revoke "$P" android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant "$P" android.permission.ACCESS_COARSE_LOCATION
            adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=false'
            adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -1 | grep -q 'granted=true'
            adb shell pm grant "$P" android.permission.ACCESS_FINE_LOCATION
            adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=true'
            adb shell pm revoke "$P" android.permission.ACCESS_FINE_LOCATION
            adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -1 | grep -q 'granted=true'
            echo API36_PERMISSION_MATRIX_SUCCESS | tee /tmp/api36-permission-matrix.txt
      - name: Require Quran tests and permission matrix success
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/api36-permission-matrix.txt
          grep -Fq API36_PERMISSION_MATRIX_SUCCESS /tmp/api36-permission-matrix.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files, 'no connected Quran test XML found'
          tests=failures=errors=skipped=0
          for f in files:
              root=ET.parse(f).getroot()
              tests += int(root.attrib.get('tests','0'))
              failures += int(root.attrib.get('failures','0'))
              errors += int(root.attrib.get('errors','0'))
              skipped += int(root.attrib.get('skipped',root.attrib.get('disabled','0')))
          print(f'API36_QURAN_XML tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 10, tests
          assert failures == errors == skipped == 0, (failures,errors,skipped)
          PY
