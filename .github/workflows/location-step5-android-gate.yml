name: Location STEP5 closure docs

on:
  push:
    branches:
      - location-step5-ci

permissions:
  contents: write

jobs:
  close-step5-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-step5-ci
          fetch-depth: 0

      - name: Apply closure documentation
        run: python3 .github/step5-close.py

      - name: Restore final tree and commit
        run: |
          git show 7f59c55da954347a1db5c17fe41c2cb07309184c:.github/workflows/location-step5-android-gate.yml > .github/workflows/location-step5-android-gate.yml
          rm .github/step5-close.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_SPEC.md .github/workflows/location-step5-android-gate.yml .github/step5-close.py
          git commit -m "docs(location): close step 5 LocationManager integration"
          git push origin HEAD:location-step5-ci
