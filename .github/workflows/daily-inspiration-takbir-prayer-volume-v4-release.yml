name: Daily inspiration takbir prayer volume v4 verified prerelease

on:
  push:
    branches:
      - driver/daily-inspiration-takbir-prayer-volume-v4-release-20260925
    paths:
      - .github/workflows/daily-inspiration-takbir-prayer-volume-v4-release.yml

permissions:
  actions: read
  contents: write

jobs:
  build-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RUNTIME_SHA: ab1051c43514b4595b92ae3533a3ee644b41dd29
      SPEC_SHA: a72bb5bcc57a15335f143f642b70447e7cf7d5ff
      VERIFIED_GATE_RUN: '36169784286'
      VERIFIED_STATIC_JOB: '108186229433'
      VERIFIED_API28_JOB: '108186229507'
      VERIFIED_API36_JOB: '108186229245'
      SIGNING_SOURCE_SHA: ce23a7f78695be95c7f8dfd2bcedbe22544da94c
      DEBUG_CERT_SHA256_COMPACT: 1397008c1f962dbbd36dd8a8ea0216afdd06e4b2b3e08bc0f6d4b54344d7b0fa
      DEBUG_KEYSTORE_SHA256: bc9057f26ad6de7efb70a5df06effb1ed259f1d015c3f062d0f757b3f0983b72
      GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
      FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
      FROZEN_ASSET_APK: arihna-settings-s25-premium.apk
      TAKBIR_SHA256: ccb7a98ba419b9e1163e57a41423016766fae9c07a004862423c757bab5985c3
      TAKBIR_SIZE: '21136'
      PACKAGE_NAME: com.archimedeprojects.arihna
      RELEASE_TAG: daily-inspiration-takbir-volume-ab1051c4-20260925
      APK_NAME: arihna-daily-takbir-volume.apk

    steps:
      - name: Checkout exact promoted runtime
        uses: actions/checkout@v4
        with:
          ref: ab1051c43514b4595b92ae3533a3ee644b41dd29
          fetch-depth: 0

      - name: Verify promoted runtime and definitive gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$RUNTIME_SHA"
          for JOB in "$VERIFIED_STATIC_JOB" "$VERIFIED_API28_JOB" "$VERIFIED_API36_JOB"; do
            ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB" --jq '[(.id|tostring),(.run_id|tostring),.status,.conclusion] | join(" ")')"
            test "$ACTUAL" = "$JOB $VERIFIED_GATE_RUN completed success"
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_GATE_RUN" --jq '[.status,.conclusion] | join(" ")')" = 'completed success'
          ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Restore frozen GeoNames and persistent signer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames "$HOME/.android"
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
          git fetch --depth=1 origin location-step5-device-test
          git cat-file -e "$SIGNING_SOURCE_SHA^{commit}"
          git show "$SIGNING_SOURCE_SHA:.github/test-signing/arihna-debug.keystore.b64" | base64 --decode > "$HOME/.android/debug.keystore"
          test "$(sha256sum "$HOME/.android/debug.keystore" | awk '{print $1}')" = "$DEBUG_KEYSTORE_SHA256"

      - name: Verify feature release contracts
        shell: bash
        run: |
          set -euo pipefail
          M=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/domain/AlarmModels.kt
          R=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          V=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/data/preferences/PrayerAlertPreferences.kt
          N=app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspirationNotifications.kt
          X=app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          grep -Fq 'TAKBIR_X2("takbir-x2", "Takbīr breve · Allahu Akbar ×2")' "$M"
          grep -Fq 'if (variant == AdhanVariant.TAKBIR_X2) 2 else 1' "$R"
          grep -Fq 'TAKBIR_X2 -> R.raw.takbir_allahuakbar_cc0' "$R"
          grep -Fq 'alarm.prayer.volume.' "$V"
          grep -Fq 'DEFAULT_PRAYER_VOLUME_PERCENT = 100' "$V"
          grep -Fq 'settings-daily-inspiration-switch' "$X"
          grep -Fq 'settings-daily-inspiration-time' "$X"
          grep -Fq 'setAndAllowWhileIdle' "$N"
          grep -Fq 'dailyInspirationFor(localDate)' "$N"
          grep -Fq 'DEFAULT_DAILY_INSPIRATION_HOUR = 8' "$N"
          grep -Fq "$TAKBIR_SHA256" app/build.gradle.kts
          grep -Fq 'Allahuakbar.opus' docs/audio/ADHAN_SOURCES.md
          S=app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          C=app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranCorpus.kt
          P=app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt
          T=app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranImlaiAndroidTest.kt
          grep -Fq 'quran-writing-imlai' "$S"
          grep -Fq 'quran-imlai-rtl-pager' "$S"
          grep -Fq 'quran-imlai-fullscreen-reader' "$S"
          grep -Fq 'fun loadImlai' "$C"
          grep -Fq 'migrateLegacyEasy' "$P"
          grep -Fq 'imlaiCorpusIsCompleteAndStructurallyAlignedWithPinnedHafs' "$T"
          grep -Fq 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -Fq 'minSdk = 28' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml

      - name: Apply transient persistent debug signing config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          assert 'signingConfigs {' not in s
          match = re.search(r'(?m)^android\s*\{\s*\n', s)
          assert match is not None
          insert = '''    signingConfigs {
              getByName("debug") {
                  storeFile = file("${System.getProperty("user.home")}/.android/debug.keystore")
                  storePassword = "android"
                  keyAlias = "androiddebugkey"
                  keyPassword = "android"
              }
          }

          '''
          p.write_text(s[:match.end()] + insert + s[match.end():], encoding='utf-8')
          PY
          test "$(git diff --name-only | tr -d '\n')" = 'app/build.gradle.kts'

      - name: Build exact promoted runtime
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK corpora package SDK signer and digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/build/generated/quranAssets')/'quran'
          def rows(path):
              out=[]
              for line in path.read_text(encoding='utf-8').splitlines():
                  p=line.split('|',2)
                  if len(p)==3 and p[0].isdigit() and p[1].isdigit():
                      out.append((int(p[0]),int(p[1]),p[2]))
              return out
          uth=rows(root/'quran-uthmani.txt'); iml=rows(root/'quran-imlai.txt')
          assert len(uth)==len(iml)==6236
          assert [(s,a) for s,a,_ in uth] == [(s,a) for s,a,_ in iml]
          assert len({s for s,_,_ in iml})==114
          raw=(root/'quran-imlai.txt').read_text(encoding='utf-8')
          assert 'Tanzil Quran Text (Simple, Version 1.1)' in raw
          assert 'License: Creative Commons Attribution 3.0' in raw
          PY
          T="$(find app/build/generated/takbirRes -type f -name takbir_allahuakbar_cc0.opus | head -1)"
          test -n "$T"
          test "$(stat -c '%s' "$T")" = "$TAKBIR_SIZE"
          test "$(sha256sum "$T" | awk '{print $1}')" = "$TAKBIR_SHA256"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          tr '[:upper:]' '[:lower:]' < /tmp/apksigner.txt | tr -d ':' | grep -F "$DEBUG_CERT_SHA256_COMPACT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='$PACKAGE_NAME'" /tmp/badging.txt
          grep -F "sdkVersion:'28'" /tmp/badging.txt
          grep -F "targetSdkVersion:'37'" /tmp/badging.txt
          grep -F "compileSdkVersion='37'" /tmp/badging.txt
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | awk '{print $1}')" = "$GEONAMES_SHA256"
          unzip -p "$APK" assets/quran/quran-imlai.txt | grep -Fq 'Tanzil Quran Text (Simple, Version 1.1)'
          unzip -l "$APK" | grep -Fq 'res/raw/takbir_allahuakbar_cc0.opus'
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | awk '{print $1}' > /tmp/apk-sha256.txt
          stat -c '%s' "$APK_NAME" > /tmp/apk-size.txt
          echo "FINAL_APK_SHA256=$(cat /tmp/apk-sha256.txt)"
          echo "FINAL_APK_SIZE=$(cat /tmp/apk-size.txt)"

      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA="$(cat /tmp/apk-sha256.txt)"
          APK_SIZE="$(cat /tmp/apk-size.txt)"
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RUNTIME_SHA" \
            --title 'Arihna — Daily inspiration + Takbīr ×2 + prayer volume — S25 validation' \
            --prerelease \
            --notes "Galaxy S25 validation build for daily inspiration notification, dedicated Takbīr ×2 prayer alert, and independent per-prayer playback volume. The Takbīr option plays the pinned CC0 single utterance الله أكبر exactly twice, then stops. Prayer volume is local 0–100% gain and does not permanently change Android global alarm volume. Daily inspiration is opt-in, defaults to 08:00 local, allows a user-selected time, reuses the Home daily inspiration source, and blocks same-date duplicates. Existing full Adhan variants, prayer scheduling, Quran Imlāʾī/Hafs/Tajwid/Warsh, location/Qibla and custom alarms are preserved. SPEC $SPEC_SHA; runtime $RUNTIME_SHA; exact-SHA gate $VERIFIED_GATE_RUN PASS (static/build, API28 full suite, API36 feature+Quran+permission matrix). APK bytes $APK_SIZE; APK SHA-256 $APK_SHA. Physical Galaxy S25 validation remains required before stable promotion."

      - name: Redownload and verify published APK and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/apk-sha256.txt)"
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RUNTIME_SHA"
          JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$JSON")" = false
          test "$(jq -r '.prerelease' <<<"$JSON")" = true
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$RUNTIME_SHA"
          test "$(jq '.assets | length' <<<"$JSON")" = 1
          test "$(jq -r '.assets[0].name' <<<"$JSON")" = "$APK_NAME"
          test "$(jq -r '.assets[0].state' <<<"$JSON")" = uploaded
          test "$(jq -r '.assets[0].digest' <<<"$JSON")" = "sha256:$EXPECTED_SHA"
          rm -rf /tmp/releasecheck && mkdir -p /tmp/releasecheck
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME" --dir /tmp/releasecheck
          DOWNLOADED="/tmp/releasecheck/$APK_NAME"
          test "$(sha256sum "$DOWNLOADED" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(stat -c '%s' "$DOWNLOADED")" = "$(cat /tmp/apk-size.txt)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$DOWNLOADED" | tee /tmp/release-apksigner.txt
          tr '[:upper:]' '[:lower:]' < /tmp/release-apksigner.txt | tr -d ':' | grep -F "$DEBUG_CERT_SHA256_COMPACT"
          echo "VERIFIED_RELEASE_URL=$(jq -r '.html_url' <<<"$JSON")"
          echo "VERIFIED_ASSET_URL=$(jq -r '.assets[0].browser_download_url' <<<"$JSON")"
          echo "VERIFIED_APK_SHA256=$EXPECTED_SHA"
          echo "VERIFIED_SIGNER_SHA256=$DEBUG_CERT_SHA256_COMPACT"
