name: Alarms step3 spec writer

on:
  push:
    branches:
      - alarms-step3-writer-20260904
    paths:
      - .github/workflows/alarms-step3-spec-writer.yml

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 7579490c58e354a5423e76d4d8ad4e1f7749dfac
    steps:
      - name: Checkout writer branch
        uses: actions/checkout@v4

      - name: Preserve patch script
        run: cp .github/scripts/alarms_step3_spec.py /tmp/alarms_step3_spec.py

      - name: Verify exact runtime base
        run: |
          git fetch origin main alarms-step3-spec
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/alarms-step3-spec)" = "$BASE_SHA"
          git checkout --detach "$BASE_SHA"

      - name: Apply STEP 3 spec only
        run: python3 /tmp/alarms_step3_spec.py

      - name: Verify documentation-only scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          grep -q 'STEP 2 closure / STEP 3 authorization — APPROVED 2026-09-04' PROJECT_SPEC.md
          grep -q 'STEP 3 — Android scheduler + capability layer: AUTHORIZED / IN PROGRESS' PROJECT_SPEC.md
          grep -q 'STEP 4 — Prayer-linked reconciliation: NOT STARTED' PROJECT_SPEC.md
          grep -q 'SCHEDULE_EXACT_ALARM' PROJECT_SPEC.md
          grep -q 'USE_EXACT_ALARM' PROJECT_SPEC.md

      - name: Commit exact spec candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(alarms): authorize step 3 scheduler'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "PROJECT_SPEC.md"
          git push origin HEAD:refs/heads/alarms-step3-spec
