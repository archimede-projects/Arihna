name: Spec Home navigation daily content Islamic identity

on:
  push:
    branches:
      - spec-home-feedback-driver

permissions:
  contents: write

jobs:
  create-spec-commit:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: f61133c0dcab8b1f1e7255967b81c280f064e3f9
      SPEC_BRANCH: spec-home-nav-inspiration-islamic-20260906
      SPEC_APPEND_B64: 
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline and create spec-only commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git checkout -B "$SPEC_BRANCH" "$BASE_SHA"
          printf '%s' "$SPEC_APPEND_B64" | base64 -d >> PROJECT_SPEC.md
          git config user.name "Arihna Spec Bot"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT_SPEC.md
          test "$(git diff --cached --name-only)" = "PROJECT_SPEC.md"
          git commit -m "spec(home): navigation, daily content and Islamic visual identity"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "$SPEC_BRANCH"
          echo "SPEC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report exact spec SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "SPEC_SHA=$SPEC_SHA"
          git show --stat --oneline "$SPEC_SHA"
