name: premium-quran-api28-fix

on:
  push:
    branches: [premium-quran-api28-fix-driver-20260907]

permissions:
  contents: write

jobs:
  fix-staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-quran-daily-hijri-v1
          fetch-depth: 0
      - name: Restore historical inspiration interaction anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt')
          text = p.read_text(encoding='utf-8')
          old = 'appText("Leggi e condividi", "اقرأ وشارك")'
          new = 'appText("Tocca per leggere e condividere", "اقرأ وشارك")'
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fq 'appText("Tocca per leggere e condividere", "اقرأ وشارك")' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          git diff --check
      - name: Commit staging fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          git commit -m 'fix: preserve inspiration interaction anchor'
          git push origin HEAD:premium-quran-daily-hijri-v1
