name: alarms-popup-persistent-spec-writer-temp

on:
  push:
    branches: [alarms-popup-persistent-spec-writer-temp]

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a767eaa1f722a9c62ec3dbf3204791ee5b1f77a4
          fetch-depth: 0
      - name: Append authorized S25 popup remediation spec
        env:
          SPEC_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a767eaa1f722a9c62ec3dbf3204791ee5b1f77a4"
          printf '\n' >> PROJECT_SPEC.md
          printf '%s' "$SPEC_B64" | base64 --decode >> PROJECT_SPEC.md
          git diff --check -- PROJECT_SPEC.md
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c alarms-popup-persistent-spec
          git add PROJECT_SPEC.md
          git commit -m "docs(alarms): authorize persistent popup remediation"
          git push origin HEAD:refs/heads/alarms-popup-persistent-spec
