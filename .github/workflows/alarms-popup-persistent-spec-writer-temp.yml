name: alarms-popup-persistent-spec-writer-temp

on:
  push:
    branches:
      - alarms-popup-persistent-spec-writer-temp

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a767eaa1f722a9c62ec3dbf3204791ee5b1f77a4
          fetch-depth: 0
      - name: Append authorized S25 popup remediation spec
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a767eaa1f722a9c62ec3dbf3204791ee5b1f77a4"
          cat >> PROJECT_SPEC.md <<'EOF'

#### Galaxy S25 alarm heads-up + ringing controls correction — APPROVED 2026-09-05

Physical Galaxy S25 validation of runtime `a767eaa1f722a9c62ec3dbf3204791ee5b1f77a4` remains **FAIL** for the alarm presentation path. The alarm sound is delivered and the Arihna ringing activity is reachable, but on an unlocked device the first alarm surface appears as a small transient heads-up notification without visible `Interrompi` / `Rinvia` controls, and tapping the notification opens the Arihna full-screen ringing UI with only `Stop`. The user explicitly requires a substantially larger alarm popup with direct stop/snooze controls, plus faster diagnostic iteration.

Authorized corrective scope is strictly limited to:

- Keep the standards-based alarm notification path; do **not** request draw-over-other-apps / `SYSTEM_ALERT_WINDOW` or any unrelated permission.
- Always attach the existing alarm full-screen PendingIntent to the alarm notification via `setFullScreenIntent(...)`, including the Android fallback case where full-screen special access is unavailable. This is required so Android 13+ can present the alarm heads-up treatment associated with full-screen intents instead of Arihna downgrading itself to a normal transient notification.
- Preserve `CATEGORY_ALARM`, `IMPORTANCE_HIGH`, ongoing/non-auto-cancel behavior, foreground ringing service, exact-alarm policy, and the persistent Arihna debug signer.
- The heads-up / notification surface must expose both user actions: **Interrompi** and **Rinvia**. `Rinvia` remains the already-authorized 5-minute snooze behavior.
- The Arihna ringing activity must expose both **Interrompi** and **Rinvia 5 min**; no longer ship a ringing screen with only Stop.
- The Settings diagnostic action **Test sveglia** must schedule after **20 seconds** instead of 60 seconds. The same 20-second delay applies to Test Adhan so the paired hardware checks stay symmetric. No production alarm timing is changed.
- No changes to prayer-time mathematics, Qibla, location, prayer-reminder placement, personal-alarm editor semantics, selected ringtone behavior, recurrence, persistence, or any other screen are authorized in this round.
- Because the exact visual lifetime/geometry of Android heads-up UI is controlled by System UI / One UI, validation must require the strongest standards-compliant alarm heads-up available to a third-party app without overlay permission; Arihna must not claim it can force Samsung Clock's privileged system overlay pixel-for-pixel.

Validation for this correction must cover compilation/unit regression, Android API28 connected regression with zero skipped, modern API36 notification/full-screen action wiring, and a new Galaxy S25 APK using the persistent debug identity. Physical acceptance remains on the Galaxy S25.
EOF
          git diff --check -- PROJECT_SPEC.md
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B alarms-popup-persistent-spec
          git add PROJECT_SPEC.md
          git commit -m "docs(alarms): authorize persistent popup remediation"
          git push --force-with-lease origin HEAD:refs/heads/alarms-popup-persistent-spec
