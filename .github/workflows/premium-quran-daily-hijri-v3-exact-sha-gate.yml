name: Premium Quran Daily Hijri v3 exact-SHA gate

on:
  push:
    branches: [premium-quran-daily-hijri-v3-gate-driver-20260907]

permissions:
  contents: read

env:
  SPEC_SHA: 31a2a9f4e86aa5555b87224c9350d7141be5e83a
  CANDIDATE_SHA: e3350b74e927d5dbc411f85be86be95cf652e93c
  GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
  FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
  FROZEN_ASSET_APK: arihna-settings-s25-premium.apk

jobs:
  static-jvm-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3350b74e927d5dbc411f85be86be95cf652e93c
          fetch-depth: 0
      - name: Verify exact lineage and redesign contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          COLOR=app/src/main/java/com/archimedeprojects/arihna/core/ui/theme/Color.kt
          for token in '0xFFFCF8F0' '0xFF0E654B' '0xFF064A37' '0xFFE8F0EA' '0xFFD4AA46' '0xFF202824'; do grep -Fq "$token" "$COLOR"; done
          grep -Fq 'quranSvgCommit = "78d97544bfdc57e9f04bc97ace3f857ed972d772"' app/build.gradle.kts
          grep -Fq 'check(mushafPages == 604)' app/build.gradle.kts
          grep -Fq 'implementation("com.caverock:androidsvg:1.4")' app/build.gradle.kts
          Q=app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          for token in 'quran-mode-hafs' 'quran-mode-easy' 'quran-surah-selector' 'quran-mushaf-page-' 'quran-bookmark-toggle' 'HorizontalPager'; do grep -Fq "$token" "$Q"; done
          P=app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt
          for token in 'mushaf_bookmarks_v1' 'recent_mushaf_pages_v1' 'last_mushaf_page_v1'; do grep -Fq "$token" "$P"; done
          D=app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          for token in 'home-inspiration-arabic' 'home-inspiration-source' 'home-daily-action' 'home-daily-action-arabic' 'Tocca per leggere e condividere'; do grep -Fq "$token" "$D"; done
          H=app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt').read_text()
          assert s.index('DailyInspirationCard(state.localDate)') < s.index('QuickActions(') < s.index('DailyActionCard(state.localDate)')
          PY
          C=app/src/main/java/com/archimedeprojects/arihna/feature/home/PremiumCalendarDialog.kt
          for token in 'home-calendar-hijri' 'home-calendar-gregorian' 'home-hijri-month-grid' 'IslamicCalendar'; do grep -Fq "$token" "$C"; done
          S=app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          grep -Fq 'settings-alarm-volume-slider' "$S"
          grep -Fq 'thumbColor = SettingsText' "$S"
          grep -Fq 'settings-language-arabic' "$S"
          grep -Fq 'LayoutDirection.Rtl' app/src/main/java/com/archimedeprojects/arihna/app/ArihnaApp.kt
          grep -F 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -F 'minSdk = 28' app/build.gradle.kts
          grep -F 'compileSdk = 37' app/build.gradle.kts
          grep -F 'targetSdk = 37' app/build.gradle.kts
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: true}
      - uses: android-actions/setup-android@v3
      - name: Restore frozen GeoNames
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Unit tests, instrumentation compile and APK
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace
      - name: Verify Quran, Mushaf and APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('app/build/generated/quranAssets'); q=root/'quran'
          verses=[]
          for line in (q/'quran-uthmani.txt').read_text(encoding='utf-8').splitlines():
              p=line.split('|',2)
              if len(p)==3 and p[0].isdigit() and p[1].isdigit(): verses.append(p)
          assert len(verses)==6236 and len({v[0] for v in verses})==114
          assert len(json.loads((q/'juz-info.json').read_text(encoding='utf-8')))==30
          assert len(json.loads((q/'hizb-info.json').read_text(encoding='utf-8'))) >= 60
          assert 'Creative Commons Attribution 3.0' in (q/'TANZIL_TEXT_README.md').read_text(encoding='utf-8')
          assert len(list((root/'mushaf').glob('*.svg')))==604
          assert len(json.loads((root/'mushaf-surah.json').read_text(encoding='utf-8')))==114
          assert 'MIT' in (root/'QURAN_SVG_LICENSE.txt').read_text(encoding='utf-8')
          PY
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.archimedeprojects.arihna'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'28'"
          "$AAPT" dump badging "$APK" | grep -F "targetSdkVersion:'37'"
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | cut -d' ' -f1)" = "$GEONAMES_SHA256"
          test "$(unzip -l "$APK" 'assets/mushaf/*.svg' | awk '$4 ~ /^assets\/mushaf\/[0-9][0-9][0-9]\.svg$/ {c++} END{print c+0}')" -eq 604

  api28-full-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: e3350b74e927d5dbc411f85be86be95cf652e93c, fetch-depth: 0}
      - name: Verify exact lineage
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: true}
      - uses: android-actions/setup-android@v3
      - name: Restore frozen GeoNames
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - run: sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Require zero instrumentation failures errors and skips
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files, 'no connected test XML found'
          tests=failures=errors=skipped=0
          for f in files:
              root=ET.parse(f).getroot()
              tests += int(root.attrib.get('tests','0'))
              failures += int(root.attrib.get('failures','0'))
              errors += int(root.attrib.get('errors','0'))
              skipped += int(root.attrib.get('skipped',root.attrib.get('disabled','0')))
          print(f'CONNECTED_XML tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 79, tests
          assert failures == errors == skipped == 0, (failures,errors,skipped)
          PY

  api36-location-permission-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: e3350b74e927d5dbc411f85be86be95cf652e93c, fetch-depth: 0}
      - name: Verify exact lineage
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: true}
      - uses: android-actions/setup-android@v3
      - name: Restore frozen GeoNames
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - run: sudo chmod 666 /dev/kvm || true
      - name: Prepare location permission matrix
        shell: bash
        run: |
          cat >/tmp/matrix.sh <<'SH'
          #!/bin/bash
          set -euo pipefail
          P=com.archimedeprojects.arihna
          ./gradlew :app:installDebug --stacktrace
          adb shell pm revoke "$P" android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm revoke "$P" android.permission.ACCESS_COARSE_LOCATION || true
          adb shell pm grant "$P" android.permission.ACCESS_COARSE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=false'
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -1 | grep -q 'granted=true'
          adb shell pm grant "$P" android.permission.ACCESS_FINE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=true'
          adb shell pm revoke "$P" android.permission.ACCESS_FINE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -1 | grep -q 'granted=true'
          echo API36_PERMISSION_MATRIX_SUCCESS
          SH
          chmod +x /tmp/matrix.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash /tmp/matrix.sh
