name: Prayer engine Android 28 verification

on:
  push:
    branches:
      - prayer-engine-verify

permissions:
  contents: read

jobs:
  hijrah-api28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 37 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Compile prayer engine before emulator
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Verify HijrahChronology on Android 9 / API 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
