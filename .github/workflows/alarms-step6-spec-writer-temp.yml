name: Alarms STEP 6 spec writer

on:
  push:
    branches:
      - alarms-step6-spec-writer-temp
    paths:
      - .github/workflows/alarms-step6-spec-writer-temp.yml

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-24.04
    env:
      STEP5_RUNTIME_SHA: 310413e886e9d7d54ea6f86c3fc7849360069c49
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify writer ancestry and current main
        run: |
          git merge-base --is-ancestor "$STEP5_RUNTIME_SHA" HEAD
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$STEP5_RUNTIME_SHA"
          cp .github/alarms-step6-spec-writer.py /tmp/alarms-step6-spec-writer.py

      - name: Create STEP 6 spec commit directly above STEP 5 runtime
        run: |
          git checkout -B alarms-step6-spec origin/main
          python3 /tmp/alarms-step6-spec-writer.py
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_SPEC.md
          git commit -m "docs(alarms): close step 5 and authorize step 6"
          test "$(git rev-parse HEAD^)" = "$STEP5_RUNTIME_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "PROJECT_SPEC.md"
          git push --force-with-lease origin HEAD:alarms-step6-spec
