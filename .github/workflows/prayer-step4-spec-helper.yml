name: Prayer STEP 4 spec helper

on:
  push:
    branches:
      - prayer-integration-step4-spec-helper

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch STEP 4 authorization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('PROJECT_SPEC.md')
          text = path.read_text()

          replacements = {
              '### 5.3 Prayer Engine + Location integration — MILESTONE OPEN / STEP 3 CLOSED':
              '### 5.3 Prayer Engine + Location integration — MILESTONE OPEN / STEP 4 IN PROGRESS',
              'No UI, `PrayerScheduleViewModel`, countdown ticker, Home panel, `PrayerTimeCalculator` implementation/formula change, Location behavior/key change, or Prayer Settings behavior/key change is authorized in STEP 3. STEP 3 is **CLOSED** on exact clean candidate `2476ae86f585a6849f6f2104cddd215c6abf7d0f` after definitive run `33357287019` / job `99381759479`; STEP 4 remains **NOT STARTED** and requires separate authorization.':
              'No UI, `PrayerScheduleViewModel`, countdown ticker, Home panel, `PrayerTimeCalculator` implementation/formula change, Location behavior/key change, or Prayer Settings behavior/key change is authorized in STEP 3. STEP 3 is **CLOSED** on exact clean candidate `2476ae86f585a6849f6f2104cddd215c6abf7d0f` after definitive run `33357287019` / job `99381759479`. STEP 4 presentation/countdown is now **IN PROGRESS** under the separately authorized scope below.',
              '4. **STEP 4 — presentation/countdown: NOT STARTED.** Implement `PrayerScheduleViewModel`, next-prayer/countdown behavior and tests.':
              '4. **STEP 4 — presentation/countdown: IN PROGRESS.** Implement `PrayerScheduleViewModel` plus pure presentation models and a testable one-second ticker. The ViewModel depends only on `PrayerScheduleRepository`, injected `Clock`, and ticker; maps domain state to `PrayerScheduleUiState`; updates countdown from `targetInstant - Clock.instant()` without recalculation; and calls repository `refresh()` only when an active countdown reaches zero so STEP 3 can re-derive the next prayer from its existing today/tomorrow cache. Pure ticker events before zero must not call the repository. No Compose UI or changes to PrayerScheduleRepository, Prayer Settings, Location, or Prayer Engine are authorized.',
              '### Prayer Engine + Location integration milestone — OPEN / STEP 3 CLOSED':
              '### Prayer Engine + Location integration milestone — OPEN / STEP 4 IN PROGRESS',
              '**STEP 3 schedule orchestration is CLOSED** on clean technical commit `2476ae86f585a6849f6f2104cddd215c6abf7d0f` after definitive exact-SHA run `33357287019` / job `99381759479` passed unit regression, `assembleDebug`, and Android 9/API28 instrumentation (**35/35, 0 failed, 0 skipped**). STEP 4 remains **NOT STARTED** and requires separate authorization.':
              '**STEP 3 schedule orchestration is CLOSED** on clean technical commit `2476ae86f585a6849f6f2104cddd215c6abf7d0f` after definitive exact-SHA run `33357287019` / job `99381759479` passed unit regression, `assembleDebug`, and Android 9/API28 instrumentation (**35/35, 0 failed, 0 skipped**). **STEP 4 presentation/countdown is IN PROGRESS** after explicit authorization; STEP 5 remains **NOT STARTED**.',
              '6. **Current: Prayer Engine + Location integration — MILESTONE OPEN / STEP 3 CLOSED.** Seven-step sequence approved: STEP 1 spec-first — **CLOSED** → STEP 2 Prayer settings persistence — **CLOSED** → STEP 3 schedule orchestration — **CLOSED** → STEP 4 presentation/countdown — **NOT STARTED** → STEP 5 functional Home panel — NOT STARTED → STEP 6 full Prayer+Location+Integration regression — NOT STARTED → STEP 7 docs-only closure — NOT STARTED → STOP. STEP 3 is closed on clean technical commit `2476ae86f585a6849f6f2104cddd215c6abf7d0f` after definitive exact-SHA run `33357287019` / job `99381759479`; no STEP 4 work is authorized without separate confirmation.':
              '6. **Current: Prayer Engine + Location integration — MILESTONE OPEN / STEP 4 IN PROGRESS.** Seven-step sequence approved: STEP 1 spec-first — **CLOSED** → STEP 2 Prayer settings persistence — **CLOSED** → STEP 3 schedule orchestration — **CLOSED** → STEP 4 presentation/countdown — **IN PROGRESS** → STEP 5 functional Home panel — **NOT STARTED** → STEP 6 full Prayer+Location+Integration regression — **NOT STARTED** → STEP 7 docs-only closure — **NOT STARTED** → STOP. STEP 4 is explicitly authorized only for ViewModel/presentation/countdown plus pure JVM tests; STEP 5 Compose UI remains unauthorized.'
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          anchor = '#### Recalculation policy\n'
          if text.count(anchor) != 1:
              raise SystemExit('Recalculation policy anchor missing or duplicated')

          step4 = '''#### STEP 4 authorization / scope\n\nSTEP 4 presentation/countdown is explicitly authorized after STEP 3 closure. Implement `PrayerScheduleViewModel` as a presentation-only boundary depending exclusively on `PrayerScheduleRepository`, an injected testable `Clock`, and a testable ticker abstraction. It exposes `StateFlow<PrayerScheduleUiState>` and must not depend directly on `LocationManager`, DataStore, `CityRepository`, Adhan, provider callbacks, or `PrayerTimeCalculator`.\n\nThe production ticker cadence is **1 second**. Each tick only recomputes the remaining duration as `max(Duration.ZERO, targetInstant - Clock.instant())` for the currently exposed `NextPrayer`; ordinary ticks must not call `PrayerScheduleRepository.refresh()` or otherwise trigger Location/Prayer calculation. When an active countdown first reaches zero, the ViewModel may call the repository's idempotent `refresh()` exactly to let STEP 3 re-derive `nextPrayer` from its already-calculated today/tomorrow in-memory data. This does not authorize a new calculation: STEP 3 remains responsible for recalculating only if its effective input/local civil date actually changed. Repeated zero ticks must be guarded so they do not spam `refresh()` while awaiting a new repository state.\n\n`PrayerScheduleState` maps to presentation state without inventing values: Loading remains loading; `NoLocation` produces a clear location-required presentation message; `Ready` exposes location/source context, current-day schedule, calculation method, next prayer/time and countdown data for future STEP 5 rendering; `CalculationUnavailable` remains a controlled unavailable presentation. Presentation models may retain domain values needed by the future Compose layer, but no Compose UI is authorized in STEP 4.\n\nPure/JVM tests use a fake/recording `PrayerScheduleRepository`, controlled `Clock`, and manual/test ticker. Required coverage includes NoLocation mapping/message, Ready next-prayer/countdown mapping, countdown decrement with no repository calls, exactly-once refresh when countdown reaches zero, transition to the next prayer after the fake repository emits the advanced cached state, `CalculationUnavailable`, and proof that ticker activity alone never causes spurious refresh/calculation behavior. No change to `PrayerScheduleRepository`, Prayer Settings, Location, Prayer Engine, or Home Compose UI is authorized. STEP 5 remains **NOT STARTED**.\n\n'''
          text = text.replace(anchor, step4 + anchor, 1)

          marker = '## 17. Change log\n'
          if text.count(marker) != 1:
              raise SystemExit('Change log marker missing or duplicated')
          entry = '''\n### 2026-08-31 — Prayer Engine + Location integration STEP 4 presentation/countdown authorized\n\nSTEP 3 is confirmed closed on docs commit `ec1c2cfe6b6b5089ae40e2ee2e805a6901366831`. STEP 4 is explicitly authorized for presentation only: `PrayerScheduleViewModel`, `PrayerScheduleUiState`, injected `Clock`, a testable **1-second** ticker, and pure/JVM tests. Countdown ticks calculate only the duration to the repository-provided `NextPrayer` and must not touch Location, DataStore, Adhan, `PrayerTimeCalculator`, or trigger ordinary repository refreshes. When an active countdown reaches zero, a guarded idempotent `refresh()` may ask STEP 3 to advance `nextPrayer` from its cached today/tomorrow data; STEP 3 alone decides whether a real recalculation is necessary because the local civil date/input changed. No Compose/Home UI and no modification to PrayerScheduleRepository, Prayer Settings, Location, or Prayer Engine is authorized. STEP 5 remains **NOT STARTED** pending separate approval after an exact-SHA STEP 4 gate.\n\n'''
          text = text.replace(marker, marker + entry, 1)

          if 'STEP 4 presentation/countdown — **IN PROGRESS**' not in text:
              raise SystemExit('STEP 4 current status invariant missing')
          if 'STEP 5 remains **NOT STARTED**' not in text:
              raise SystemExit('STEP 5 NOT STARTED invariant missing')

          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "PROJECT_SPEC.md"
          grep -q 'MILESTONE OPEN / STEP 4 IN PROGRESS' PROJECT_SPEC.md
          grep -q 'production ticker cadence is \*\*1 second\*\*' PROJECT_SPEC.md
          grep -q 'STEP 5 remains \*\*NOT STARTED\*\*' PROJECT_SPEC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(integration): authorize Prayer schedule STEP 4'
          git push origin HEAD:prayer-integration-step4-spec-helper
