name: Visual harmony Adhan volume candidate writer

on:
  push:
    branches:
      - visual-harmony-adhan-volume-impl-driver-20260907

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    env:
      SPEC_SHA: 75af29590447ebb717975641b506e98a4af22ec3
      CANDIDATE_BRANCH: visual-harmony-adhan-volume-v1
      GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
      FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
      FROZEN_ASSET_APK: arihna-settings-s25-premium.apk
    steps:
      - name: Checkout candidate root at approved spec
        uses: actions/checkout@v4
        with:
          ref: visual-harmony-adhan-volume-v1
          fetch-depth: 0
      - name: Verify exact spec parent state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SPEC_SHA"
          test "$(git rev-parse origin/$CANDIDATE_BRANCH)" = "$SPEC_SHA"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Set up Android
        uses: android-actions/setup-android@v3
      - name: Download verified open-license Adhan recordings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          curl -L --fail --retry 3 --retry-delay 2 -A 'Arihna Android build' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Muslim_calling_to_prayer.ogg' \
            -o app/src/main/res/raw/adhan_extended_cc0.ogg
          curl -L --fail --retry 3 --retry-delay 2 -A 'Arihna Android build' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Oraci%C3%B3n_Al-Azzan.ogg' \
            -o app/src/main/res/raw/adhan_heritage_pd.ogg
          test -s app/src/main/res/raw/adhan_extended_cc0.ogg
          test -s app/src/main/res/raw/adhan_heritage_pd.ogg
          test "$(head -c 4 app/src/main/res/raw/adhan_extended_cc0.ogg)" = 'OggS'
          test "$(head -c 4 app/src/main/res/raw/adhan_heritage_pd.ogg)" = 'OggS'
          echo "EXTENDED_SHA=$(sha256sum app/src/main/res/raw/adhan_extended_cc0.ogg | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "HERITAGE_SHA=$(sha256sum app/src/main/res/raw/adhan_heritage_pd.ogg | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Apply approved implementation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '    cmlTYWdlID0gQ29sb3IoMHhGRkU2RU FENykKcHJpdmF0ZSB2YWwgT3Jh cmlTYWdlU3Ryb25nID0gQ29sb3IoMHhGRkQ3REZDMikKcHJpdmF0ZSB2YWwgT3Jh cmlGb3Jlc3QgPSBDb2xvcigweEZGMTczQzMwKQpwcml2YXRlIHZhbCBPcmFyaUdyZWVuID0gQ29sb3IoMHhGRjBGNTEzMikKcHJpdmF0ZSB2YWwgT3Jh cmlHb2xkID0gQ29sb3IoMHhGRkM3OUIzQiknJycsICcnJ3ByaXZhdGUgdmFsIE9yYXJpSXZvcnkgPSBDb2xvcigweEZGMDMwQjA4KQpwcml2YXRlIHZhbCBPcmFyaUNyZWFtID0gQ29sb3IoMHhGRjBDMUExNSkKcHJpdmF0ZSB2YWwgT3Jh cmlTYWdlID0gQ29sb3IoMHhGRjExMjUxRCkKcHJpdmF0ZSB2YWwgT3Jh cmlTYWdlU3Ryb25nID0gQ29sb3IoMHhGRjE3MzgyQikKcHJpdmF0ZSB2YWwgT3Jh cmlGb3Jlc3QgPSBDb2xvcigweEZGRjdGMkU3KQpwcml2YXRlIHZhbCBPcmFyaUdyZWVuID0gQ29sb3IoMHhGRkQ4Qjk1QSkKcHJpdmF0ZSB2YWwgT3Jh cmlHb2xkID0gQ29sb3IoMHhGRkQ4Qjk1QSknJycsICJvcmFyaSBwYWxldHRlIikKb3JhcmkgPSByZXBsYWNlX29uY2Uob3JhcmksICJpbXBvcnQgY29tLmFyY2hpbWVkZXByb2plY3RzLmFyaWhuYS5mZWF0dXJlLmFsYXJtcy5BbGFybXNW  cmlJdm9yeSwgT3Jh cmlDcmVhbSwgT3Jh    ' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Restore frozen GeoNames asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Run candidate host tests and debug build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify assets and commit direct-child candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SPEC_SHA"
          grep -Fq 'AdhanVariant.EXTENDED -> R.raw.adhan_extended_cc0' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'AdhanVariant.HERITAGE -> R.raw.adhan_heritage_pd' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq "$EXTENDED_SHA" docs/audio/ADHAN_SOURCES.md
          grep -Fq "$HERITAGE_SHA" docs/audio/ADHAN_SOURCES.md
          ! grep -Fq 'settings-alarm-volume-slider' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          git config user.name 'IbnKhaldoun-svg'
          git config user.email 'essalih.idriss.w@gmail.com'
          git add app/src/main/java app/src/test docs/audio/ADHAN_SOURCES.md \
            app/src/main/res/raw/adhan_extended_cc0.ogg app/src/main/res/raw/adhan_heritage_pd.ogg
          git commit -m 'feat: unify visual identity expand Adhan and simplify volume'
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          git push origin HEAD:refs/heads/$CANDIDATE_BRANCH
