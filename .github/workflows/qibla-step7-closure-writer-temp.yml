name: Qibla STEP 7 docs writer
on:
  push:
    branches:
      - qibla-step7-closure-writer-temp
permissions:
  contents: write
jobs:
  write-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve patch script
        run: cp .github/qibla-step7-closure.py /tmp/qibla-step7-closure.py
      - name: Checkout exact validated runtime
        run: |
          git checkout --detach 1b40c9f2e98014ce3b36f5b8629d8a8ac1931e37
          test "$(git rev-parse HEAD)" = "1b40c9f2e98014ce3b36f5b8629d8a8ac1931e37"
          test "$(git rev-parse HEAD^)" = "f0e5262a524a901d673dc6b51991177d0a79baa4"
      - name: Patch PROJECT_SPEC only
        run: |
          python3 /tmp/qibla-step7-closure.py
          git diff --check -- PROJECT_SPEC.md
          test "$(git status --porcelain)" = " M PROJECT_SPEC.md"
      - name: Commit docs-only closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_SPEC.md
          git commit -m "docs(qibla): close milestone after S25 pass"
          test "$(git rev-parse HEAD^)" = "1b40c9f2e98014ce3b36f5b8629d8a8ac1931e37"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "PROJECT_SPEC.md"
          git push origin HEAD:refs/heads/qibla-step7-closure
