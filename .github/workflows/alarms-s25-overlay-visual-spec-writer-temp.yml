name: Alarms S25 overlay visual spec writer temp

on:
  push:
    branches:
      - alarms-s25-overlay-visual-spec-writer-20260905
    paths:
      - .github/workflows/alarms-s25-overlay-visual-spec-writer-temp.yml

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-24.04
    env:
      BASE_RUNTIME_SHA: 79c6e521e234e4b5f06b9b3366400fec1c69a9ab
      SPEC_BRANCH: alarms-s25-overlay-visual-spec
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact spec-only child
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_RUNTIME_SHA"
          git checkout --detach "$BASE_RUNTIME_SHA"
          printf '%s\n' \
            '' \
            '#### Galaxy S25 overlay action contrast correction — APPROVED 2026-09-05' \
            '' \
            'Physical Galaxy S25 validation of runtime `79c6e521e234e4b5f06b9b3366400fec1c69a9ab` confirms that the unlocked `TYPE_APPLICATION_OVERLAY` path now appears automatically and remains functionally usable, but its action controls are not visually acceptable on Samsung One UI: the native Android `Button` styling is OEM-restyled so the `Interrompi` label becomes effectively invisible and both controls show unintended dark inner rectangles. This is a visual rendering failure only; the overlay permission, foreground ringing lifecycle, notification fallback, snooze/stop behavior, lock-screen full-screen path and alarm-stream volume behavior remain frozen.' \
            '' \
            'Approved correction is strictly limited to the unlocked ringing overlay action rendering:' \
            '' \
            '- Replace the two OEM-themeable native `Button` views used by the overlay with Arihna-owned theme-independent clickable text controls so Samsung/One UI cannot inject its button background/inset styling.' \
            '- Keep the existing large overlay card, alarm identity, ringing subtitle and overall Arihna Green/Gold presentation.' \
            '- `Interrompi` must be immediately legible with an explicit gold fill and dark Arihna-green text at high contrast.' \
            '- `Rinvia 5 min` must be immediately legible with an explicit dark-green fill, gold outline and light text at high contrast.' \
            '- Both controls must keep direct click handling, centered labels, accessibility content descriptions and a minimum touch height of 56 dp.' \
            '- Do not change overlay permission handling, `Settings.canDrawOverlays`, `ACTION_MANAGE_OVERLAY_PERMISSION`, `TYPE_APPLICATION_OVERLAY`, locked-device behavior, service lifecycle, safety timeout, notification construction, `RemoteViews` policy, snooze duration, alarm audio, volume control, diagnostic 20-second delay, scheduling, recurrence, Prayer, Location, Qibla, dependencies, SDK levels or applicationId.' \
            '' \
            'Required correction gate: the technical candidate must be the direct child of this spec commit; run unfiltered `testDebugUnitTest` and `assembleDebug`, API28 connected regression with zero skipped tests, and the existing API36 denied/granted exact-alarm, notification, full-screen and overlay matrix. Add focused Android coverage proving the overlay no longer uses `android.widget.Button`, both action labels are present and clickable, and explicit high-contrast foreground/background styling is applied. Frozen GeoNames and the persistent Arihna signing identity remain mandatory. Only after exact-SHA success may the candidate fast-forward non-forced to `main` and be packaged as a new Galaxy S25 prerelease APK.' \
            >> PROJECT_SPEC.md
          git diff --check
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SPEC_BRANCH"
          git add PROJECT_SPEC.md
          git commit -m "docs(alarms): fix S25 overlay action contrast"
          test "$(git rev-parse HEAD^)" = "$BASE_RUNTIME_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "PROJECT_SPEC.md"
          git push origin "HEAD:refs/heads/$SPEC_BRANCH"
