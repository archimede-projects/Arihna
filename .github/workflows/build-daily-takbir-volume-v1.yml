          import androidx.core.content.ContextCompat
          import com.archimedeprojects.arihna.MainActivity
          import com.archimedeprojects.arihna.R
          import java.time.LocalDate
          import java.time.ZonedDateTime

          data class DailyInspirationNotificationSettingsState(
              val enabled: Boolean = false,
              val hour: Int = 8,
              val minute: Int = 0,
              val lastDeliveredDate: String? = null,
          )

          class DailyInspirationNotificationSettings(context: Context) {
              private val prefs = context.applicationContext.getSharedPreferences(
                  PREFS_NAME,
                  Context.MODE_PRIVATE,
              )

              fun read(): DailyInspirationNotificationSettingsState =
                  DailyInspirationNotificationSettingsState(
                      enabled = prefs.getBoolean(KEY_ENABLED, false),
                      hour = prefs.getInt(KEY_HOUR, 8).coerceIn(0, 23),
                      minute = prefs.getInt(KEY_MINUTE, 0).coerceIn(0, 59),
                      lastDeliveredDate = prefs.getString(KEY_LAST_DELIVERED_DATE, null),
                  )

              fun setEnabled(enabled: Boolean): DailyInspirationNotificationSettingsState {
                  prefs.edit().putBoolean(KEY_ENABLED, enabled).apply()
                  return read()
              }

              fun setTime(hour: Int, minute: Int): DailyInspirationNotificationSettingsState {
                  prefs.edit()
                      .putInt(KEY_HOUR, hour.coerceIn(0, 23))
                      .putInt(KEY_MINUTE, minute.coerceIn(0, 59))
                      .apply()
                  return read()
              }

              fun markDelivered(date: LocalDate) {
                  prefs.edit().putString(KEY_LAST_DELIVERED_DATE, date.toString()).apply()
              }

              private companion object {
                  const val PREFS_NAME = "arihna_daily_inspiration_notification"
                  const val KEY_ENABLED = "enabled"
                  const val KEY_HOUR = "hour"
                  const val KEY_MINUTE = "minute"
                  const val KEY_LAST_DELIVERED_DATE = "last_delivered_date"
              }
          }

          internal fun nextDailyInspirationTrigger(
              now: ZonedDateTime,
              hour: Int,
              minute: Int,
          ): ZonedDateTime {
              val today = now.toLocalDate().atTime(hour.coerceIn(0, 23), minute.coerceIn(0, 59))
                  .atZone(now.zone)
              return if (today.isAfter(now)) today else today.plusDays(1)
          }

          internal data class DailyInspirationNotificationCopy(
              val arabic: String,
              val italian: String,
              val reference: String,
          )

          internal fun dailyInspirationNotificationCopy(date: LocalDate): DailyInspirationNotificationCopy {
              val inspiration = dailyInspirationFor(date)
              return DailyInspirationNotificationCopy(
                  arabic = inspiration.text,
                  italian = inspiration.translationItalian,
                  reference = inspiration.reference,
              )
          }

          internal fun shouldDeliverDailyInspiration(
              settings: DailyInspirationNotificationSettingsState,
              date: LocalDate,
          ): Boolean = settings.enabled && settings.lastDeliveredDate != date.toString()

          class DailyInspirationNotificationScheduler(
              context: Context,
              private val settings: DailyInspirationNotificationSettings =
                  DailyInspirationNotificationSettings(context),
          ) {
              private val appContext = context.applicationContext
              private val alarmManager =
                  appContext.getSystemService(Context.ALARM_SERVICE) as AlarmManager

              fun reschedule(now: ZonedDateTime = ZonedDateTime.now()) {
                  cancel()
                  val state = settings.read()
                  if (!state.enabled) return
                  val next = nextDailyInspirationTrigger(now, state.hour, state.minute)
                  alarmManager.setAndAllowWhileIdle(
                      AlarmManager.RTC_WAKEUP,
                      next.toInstant().toEpochMilli(),
                      pendingIntent(),
                  )
              }

              fun cancel() {
                  alarmManager.cancel(pendingIntent())
              }

              private fun pendingIntent(): PendingIntent =
                  PendingIntent.getBroadcast(
                      appContext,
                      REQUEST_CODE,
                      Intent(appContext, DailyInspirationNotificationReceiver::class.java)
                          .setAction(ACTION_DELIVER),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                  )

              companion object {
                  const val ACTION_DELIVER = "com.archimedeprojects.arihna.action.DAILY_INSPIRATION"
                  private const val REQUEST_CODE = 8642
              }
          }

          class DailyInspirationNotificationReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  val appContext = context.applicationContext
                  val settings = DailyInspirationNotificationSettings(appContext)
                  val scheduler = DailyInspirationNotificationScheduler(appContext, settings)
                  if (intent?.action == DailyInspirationNotificationScheduler.ACTION_DELIVER) {
                      deliver(appContext, settings)
                  }
                  scheduler.reschedule()
              }

              private fun deliver(
                  context: Context,
                  settings: DailyInspirationNotificationSettings,
              ) {
                  val state = settings.read()
                  val today = LocalDate.now()
                  if (!shouldDeliverDailyInspiration(state, today)) return
                  if (!canPostNotifications(context)) return

                  val copy = dailyInspirationNotificationCopy(today)
                  DailyInspirationNotificationFactory.ensureChannel(context)
                  NotificationManagerCompat.from(context).notify(
                      DailyInspirationNotificationFactory.NOTIFICATION_ID,
                      DailyInspirationNotificationFactory.build(context, copy),
                  )
                  settings.markDelivered(today)
              }

              private fun canPostNotifications(context: Context): Boolean =
                  (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU ||
                      ContextCompat.checkSelfPermission(context, Manifest.permission.POST_NOTIFICATIONS) ==
                      PackageManager.PERMISSION_GRANTED) &&
                      NotificationManagerCompat.from(context).areNotificationsEnabled()
          }

          internal object DailyInspirationNotificationFactory {
              const val CHANNEL_ID = "arihna_daily_inspiration_v1"
              const val NOTIFICATION_ID = 86420

              fun ensureChannel(context: Context) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return
                  val manager =
                      context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.createNotificationChannel(
                      NotificationChannel(
                          CHANNEL_ID,
                          "Ispirazione del giorno",
                          NotificationManager.IMPORTANCE_DEFAULT,
                      ).apply {
                          description = "Frase e ispirazione quotidiana di Arihna"
                      },
                  )
              }

              fun build(
                  context: Context,
                  copy: DailyInspirationNotificationCopy,
              ): android.app.Notification {
                  val openApp = PendingIntent.getActivity(
                      context,
                      86421,
                      Intent(context, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      },
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                  )
                  val body = buildString {
                      append(copy.arabic)
                      if (copy.italian.isNotBlank()) {
                          append("\n")
                          append(copy.italian)
                      }
                      append("\n")
                      append(copy.reference)
                  }
                  return NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_notification_arihna)
                      .setContentTitle("Ispirazione del giorno")
                      .setContentText(copy.italian.ifBlank { copy.reference })
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setContentIntent(openApp)
                      .setAutoCancel(true)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER)
