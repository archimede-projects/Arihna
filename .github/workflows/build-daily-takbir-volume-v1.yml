              profile: AlarmSoundProfile,
              selectedRingtoneUri: String?,
              prayer: AlarmPrayer?,
          ) {
              if (profile == AlarmSoundProfile.SILENT) return
              val gain = prayerPlaybackGain(
                  prayer?.let { PrayerAlertPreferences(this).volumeFor(it) }
                      ?: DEFAULT_PRAYER_VOLUME_PERCENT,
              )
              val attributes = AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_ALARM)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                  .build()

              if (profile == AlarmSoundProfile.ADHAN) {
                  val variant = AdhanVariant.fromStorage(selectedRingtoneUri)
                  val player = MediaPlayer()
                  try {
                      player.setAudioAttributes(attributes)
                      val rawResource = when (variant) {
                          AdhanVariant.CLASSIC -> R.raw.adhan_cc0
                          AdhanVariant.BEAUTIFUL -> R.raw.adhan_beautiful_cc0
                          AdhanVariant.SHORT -> R.raw.adhan_short_cc0
                          AdhanVariant.TAKBIR_TWO -> R.raw.takbir_cc0
                          AdhanVariant.EXTENDED -> R.raw.adhan_extended_cc_by_sa
                          AdhanVariant.COMPACT -> R.raw.adhan_compact_pd
                          AdhanVariant.ALTERNATIVE -> R.raw.adhan_alternative_cc_by_sa
                      }
                      resources.openRawResourceFd(rawResource).use { descriptor ->
                          player.setDataSource(
                              descriptor.fileDescriptor,
                              descriptor.startOffset,
                              descriptor.length,
                          )
                      }
                      player.isLooping = false
                      player.setVolume(gain, gain)
                      player.prepare()
                      var remainingPlays = if (variant == AdhanVariant.TAKBIR_TWO) 2 else 1
                      player.setOnCompletionListener { completed ->
                          remainingPlays -= 1
                          if (remainingPlays > 0 && mediaPlayer === completed) {
                              runCatching {
                                  completed.seekTo(0)
                                  completed.start()
                              }.onFailure {
                                  if (mediaPlayer === completed) mediaPlayer = null
                                  completed.release()
                              }
                          } else {
                              if (mediaPlayer === completed) mediaPlayer = null
                              completed.release()
                          }
                      }
                      mediaPlayer = player
                      player.start()
                  } catch (_: Throwable) {
                      player.release()
                      mediaPlayer = null
                  }
                  return
              }

              val candidates = buildList<Uri> {
                  selectedRingtoneUri?.let { raw ->
                      runCatching { Uri.parse(raw) }.getOrNull()?.let(::add)
                  }
                  RingtoneManager.getActualDefaultRingtoneUri(
                      this@AlarmRingingService,
                      RingtoneManager.TYPE_ALARM,
                  )?.let(::add)
                  add(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM))
              }.distinct()
              for (uri in candidates) {
                  val player = MediaPlayer()
                  val started = runCatching {
                      player.setAudioAttributes(attributes)
                      player.setDataSource(this, uri)
                      player.isLooping = true
                      player.setVolume(gain, gain)
                      player.prepare()
                      player.start()
                  }.isSuccess
                  if (started) {
                      mediaPlayer = player
                      return
                  }
                  player.release()
              }
              mediaPlayer = null
          }
