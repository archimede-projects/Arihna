name: Qibla STEP 5 spec writer
on:
  push:
    branches: [qibla-step5-spec-writer-temp]
    paths: [.github/workflows/qibla-step5-spec-writer-temp.yml]
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 947d7b41d0d8f32403133653d08852e56ec6cf6e
          fetch-depth: 0
      - name: Close STEP 4 and authorize STEP 5
        env:
          NEW4_B64: 
          NEW5_B64: 
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('PROJECT_SPEC.md')
          lines=p.read_text().splitlines()
          new4=base64.b64decode(os.environ['NEW4_B64']).decode()
          new5=base64.b64decode(os.environ['NEW5_B64']).decode().splitlines()
          out=[]; r4=r5=0
          for line in lines:
              if line.startswith('4. **STEP 4 — Location/Qibla orchestration:'):
                  out.append(new4); r4+=1
              elif line.startswith('5. **STEP 5 — Qibla Compose UI:'):
                  out.extend(new5); r5+=1
              else:
                  out.append(line)
          assert r4 == 1 and r5 == 1, (r4,r5)
          p.write_text('\n'.join(out)+'\n')
          PY
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = PROJECT_SPEC.md
          grep -Fq 'STEP 4 — Location/Qibla orchestration: CLOSED.' PROJECT_SPEC.md
          grep -Fq 'STEP 5 — Qibla Compose UI: AUTHORIZED / IN PROGRESS.' PROJECT_SPEC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c qibla-step5-spec
          git add PROJECT_SPEC.md
          git commit -m 'docs(qibla): close step4 and authorize step5'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = PROJECT_SPEC.md
          git push origin HEAD:refs/heads/qibla-step5-spec
