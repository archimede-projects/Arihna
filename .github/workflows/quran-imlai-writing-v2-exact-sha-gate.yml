name: Quran imlai writing v2 exact-SHA gate

on:
  push:
    branches:
      - driver/quran-imlai-writing-v2-gate-20260925
    paths:
      - .github/workflows/quran-imlai-writing-v2-exact-sha-gate.yml

permissions:
  contents: read

env:
  SPEC_SHA: 3da807cef157d57a54bc426295eb54f66830158d
  CANDIDATE_SHA: 0d7d12c2e89a8012446bde6967d366f31ca8e77e
  PREVIOUS_MAIN_SHA: 977fbde989facc3b392f6af5a65449a5322d58c6
  GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
  FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
  FROZEN_ASSET_APK: arihna-settings-s25-premium.apk

jobs:
  static-jvm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d7d12c2e89a8012446bde6967d366f31ca8e77e
          fetch-depth: 0

      - name: Verify exact lineage scope and imlai contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
          test "$(git merge-base "$SPEC_SHA" "$CANDIDATE_SHA")" = "$SPEC_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$PREVIOUS_MAIN_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$PREVIOUS_MAIN_SHA"

          mapfile -t CHANGED < <(git diff --name-only "$SPEC_SHA..$CANDIDATE_SHA" | sort)
          EXPECTED=(
            'app/build.gradle.kts'
            'app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt'
            'app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranImlaiAndroidTest.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranCorpus.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt'
            'docs/quran/IMLAI_SOURCE.md'
          )
          test "${#CHANGED[@]}" -eq 7
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${CHANGED[@]}")

          G=app/build.gradle.kts
          S=app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          P=app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt
          C=app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranCorpus.kt
          T=app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranImlaiAndroidTest.kt
          D=docs/quran/IMLAI_SOURCE.md

          grep -Fq 'c23f5cec2e95e253dc450bd0f34d09e37ba40fac' "$G"
          grep -Fq 'src/resources/simple.txt' "$G"
          grep -Fq 'Expected 6236 Imlai ayat' "$G"
          grep -Fq 'Imlai and pinned Hafs Uthmani surah:ayah structures differ' "$G"
          grep -Fq 'Tanzil Quran Text (Simple, Version 1.1)' "$G"
          grep -Fq 'fun loadImlai' "$C"
          grep -Fq 'enum class QuranWritingStyle { MUSHAF, IMLAI }' "$S"
          grep -Fq 'quran-writing-imlai' "$S"
          grep -Fq 'quran-imlai-rtl-pager' "$S"
          grep -Fq 'quran-imlai-fullscreen-reader' "$S"
          grep -Fq 'quran-imlai-source-link' "$S"
          grep -Fq 'migrateLegacyEasy' "$P"
          grep -Fq 'QuranWritingStyle.IMLAI' "$P"
          grep -Fq 'imlaiCorpusIsCompleteAndStructurallyAlignedWithPinnedHafs' "$T"
          grep -Fq 'legacyEasyPreferenceMigratesToHafsImlai' "$T"
          grep -Fq 'imlaiKeepsHafsPageJumpBookmarkFullscreenAndSwitchState' "$T"
          grep -Fq 'Tanzil Quran Text — Simple, Version 1.1' "$D"

          grep -Fq 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -Fq 'minSdk = 28' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Unit tests AndroidTest compile and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace

      - name: Verify generated corpora and APK contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('app/build/generated/quranAssets'); q=root/'quran'
          def rows(path):
              out=[]
              for line in path.read_text(encoding='utf-8').splitlines():
                  p=line.split('|',2)
                  if len(p)==3 and p[0].isdigit() and p[1].isdigit():
                      out.append((int(p[0]),int(p[1]),p[2]))
              return out
          uth=rows(q/'quran-uthmani.txt')
          iml=rows(q/'quran-imlai.txt')
          assert len(uth)==6236
          assert len(iml)==6236
          assert len({(s,a) for s,a,_ in iml})==6236
          assert len({s for s,_,_ in iml})==114
          assert [(s,a) for s,a,_ in iml] == [(s,a) for s,a,_ in uth]
          raw=(q/'quran-imlai.txt').read_text(encoding='utf-8')
          assert 'Tanzil Quran Text (Simple, Version 1.1)' in raw
          assert 'License: Creative Commons Attribution 3.0' in raw
          assert len(list((root/'mushaf').glob('[0-9][0-9][0-9].svg')))==604
          assert len(json.loads((root/'mushaf-surah.json').read_text(encoding='utf-8')))==114
          assert len(list((root/'mushaf-warsh').glob('[0-9][0-9][0-9].svg')))==604
          PY
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.archimedeprojects.arihna'" /tmp/badging.txt
          grep -F "sdkVersion:'28'" /tmp/badging.txt
          grep -F "targetSdkVersion:'37'" /tmp/badging.txt
          grep -F "compileSdkVersion='37'" /tmp/badging.txt
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | awk '{print $1}')" = "$GEONAMES_SHA256"
          unzip -p "$APK" assets/quran/quran-imlai.txt | grep -Fq 'Tanzil Quran Text (Simple, Version 1.1)'

  api28-full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d7d12c2e89a8012446bde6967d366f31ca8e77e
          fetch-depth: 0
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - run: sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Require zero API28 failures errors skips and imlai coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files, 'no connected test XML found'
          tests=failures=errors=skipped=0; cases=[]; classes=set()
          for f in files:
              r=ET.parse(f).getroot()
              tests+=int(r.attrib.get('tests','0')); failures+=int(r.attrib.get('failures','0'))
              errors+=int(r.attrib.get('errors','0')); skipped+=int(r.attrib.get('skipped',r.attrib.get('disabled','0')))
              for c in r.iter('testcase'):
                  cls=c.attrib.get('classname',''); name=c.attrib.get('name','')
                  cases.append((cls,name)); classes.add(cls)
          print(f'API28_CONNECTED_XML tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 93, tests
          assert failures == errors == skipped == 0, (failures,errors,skipped)
          required={
            'imlaiCorpusIsCompleteAndStructurallyAlignedWithPinnedHafs',
            'legacyEasyPreferenceMigratesToHafsImlai',
            'imlaiKeepsHafsPageJumpBookmarkFullscreenAndSwitchState',
          }
          seen={name for cls,name in cases if cls.endswith('QuranImlaiAndroidTest')}
          assert required <= seen, (required,seen)
          PY

  api36-quran-and-permission-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d7d12c2e89a8012446bde6967d366f31ca8e77e
          fetch-depth: 0
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Prepare API36 device script
        shell: bash
        run: |
          cat > /tmp/api36-gate.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.archimedeprojects.arihna.feature.quran.QuranFullscreenAndroidTest,com.archimedeprojects.arihna.feature.quran.QuranPostStableHardeningAndroidTest,com.archimedeprojects.arihna.feature.quran.TajwidCrashRegressionAndroidTest,com.archimedeprojects.arihna.feature.quran.QuranImlaiAndroidTest --stacktrace
          P=com.archimedeprojects.arihna
          ./gradlew :app:installDebug --stacktrace
          adb shell pm revoke "$P" android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm revoke "$P" android.permission.ACCESS_COARSE_LOCATION || true
          adb shell pm grant "$P" android.permission.ACCESS_COARSE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=false'
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -1 | grep -q 'granted=true'
          adb shell pm grant "$P" android.permission.ACCESS_FINE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=true'
          adb shell pm revoke "$P" android.permission.ACCESS_FINE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -1 | grep -q 'granted=true'
          echo API36_PERMISSION_MATRIX_SUCCESS | tee /tmp/api36-permission-matrix.txt
          SH
          chmod +x /tmp/api36-gate.sh
      - run: sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: /tmp/api36-gate.sh
      - name: Require imlai hardening Tajwid and permission matrix success
        shell: bash
        run: |
          test "$(cat /tmp/api36-permission-matrix.txt)" = 'API36_PERMISSION_MATRIX_SUCCESS'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files, 'no connected test XML found'
          tests=failures=errors=skipped=0; cases=[]; classes=set()
          for f in files:
              r=ET.parse(f).getroot()
              tests+=int(r.attrib.get('tests','0')); failures+=int(r.attrib.get('failures','0'))
              errors+=int(r.attrib.get('errors','0')); skipped+=int(r.attrib.get('skipped',r.attrib.get('disabled','0')))
              for c in r.iter('testcase'):
                  cls=c.attrib.get('classname',''); name=c.attrib.get('name','')
                  cases.append((cls,name)); classes.add(cls)
          print(f'API36_CONNECTED_XML tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 17, tests
          assert failures == errors == skipped == 0, (failures,errors,skipped)
          assert any(c.endswith('QuranImlaiAndroidTest') for c in classes), classes
          assert any(c.endswith('QuranPostStableHardeningAndroidTest') for c in classes), classes
          assert any(c.endswith('TajwidCrashRegressionAndroidTest') for c in classes), classes
          required={
            'imlaiCorpusIsCompleteAndStructurallyAlignedWithPinnedHafs',
            'legacyEasyPreferenceMigratesToHafsImlai',
            'imlaiKeepsHafsPageJumpBookmarkFullscreenAndSwitchState',
          }
          seen={name for cls,name in cases if cls.endswith('QuranImlaiAndroidTest')}
          assert required <= seen, (required,seen)
          PY
