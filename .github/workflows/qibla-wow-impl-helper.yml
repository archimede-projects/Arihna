name: Qibla final wow implementation helper

on:
  push:
    branches:
      - qibla-wow-impl-helper
    paths:
      - .github/workflows/qibla-wow-impl-helper.yml

permissions:
  contents: write

jobs:
  create-clean-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0e5262a524a901d673dc6b51991177d0a79baa4
          fetch-depth: 0
      - name: Apply approved presentation-only polish
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/apply-wow.py
          python3 /tmp/apply-wow.py
          git diff --check
          mapfile -t files < <(git diff --name-only)
          test "${#files[@]}" -eq 2
          printf '%s\n' "${files[@]}" | grep -Fx 'app/src/main/java/com/archimedeprojects/arihna/feature/qibla/QiblaPlaceholderScreen.kt'
          printf '%s\n' "${files[@]}" | grep -Fx 'app/src/androidTest/java/com/archimedeprojects/arihna/feature/qibla/QiblaScreenAndroidTest.kt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/archimedeprojects/arihna/feature/qibla/QiblaPlaceholderScreen.kt app/src/androidTest/java/com/archimedeprojects/arihna/feature/qibla/QiblaScreenAndroidTest.kt
          git commit -m 'feat(qibla): add final wow compass polish'
          git push -f origin HEAD:refs/heads/qibla-wow-impl
