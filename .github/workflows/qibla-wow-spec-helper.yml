name: Qibla wow spec helper

on:
  push:
    branches:
      - qibla-wow-spec-helper
    paths:
      - .github/workflows/qibla-wow-spec-helper.yml

permissions:
  contents: write

jobs:
  create-clean-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fb1f4c0b245f37fe8666bc2bea5007e0e34bf5e
          fetch-depth: 0
      - name: Append approved final wow polish specification
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode >> PROJECT_SPEC.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(qibla): approve final wow compass polish'
          git push -f origin HEAD:refs/heads/qibla-wow-spec
