name: Home Alba dorata spec writer

on:
  push:
    branches:
      - home-alba-dorata-spec-driver-20260907

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: b5a3ae228bbecc2a9b0d325a55f45a1805a9ddf9
      SPEC_BRANCH: home-alba-dorata-spec-20260907
      SPEC_APPEND_B64: 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create spec-only commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git checkout -B "$SPEC_BRANCH" "$BASE_SHA"
          printf '%s' "$SPEC_APPEND_B64" | base64 -d >> PROJECT_SPEC.md
          git config user.name "Arihna Spec Bot"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT_SPEC.md
          test "$(git diff --cached --name-only)" = "PROJECT_SPEC.md"
          git commit -m "spec(home): approve Alba dorata visual direction"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "$SPEC_BRANCH"
          echo "SPEC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify spec commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$BASE_SHA" "$SPEC_SHA")" = "PROJECT_SPEC.md"
          grep -F 'Home visual direction “Alba dorata” APPROVED' PROJECT_SPEC.md
          git show --stat --oneline "$SPEC_SHA"
