name: Prayer engine JDK 21 diagnostics

on:
  push:
    branches:
      - prayer-engine-verify
  workflow_dispatch:

jobs:
  bytecode:
    name: Direct bytecode verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Resolve and print actual Gradle classpath files
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/arihna-classpath.gradle <<'GRADLE'
          allprojects {
              afterEvaluate { p ->
                  if (p.path == ':app') {
                      p.tasks.register('dumpArihnaDiagnosticClasspath') {
                          doLast {
                              ['debugCompileClasspath', 'debugUnitTestRuntimeClasspath'].each { name ->
                                  def cfg = p.configurations.getByName(name)
                                  println("CONFIGURATION=${name}")
                                  cfg.resolve().sort { a, b -> a.absolutePath <=> b.absolutePath }.each { f ->
                                      println("CLASSPATH_FILE=${f.absolutePath}")
                                  }
                              }
                          }
                      }
                  }
              }
          }
          GRADLE
          ./gradlew -I /tmp/arihna-classpath.gradle :app:dumpArihnaDiagnosticClasspath --stacktrace | tee /tmp/classpath.log
          grep '^CLASSPATH_FILE=' /tmp/classpath.log | sed 's/^CLASSPATH_FILE=//' | sort -u > /tmp/classpath-files.txt
          echo 'Resolved classpath candidates containing adhan/datetime:'
          grep -Ei 'adhan|datetime' /tmp/classpath-files.txt || true
      - name: Inspect CalculationMethod class header directly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, zipfile
          from pathlib import Path

          exact = 'com/batoulapps/adhan2/CalculationMethod.class'
          paths = [Path(x.strip()) for x in Path('/tmp/classpath-files.txt').read_text().splitlines() if x.strip()]
          found = []
          for path in paths:
              if not path.is_file() or path.suffix.lower() not in {'.jar', '.zip', '.aar'}:
                  continue
              try:
                  with zipfile.ZipFile(path) as zf:
                      if exact not in zf.namelist():
                          continue
                      data = zf.read(exact)
                      magic, minor, major = struct.unpack('>IHH', data[:8])
                      print(f'ADHAN_CLASS_CONTAINER={path}')
                      print(f'EXACT_CLASS={exact}')
                      print(f'magic=0x{magic:08X}')
                      print(f'minor={minor}')
                      print(f'major={major}')
                      found.append(path)
              except zipfile.BadZipFile:
                  pass
          if not found:
              print('ERROR: exact CalculationMethod.class not found in resolved classpath files')
              raise SystemExit(2)
          if len(found) > 1:
              print(f'NOTE: exact class found in {len(found)} resolved containers')
          PY

  test-a:
    name: TEST A - unit tests on host JDK 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Show host JVM
        run: java -version
      - name: Assert approved Arihna app matrix is unchanged
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/build.gradle.kts
          grep -F 'compileSdk = 37' "$FILE"
          grep -F 'minSdk = 28' "$FILE"
          grep -F 'targetSdk = 37' "$FILE"
          grep -F 'sourceCompatibility = JavaVersion.VERSION_17' "$FILE"
          grep -F 'targetCompatibility = JavaVersion.VERSION_17' "$FILE"
          grep -F 'jvmTarget.set(JvmTarget.JVM_17)' "$FILE"
          echo 'APP_MATRIX_GUARD=PASS'
      - name: TEST A - run debug unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  test-b:
    name: TEST B - assemble Android app on host JDK 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Show host JVM
        run: java -version
      - name: Assert approved Arihna app matrix is unchanged
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/build.gradle.kts
          grep -F 'compileSdk = 37' "$FILE"
          grep -F 'minSdk = 28' "$FILE"
          grep -F 'targetSdk = 37' "$FILE"
          grep -F 'sourceCompatibility = JavaVersion.VERSION_17' "$FILE"
          grep -F 'targetCompatibility = JavaVersion.VERSION_17' "$FILE"
          grep -F 'jvmTarget.set(JvmTarget.JVM_17)' "$FILE"
          echo 'APP_MATRIX_GUARD=PASS'
      - name: TEST B - assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
