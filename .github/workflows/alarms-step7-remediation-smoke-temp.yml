name: Alarms STEP 7 ringing remediation smoke

on:
  push:
    branches:
      - alarms-step7-remediation-smoke-temp
    paths:
      - .github/workflows/alarms-step7-remediation-smoke-temp.yml

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 87da98d0411f350dd79a6ccfcc6edefd4bf7ec7b
      SPEC_SHA: c0fa43c5b16355c0e4b2748b6b6b85df4bfbb7db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$SPEC_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh run download 33296099459 --repo "$GITHUB_REPOSITORY" --name geonames-step4-runtime-minimal --dir /tmp/geonames
          DB="$(find /tmp/geonames -type f -name cities.db -print -quit)"
          test -n "$DB"
          cp "$DB" app/src/main/assets/geonames/cities.db
          echo '7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb  app/src/main/assets/geonames/cities.db' | sha256sum -c -
      - name: JVM tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace
