name: Home Hijri Quran Arabic implementation v2

on:
  push:
    branches:
      - home-hijri-quran-arabic-impl-driver-v3-20260907

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      SPEC_SHA: 89bef3ff59bebc8e3cf0db3652ff18b9dd056938
      SPEC_PARENT: 3dd4a905369694b79a273a560685af9fee730cd5
      CANDIDATE_BRANCH: home-hijri-quran-arabic-v2
    steps:
      - name: Checkout implementation driver
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard lineage and prepare direct-child worktree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/arihna-hijri-quran-revision.py /tmp/revision.py
          cp .github/patch-hijri-quran-transform.py /tmp/patch-transform.py
          cp .github/arihna-quran-buildassets.py /tmp/quran-buildassets.py
          python3 /tmp/patch-transform.py
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$SPEC_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$SPEC_PARENT"
          git switch -C "$CANDIDATE_BRANCH" "$SPEC_SHA"
          test "$(git rev-parse HEAD)" = "$SPEC_SHA"

      - name: Apply product revision and acceptance coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/revision.py
          python3 /tmp/quran-buildassets.py
          git diff --check
          grep -Fq 'settings-alarm-volume-slider' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          ! grep -Fq 'settings-alarm-volume-decrease' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          ! grep -Fq 'settings-alarm-volume-increase' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          grep -Fq 'settings-language-arabic' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          grep -Fq 'LayoutDirection.Rtl' app/src/main/java/com/archimedeprojects/arihna/app/ArihnaApp.kt
          grep -Fq 'home-hijri-date' app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          grep -Fq 'home-calendar-dialog' app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          grep -Fq 'Icons.Rounded.MenuBook' app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          grep -Fq 'dateBlockShowsHijriDateAndOpensCalendarViewer' app/src/androidTest/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreenAndroidTest.kt
          grep -Fq 'alarmVolumeUsesSliderAndNoAdjacentStepButtons' app/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreenAndroidTest.kt
          grep -Fq 'arabicSelectionPersistsAndMapsToRtl' app/src/androidTest/java/com/archimedeprojects/arihna/core/i18n/AppLanguageAndroidTest.kt
          grep -Fq 'quran-mode-easy' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'quran-mode-hafs' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'a5284b17034d36567e4a4bac982a17ba56837448' app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile and unit-test candidate worktree
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/generated/quranAssets/quran/quran-uthmani.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('app/build/generated/quranAssets/quran')
          verses=[]
          for line in (p/'quran-uthmani.txt').read_text(encoding='utf-8').splitlines():
              parts=line.split('|',2)
              if len(parts)==3 and parts[0].isdigit() and parts[1].isdigit():
                  verses.append((int(parts[0]),int(parts[1]),parts[2]))
          assert len(verses)==6236, len(verses)
          assert len({x[0] for x in verses})==114
          juz=json.loads((p/'juz-info.json').read_text())
          hizb=json.loads((p/'hizb-info.json').read_text())
          assert juz['1']['surahNum']==1 and juz['1']['ayahNum']==1
          assert juz['2']['surahNum']==2 and juz['2']['ayahNum']==142
          assert len(juz)==30 and len(hizb)>=60
          assert 'Creative Commons Attribution 3.0' in (p/'TANZIL_TEXT_README.md').read_text()
          PY

      - name: Commit direct-child candidate v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IbnKhaldoun-svg"
          git config user.email "essalih.idriss.w@gmail.com"
          git add app/build.gradle.kts app/src/main/java app/src/test app/src/androidTest docs/quran
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: add Arabic Hijri calendar and offline Quran reader v2"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH" --force-with-lease
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
