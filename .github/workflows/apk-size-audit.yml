name: APK size audit

on:
  push:
    branches:
      - driver/apk-size-audit-20261015
    paths:
      - .github/workflows/apk-size-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download adhan-auto-dismiss-3bd015a5-20261015 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern arihna-adhan-auto-dismiss.apk \
            --dir /tmp/apk
          test -s /tmp/apk/arihna-adhan-auto-dismiss.apk

      - name: Report largest APK entries
        run: |
          set -euo pipefail
          APK=/tmp/apk/arihna-adhan-auto-dismiss.apk
          echo "APK_BYTES=$(stat -c '%s' "$APK")"
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
          python3 - <<'PY'
          import zipfile
          from collections import defaultdict
          apk='/tmp/apk/arihna-adhan-auto-dismiss.apk'
          totals=defaultdict(lambda:[0,0,0])
          with zipfile.ZipFile(apk) as z:
              infos=z.infolist()
              for i in infos:
                  n=i.filename
                  if n.startswith('assets/mushaf/'):
                      cat='mushaf_svg'
                  elif n.startswith('assets/geonames/'):
                      cat='geonames'
                  elif n.startswith('assets/quran/'):
                      cat='quran_text'
                  elif n.startswith('res/raw/'):
                      cat='raw_audio'
                  elif n.endswith('.dex'):
                      cat='dex'
                  elif n.startswith('lib/'):
                      cat='native_libs'
                  elif n.startswith('res/'):
                      cat='other_res'
                  else:
                      cat='other'
                  t=totals[cat]
                  t[0]+=i.file_size; t[1]+=i.compress_size; t[2]+=1
              print('CATEGORY_TOTALS')
              for cat,(raw,comp,count) in sorted(totals.items(), key=lambda kv: kv[1][1], reverse=True):
                  print(f'{cat} count={count} raw={raw} compressed={comp}')
              print('ASSET_PREFIX_TOTALS')
              prefixes=defaultdict(lambda:[0,0,0])
              for i in infos:
                  parts=i.filename.split('/')
                  if len(parts)>=2:
                      key='/'.join(parts[:2])
                  else:
                      key=parts[0]
                  p=prefixes[key]
                  p[0]+=i.file_size; p[1]+=i.compress_size; p[2]+=1
              for key,(raw,comp,count) in sorted(prefixes.items(), key=lambda kv: kv[1][1], reverse=True)[:40]:
                  print(f'{key} count={count} raw={raw} compressed={comp}')
              print('TOP_OTHER_ENTRIES')
              def is_other(n):
                  return not (
                      n.startswith('assets/mushaf/') or n.startswith('assets/geonames/') or
                      n.startswith('assets/quran/') or n.startswith('res/raw/') or n.endswith('.dex') or
                      n.startswith('lib/') or n.startswith('res/')
                  )
              for i in sorted((x for x in infos if is_other(x.filename)),key=lambda x:x.compress_size,reverse=True)[:50]:
                  print(i.compress_size, i.file_size, i.filename)
          PY
