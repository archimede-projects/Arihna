name: Alba six-Adhan S25 prerelease

on:
  push:
    branches:
      - global-visual-adhan-volume-release-driver-20260907
    paths:
      - .github/workflows/global-visual-adhan-volume-release.yml

permissions:
  actions: read
  contents: write

jobs:
  build-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUNTIME_SHA: f5478522533962f44ca9f8879f7d6a82d9c35af4
      SPEC_SHA: 4fb277b6956f7ca6f777c3badfd044d77b72a42b
      VERIFIED_GATE_RUN: '34109871981'
      VERIFIED_STATIC_JOB: '101703366918'
      VERIFIED_API28_JOB: '101703366960'
      VERIFIED_API36_JOB: '101703366705'
      SIGNING_SOURCE_SHA: ce23a7f78695be95c7f8dfd2bcedbe22544da94c
      DEBUG_CERT_SHA256: 13:97:00:8C:1F:96:2D:BB:D3:6D:D8:A8:EA:02:16:AF:DD:06:E4:B2:B3:E0:8B:C0:F6:D4:B5:43:44:D7:B0:FA
      DEBUG_CERT_SHA256_COMPACT: 1397008c1f962dbbd36dd8a8ea0216afdd06e4b2b3e08bc0f6d4b54344d7b0fa
      DEBUG_KEYSTORE_SHA256: bc9057f26ad6de7efb70a5df06effb1ed259f1d015c3f062d0f757b3f0983b72
      GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
      ADHAN_CLASSIC_SHA256: 3b350bc210d657727578ed977e32323c06b63c2088c3ebcea9fc9afb7d487702
      ADHAN_BEAUTIFUL_SHA256: 35fe06b08fe80505c550c33fed8a783fa9901ddc81ac884958b4be048f5b2a79
      ADHAN_SHORT_SHA256: faeb03e4338554fb8b54dba98ed4949648615b58e991bbd560a89f4837dde413
      ADHAN_EXTENDED_SHA256: 2163ceafb8a05064a5ea5e1e0a7fac5fff958a21fcf830844d557d496b9b23c3
      ADHAN_COMPACT_SHA256: c1530b7c66bfe2fe90f9e54741384ed80678d9888dc5257a91659c0aeafe95e9
      ADHAN_ALTERNATIVE_SHA256: 8c8b41732334dd6cdb0d44596358c2fae0bb95f8feacb8ea7e04a10a6fe6f934
      FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
      FROZEN_ASSET_APK: arihna-settings-s25-premium.apk
      PACKAGE_NAME: com.archimedeprojects.arihna
      RELEASE_TAG: global-visual-adhan-volume-s25-f5478522-20260907
      APK_NAME: arihna-global-visual-adhan-volume-s25.apk

    steps:
      - name: Checkout exact promoted runtime
        uses: actions/checkout@v4
        with:
          ref: f5478522533962f44ca9f8879f7d6a82d9c35af4
          fetch-depth: 0

      - name: Verify exact promoted runtime and definitive gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$RUNTIME_SHA"
          for JOB in "$VERIFIED_STATIC_JOB" "$VERIFIED_API28_JOB" "$VERIFIED_API36_JOB"; do
            ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB" --jq '[(.id|tostring),(.run_id|tostring),.status,.conclusion] | join(" ")')"
            test "$ACTUAL" = "$JOB $VERIFIED_GATE_RUN completed success"
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_GATE_RUN" --jq '[.status,.conclusion] | join(" ")')" = 'completed success'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore frozen GeoNames and verify six Adhan sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
          echo "$ADHAN_CLASSIC_SHA256  app/src/main/res/raw/adhan_cc0.ogg" | sha256sum -c -
          echo "$ADHAN_BEAUTIFUL_SHA256  app/src/main/res/raw/adhan_beautiful_cc0.ogg" | sha256sum -c -
          echo "$ADHAN_SHORT_SHA256  app/src/main/res/raw/adhan_short_cc0.ogg" | sha256sum -c -
          echo "$ADHAN_EXTENDED_SHA256  app/src/main/res/raw/adhan_extended_cc_by_sa.ogg" | sha256sum -c -
          echo "$ADHAN_COMPACT_SHA256  app/src/main/res/raw/adhan_compact_pd.ogg" | sha256sum -c -
          echo "$ADHAN_ALTERNATIVE_SHA256  app/src/main/res/raw/adhan_alternative_cc_by_sa.ogg" | sha256sum -c -

      - name: Verify product and frozen platform contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'minSdk = 28' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          grep -Fq 'playServicesLocation = "21.3.0"' gradle/libs.versions.toml
          grep -Fq 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.ACCESS_COARSE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          grep -Fq 'val ArihnaDawnTop = Color(0xFFFFF7E6)' app/src/main/java/com/archimedeprojects/arihna/core/ui/theme/Color.kt
          grep -Fq 'val ArihnaDawnBottom = Color(0xFFE7ECD7)' app/src/main/java/com/archimedeprojects/arihna/core/ui/theme/Color.kt
          grep -Fq 'private val ArihnaAlbaColors = lightColorScheme(' app/src/main/java/com/archimedeprojects/arihna/core/ui/theme/Theme.kt
          SETTINGS=app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          ! grep -Fq 'Slider(' "$SETTINGS"
          grep -Fq 'settings-alarm-volume-decrease' "$SETTINGS"
          grep -Fq 'settings-alarm-volume-increase' "$SETTINGS"
          SERVICE=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          test "$(grep -c 'AdhanVariant\..*R.raw.adhan_' "$SERVICE")" -eq 6
          grep -Fq 'const val TEST_DELAY_MILLIS = 10_000L' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt

      - name: Restore persistent Arihna debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin location-step5-device-test
          mkdir -p "$HOME/.android"
          git show "$SIGNING_SOURCE_SHA:.github/test-signing/arihna-debug.keystore.b64" | base64 --decode > "$HOME/.android/debug.keystore"
          test "$(sha256sum "$HOME/.android/debug.keystore" | awk '{print $1}')" = "$DEBUG_KEYSTORE_SHA256"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee /tmp/keytool.txt
          grep -F "$DEBUG_CERT_SHA256" /tmp/keytool.txt

      - name: Apply transient persistent debug signing configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          marker = '    buildFeatures {\n'
          block = '''    signingConfigs {\n        getByName("debug") {\n            storeFile = file("${System.getProperty("user.home")}/.android/debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n\n'''
          if marker not in text:
              raise SystemExit('buildFeatures marker not found')
          path.write_text(text.replace(marker, block + marker, 1))
          PY
          git diff --check -- app/build.gradle.kts
          test "$(git diff --name-only)" = "app/build.gradle.kts"

      - name: Build exact promoted runtime with persistent signer
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK signer package SDK permissions assets and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -s "$APK" && test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          tr '[:upper:]' '[:lower:]' < /tmp/apksigner.txt | tr -d ':' | grep -F "$DEBUG_CERT_SHA256_COMPACT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='$PACKAGE_NAME'" /tmp/badging.txt
          grep -F "sdkVersion:'28'" /tmp/badging.txt
          grep -F "targetSdkVersion:'37'" /tmp/badging.txt
          grep -F "compileSdkVersion='37'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" > /tmp/permissions.txt
          grep -Fq 'android.permission.ACCESS_FINE_LOCATION' /tmp/permissions.txt
          grep -Fq 'android.permission.ACCESS_COARSE_LOCATION' /tmp/permissions.txt
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/permissions.txt
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' /tmp/permissions.txt
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | awk '{print $1}')" = "$GEONAMES_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_cc0.ogg | sha256sum | awk '{print $1}')" = "$ADHAN_CLASSIC_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_beautiful_cc0.ogg | sha256sum | awk '{print $1}')" = "$ADHAN_BEAUTIFUL_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_short_cc0.ogg | sha256sum | awk '{print $1}')" = "$ADHAN_SHORT_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_extended_cc_by_sa.ogg | sha256sum | awk '{print $1}')" = "$ADHAN_EXTENDED_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_compact_pd.ogg | sha256sum | awk '{print $1}')" = "$ADHAN_COMPACT_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_alternative_cc_by_sa.ogg | sha256sum | awk '{print $1}')" = "$ADHAN_ALTERNATIVE_SHA256"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | awk '{print $1}' > /tmp/apk-sha256.txt
          stat -c '%s' "$APK_NAME" > /tmp/apk-size.txt
          echo "FINAL_APK_SHA256=$(cat /tmp/apk-sha256.txt)"
          echo "FINAL_APK_SIZE=$(cat /tmp/apk-size.txt)"

      - name: Publish Galaxy S25 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA="$(cat /tmp/apk-sha256.txt)"
          APK_SIZE="$(cat /tmp/apk-size.txt)"
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RUNTIME_SHA" \
            --title 'S25 validation — Alba dorata + 6 Adhan — f5478522' \
            --prerelease \
            --notes "Galaxy S25 validation build. SPEC $SPEC_SHA; promoted exact candidate $RUNTIME_SHA, direct child of the SPEC. Definitive exact-SHA gate $VERIFIED_GATE_RUN passed static/JVM/build, API28 full instrumentation with zero failures/errors/skips, and API36 location-permission matrix. Shared Alba dorata visual system across Home, Orari, Impostazioni, Sveglie, Qibla and Corano; six distinct bundled Adhan choices; alarm volume uses adjacent minus/value/plus controls instead of a slider. Package $PACKAGE_NAME; minSdk 28; compileSdk 37; targetSdk 37. Persistent signer, GeoNames and all six Adhan assets verified. APK bytes $APK_SIZE. APK SHA-256 $APK_SHA. Physical Galaxy S25 validation remains required."

      - name: Verify published prerelease by redownload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/apk-sha256.txt)"
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RUNTIME_SHA"
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = true
          test "$(jq -r '.target_commitish' <<<"$RELEASE_JSON")" = "$RUNTIME_SHA"
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" = 1
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$APK_NAME"
          rm -rf /tmp/releasecheck && mkdir -p /tmp/releasecheck
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME" --dir /tmp/releasecheck
          test "$(sha256sum "/tmp/releasecheck/$APK_NAME" | awk '{print $1}')" = "$EXPECTED_SHA"
          echo "DIRECT_APK_URL=$(jq -r '.assets[0].browser_download_url' <<<"$RELEASE_JSON")"
