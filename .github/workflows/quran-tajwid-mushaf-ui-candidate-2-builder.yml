name: Quran Tajwid Mushaf UI candidate 2 builder

on:
  push:
    branches:
      - driver/quran-tajwid-mushaf-ui-candidate-2-builder-20260915

permissions:
  contents: write

concurrency:
  group: quran-tajwid-mushaf-ui-candidate-2-builder-20260915
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout driver branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: android-actions/setup-android@v3

      - name: Create sibling candidate 2 and preflight
        shell: bash
        run: |
          set -euo pipefail
          SPEC='0cba37318fff876499b71c704b0709383f53b599'
          CANDIDATE1='e1ba701f6083b74004cc6c499030effc170e2eb0'
          CANDIDATE_BRANCH='quran-tajwid-mushaf-ui-candidate-2'

          git fetch origin main quran-tajwid-mushaf-ui-candidate-1
          test "$(git rev-parse origin/main)" = "$SPEC"
          test "$(git rev-parse "$CANDIDATE1^")" = "$SPEC"
          test "$(git rev-list --count "$SPEC..$CANDIDATE1")" -eq 1

          git checkout --detach "$SPEC"

          FILES=(
            'app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt'
          )
          for f in "${FILES[@]}"; do
            git show "$CANDIDATE1:$f" > "$f"
          done

          python3 - <<'PY'
          from pathlib import Path

          q = Path('app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt')
          s = q.read_text(encoding='utf-8')
          old = '.testTag("quran-tajwid-page-surface"),'
          new = '.testTag("quran-tajwid-page-surface-${pageIndex + 1}"),'
          assert s.count(old) == 1, s.count(old)
          q.write_text(s.replace(old, new), encoding='utf-8')

          t = Path('app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt')
          s = t.read_text(encoding='utf-8')
          old = 'composeRule.onNodeWithTag("quran-tajwid-page-surface").assertIsDisplayed()'
          new = 'composeRule.onNodeWithTag("quran-tajwid-page-surface-2").assertIsDisplayed()'
          assert s.count(old) == 1, s.count(old)
          t.write_text(s.replace(old, new), encoding='utf-8')
          PY

          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' "${FILES[@]}" | sort)"
          echo "CHANGED_FILES=$CHANGED"
          test "$CHANGED" = "$EXPECTED"
          ! echo "$CHANGED" | grep -Ei 'prayer|location|qibla|alarm|home'

          Q=app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          T=app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt
          grep -Fq '.testTag("quran-tajwid-page-surface-${pageIndex + 1}")' "$Q"
          grep -Fq 'onNodeWithTag("quran-tajwid-page-surface-2").assertIsDisplayed()' "$T"
          ! grep -Fq 'onNodeWithTag("quran-tajwid-page-surface").assertIsDisplayed()' "$T"
          grep -Fq 'quran-tajwid-rtl-pager' "$Q"
          grep -Fq 'Colorazione tajwid · Beta / regole principali' "$Q"
          grep -Fq 'WindowInsets.displayCutout.union(WindowInsets.statusBars)' "$Q"

          ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FILES[@]}"
          git commit -m 'fix(quran): make Tajwid page semantics deterministic'
          test "$(git rev-parse HEAD^)" = "$SPEC"
          test "$(git rev-list --count "$SPEC..HEAD")" -eq 1
          test "$(git diff --name-only "$SPEC..HEAD" | wc -l)" -eq 3
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
