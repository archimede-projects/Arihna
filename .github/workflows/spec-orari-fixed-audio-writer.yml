name: Write Orari fixed-screen audio spec

on:
  push:
    branches:
      - spec-orari-fixed-audio-driver-20260907

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ee93fef6ec216590ea51a4ebcfbc0491ab799818
      TARGET_BRANCH: spec-orari-fixed-audio
      SPEC_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BASE_SHA }}
      - name: Verify exact base
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"
      - name: Append approved Orari spec
        run: |
          printf '\n\n' >> PROJECT_SPEC.md
          printf '%s' "$SPEC_B64" | base64 -d >> PROJECT_SPEC.md
      - name: Verify spec-only diff
        run: |
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          grep -F 'Prayer Times / “Orari” fixed-screen audio selection APPROVED' PROJECT_SPEC.md
          grep -F 'Alarms/Sveglie screen and its editor remain completely out of scope' PROJECT_SPEC.md
          grep -F 'Home screen remains frozen' PROJECT_SPEC.md
      - name: Commit and push spec branch
        run: |
          git config user.name 'Arihna Spec Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(spec): approve Orari fixed screen and Adhan selection'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "PROJECT_SPEC.md"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
          echo "SPEC_SHA=$(git rev-parse HEAD)"
