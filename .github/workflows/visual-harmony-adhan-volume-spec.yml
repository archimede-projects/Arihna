name: Visual harmony Adhan volume spec writer

on:
  push:
    branches:
      - visual-harmony-adhan-volume-spec-driver-20260907

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout specification branch
        uses: actions/checkout@v4
        with:
          ref: visual-harmony-adhan-volume-spec-20260907
          fetch-depth: 0
      - name: Verify baseline and append approved specification
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=882e434ea036ef9033608131b428e46b16b64d1e
          test "$(git rev-parse HEAD)" = "$BASELINE"
          printf '\n' >> PROJECT_SPEC.md
          printf '%s' '' | base64 -d >> PROJECT_SPEC.md
          git config user.name 'IbnKhaldoun-svg'
          git config user.email 'essalih.idriss.w@gmail.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(spec): approve visual harmony adhan library and volume presets'
          test "$(git rev-parse HEAD^)" = "$BASELINE"
          git push origin HEAD:refs/heads/visual-harmony-adhan-volume-spec-20260907
