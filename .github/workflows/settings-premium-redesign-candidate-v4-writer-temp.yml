name: Settings premium redesign candidate v4 writer temp

on:
  push:
    branches:
      - settings-premium-redesign-candidate-v4-writer-20260906

permissions:
  contents: write

jobs:
  write-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create direct-child candidate with stable API28 test scrolling
        shell: bash
        run: |
          set -euo pipefail
          SPEC_SHA=4e9e05bf82332c0a8fb3ad9744265350ea6baa79
          V3_SHA=9bb142446bf5c07fffc2f0f28bcff842a64f178d
          CANDIDATE_BRANCH=settings-premium-redesign-candidate-v4
          UI=app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          TEST1=app/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreenAndroidTest.kt
          TEST2=app/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/AlarmSettingsOverlayVolumeAndroidTest.kt
          git fetch origin main settings-premium-redesign-spec settings-premium-redesign-candidate-v3 --force
          test "$(git rev-parse origin/main)" = "$SPEC_SHA"
          test "$(git rev-parse origin/settings-premium-redesign-spec)" = "$SPEC_SHA"
          test "$(git rev-parse origin/settings-premium-redesign-candidate-v3)" = "$V3_SHA"
          git checkout --detach "$SPEC_SHA"
          git show "$V3_SHA:$UI" > "$UI"
          git show "$V3_SHA:$TEST1" > "$TEST1"
          git show "$V3_SHA:$TEST2" > "$TEST2"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/AlarmSettingsOverlayVolumeAndroidTest.kt')
          s=p.read_text()
          old='''        composeRule.onNodeWithText("Popup sveglia").assertIsDisplayed()\n        composeRule.onNodeWithText("Da autorizzare").assertIsDisplayed()\n        composeRule.onNodeWithText("Volume sveglia").assertIsDisplayed()\n        composeRule.onNodeWithText("53%").assertIsDisplayed()\n        composeRule.onNodeWithText("Volume globale delle sveglie del telefono")\n            .assertIsDisplayed()\n'''
          new='''        composeRule.onNodeWithText("Popup sveglia").assertIsDisplayed()\n        composeRule.onNodeWithText("Da autorizzare").assertIsDisplayed()\n        composeRule.onNode(hasScrollAction())\n            .performScrollToNode(hasText("Volume sveglia"))\n        composeRule.onNodeWithText("Volume sveglia").assertIsDisplayed()\n        composeRule.onNodeWithText("53%").assertIsDisplayed()\n        composeRule.onNode(hasScrollAction())\n            .performScrollToNode(hasText("Volume globale delle sveglie del telefono"))\n        composeRule.onNodeWithText("Volume globale delle sveglie del telefono")\n            .assertIsDisplayed()\n'''
          if old not in s:
              raise SystemExit('expected volume assertion block not found')
          p.write_text(s.replace(old,new))
          PY
          grep -Fq 'performScrollToNode(hasText("Volume sveglia"))' "$TEST2"
          grep -Fq 'performScrollToNode(hasText("Volume globale delle sveglie del telefono"))' "$TEST2"
          EXPECTED=$'app/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/AlarmSettingsOverlayVolumeAndroidTest.kt\napp/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreenAndroidTest.kt\napp/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt'
          test "$(git diff --name-only | sort)" = "$EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$UI" "$TEST1" "$TEST2"
          git commit -m "feat(settings): redesign general settings UI"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
