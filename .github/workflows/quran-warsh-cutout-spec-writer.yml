name: Quran Warsh cutout spec writer

on:
  push:
    branches:
      - driver/quran-warsh-cutout-spec-20260908

permissions:
  contents: write

jobs:
  write_spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create spec commit from approved main
        shell: bash
        env:
          BASELINE_SHA: 23b9a5a0a7ea372ddb5d68e16a0027fd09a40231
          SPEC_BRANCH: spec/quran-warsh-cutout-20260908
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$BASELINE_SHA"
          cp .github/quran-warsh-cutout-spec-append.md /tmp/quran-spec.md
          git checkout --detach "$BASELINE_SHA"
          test -f PROJECT_SPEC.md
          ! grep -Fq 'Corano: S25 toolbar/cutout + supporto multi-riwaya (Warsh) APPROVED' PROJECT_SPEC.md
          cat /tmp/quran-spec.md >> PROJECT_SPEC.md
          git diff --check
          test "$(git diff --name-only)" = PROJECT_SPEC.md
          git config user.name IbnKhaldoun-svg
          git config user.email essalih.idriss.w@gmail.com
          git switch -c "$SPEC_BRANCH"
          git add PROJECT_SPEC.md
          git commit -m 'spec: track Quran S25 cutout fixes and Warsh riwaya'
          test "$(git rev-parse HEAD^)" = "$BASELINE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          git push origin "HEAD:refs/heads/$SPEC_BRANCH"
          echo "SPEC_SHA=$(git rev-parse HEAD)"
