name: Alarms compact UI candidate writer temp

on:
  push:
    branches:
      - alarms-compact-ui-candidate-writer-20260905

permissions:
  contents: write

jobs:
  write-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alarms-compact-ui-candidate
          fetch-depth: 0
      - name: Write compact alarm UI and focused Compose tests
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > app/src/main/java/com/archimedeprojects/arihna/feature/alarms/AlarmsPlaceholderScreen.kt
          echo '' | base64 -d | gzip -d > app/src/androidTest/java/com/archimedeprojects/arihna/feature/alarms/AlarmsScreenAndroidTest.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/archimedeprojects/arihna/feature/alarms/AlarmsPlaceholderScreen.kt app/src/androidTest/java/com/archimedeprojects/arihna/feature/alarms/AlarmsScreenAndroidTest.kt
          git commit -m "feat(alarms): compact personal alarm UI"
          git push origin HEAD:alarms-compact-ui-candidate
