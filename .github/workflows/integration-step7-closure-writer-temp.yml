name: Integration STEP 7 closure writer temp
on:
  push:
    branches: [integration-step7-closure-writer-temp]
    paths: [.github/workflows/integration-step7-closure-writer-temp.yml]
permissions:
  contents: write
  actions: read
jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edc97468d209d2a19452ec6d374e76537b32566d
          fetch-depth: 0
      - name: Verify base and STEP 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=edc97468d209d2a19452ec6d374e76537b32566d
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/100274563542 --jq '[.run_id,.conclusion]|join(" ")')" = '33638278152 success'
      - name: Patch PROJECT_SPEC only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('PROJECT_SPEC.md'); t=p.read_text()
          pairs={
          '### 5.3 Prayer Engine + Location integration — MILESTONE OPEN / STEP 5 CLOSED':'### 5.3 Prayer Engine + Location integration — MILESTONE CLOSED',
          '6. **STEP 6 — full regression gate: NOT STARTED.** Run Prayer + Location + Integration unit/build/API28 regressions plus permission/asset checks and final APK/data non-regression where practical.':'6. **STEP 6 — full regression gate: CLOSED.** Definitive exact-SHA run `33638278152` / job `100274563542` validated promoted `main` SHA `edc97468d209d2a19452ec6d374e76537b32566d` with the complete Prayer + Location + Integration regression, exact GeoNames asset, APK-size non-regression, and Android 9/API28 coverage.',
          '7. **STEP 7 — documentation-only milestone closure: NOT STARTED.** After an exact tested technical SHA is green/promoted, update the specification with definitive evidence and stop.':'7. **STEP 7 — documentation-only milestone closure: CLOSED by this documentation step.** The tested technical SHA was green, real-device validated and promoted before this docs-only closure; no application code or runtime policy changes here.',
          'STEP 2 Prayer settings persistence, STEP 3 schedule orchestration, STEP 4 presentation/countdown, and STEP 5 functional Home panel are **CLOSED** after their independent exact-SHA gates and promotion. STEP 6 full Prayer + Location + Integration regression remains **NOT STARTED / NEXT** and requires separate explicit authorization. Qibla, notifications/AlarmManager, adhan audio, custom alarms, Quran and the definitive dashboard remain separate milestones.':'STEP 2 Prayer settings persistence, STEP 3 schedule orchestration, STEP 4 presentation/countdown, STEP 5 functional Home panel, STEP 6 full regression, and STEP 7 documentation-only closure are **CLOSED**. The Prayer Engine + Location integration milestone is therefore closed. Qibla, notifications/AlarmManager, adhan audio, custom alarms, Quran and the definitive dashboard remain separate milestones and are not started or authorized by this closure.'}
          for a,b in pairs.items():
              assert t.count(a)==1, a
              t=t.replace(a,b,1)
          m='\n### 5.4 Qibla'; assert t.count(m)==1
          c='''\n\n#### STEP 6/7 definitive closure evidence — 2026-09-02\n\n- Definitive technical source: promoted `main` SHA `edc97468d209d2a19452ec6d374e76537b32566d`, directly above spec-first `dc2262cdca2861a721777511e031ae2f416d4c67`.\n- STEP 6: run `33638278152`, job `100274563542`, `success`; exact SHA/main equality verified; Temurin JDK 21 with Java/Kotlin target 17; COARSE-only, no FINE/background/Google Play Services Location, no ignored tests; 30 s / 5 km / 15 min policies unchanged.\n- Unit regression: **98/98**, 0 failures, 0 errors, 0 skipped.\n- Exact GeoNames: `28,020,736` bytes, SHA-256 `7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb`. Current-build APK measurement: baseline `34,363,378`, full `49,396,640`, increment **15,033,262 bytes**, `5,938,258` below the 20 MiB ceiling. This is a STEP 6 non-regression measurement and does not rewrite the historical STEP 4 measurement.\n- Android 9/API28: **41/41**, 0 failures, 0 errors, 0 skipped; classified coverage: 17 Prayer, 28 Location, 5 Home/integration cases.\n- Galaxy S25 manual validation PASS: candidate `685f37336fffc1cbfcd7169b74e2f0866c23498c` exercised the honest `CACHED` fallback; promoted candidate `edc97468d209d2a19452ec6d374e76537b32566d` then validated cache-first re-entry, showing persisted `Ready(CACHED)` Home/prayer data immediately on reopen without blocking for the current-location opportunity window. These PASS results do not claim framework FRESH acquisition is reliable; the documented S25 intermittency remains.\n- Location technology at closure remains Android framework `LocationManager`, COARSE-only, no background permission and no Google Play Services Location. A possible future migration to Google Play Services `FusedLocationProviderClient` is explicitly **DEFERRED / PENDING** and is not decided by this closure.\n- STEP 7 is documentation-only. No new product milestone is authorized or started; development stops here under the one-objective rule until the next objective is explicitly selected.\n'''
          p.write_text(t.replace(m,c+m,1))
          PY
          git diff --check -- PROJECT_SPEC.md
          test "$(git status --porcelain)" = ' M PROJECT_SPEC.md'
      - name: Commit docs-only closure
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(integration): close prayer location milestone'
          test "$(git rev-parse HEAD^)" = edc97468d209d2a19452ec6d374e76537b32566d
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = PROJECT_SPEC.md
          git push origin HEAD:refs/heads/prayer-location-integration-step7-closure-final
