name: Alarms compact UI definitive gate temp

on:
  push:
    branches:
      - alarms-compact-ui-gate-temp
    paths:
      - .github/workflows/alarms-compact-ui-definitive-gate-temp.yml

permissions:
  actions: read
  contents: read

jobs:
  api28-full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_RUNTIME_SHA: c79ec96e38c10eecce185d215e8abd7fd6ad3554
      SPEC_SHA: da10cd67cb75cc7e35f4a5706bc3430df611cc42
      CANDIDATE_SHA: 7601e41e8e7bb3d23d87eb996a37c8126bb17570
      GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
      ADHAN_SHA256: 3b350bc210d657727578ed977e32323c06b63c2088c3ebcea9fc9afb7d487702
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact lineage and frozen main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main alarms-compact-ui-spec alarms-compact-ui-candidate --force
          test "$(git rev-parse origin/main)" = "$SPEC_SHA"
          test "$(git rev-parse origin/alarms-compact-ui-spec)" = "$SPEC_SHA"
          test "$(git rev-parse origin/alarms-compact-ui-candidate)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$BASE_RUNTIME_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$SPEC_SHA"
          test "$(git diff --name-only "$BASE_RUNTIME_SHA" "$SPEC_SHA")" = "PROJECT_SPEC.md"
          EXPECTED=$'app/src/androidTest/java/com/archimedeprojects/arihna/feature/alarms/AlarmsScreenAndroidTest.kt\napp/src/main/java/com/archimedeprojects/arihna/feature/alarms/AlarmsPlaceholderScreen.kt'
          ACTUAL="$(git diff --name-only "$SPEC_SHA" "$CANDIDATE_SHA" | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git show "$SPEC_SHA:PROJECT_SPEC.md" | grep -Fq 'Galaxy S25 personal-alarm compact UI redesign — APPROVED 2026-09-05'
          git checkout --detach "$CANDIDATE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Verify compact-UI-only contract
        shell: bash
        run: |
          set -euo pipefail
          UI=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/AlarmsPlaceholderScreen.kt
          TEST=app/src/androidTest/java/com/archimedeprojects/arihna/feature/alarms/AlarmsScreenAndroidTest.kt
          grep -q 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -q 'minSdk = 28' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          for P in ACCESS_COARSE_LOCATION POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED USE_FULL_SCREEN_INTENT FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK SYSTEM_ALERT_WINDOW; do grep -q "android.permission.$P" app/src/main/AndroidManifest.xml; done
          ! grep -q 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          grep -Fq '.testTag("alarm-custom-row-${rule.alarmId}")' "$UI"
          grep -Fq '.clickable(onClick = onEdit)' "$UI"
          grep -Fq 'DialogProperties(usePlatformDefaultWidth = false)' "$UI"
          grep -Fq '.testTag("alarm-editor-delete")' "$UI"
          grep -Fq '.testTag("alarm-editor-save")' "$UI"
          grep -Fq '.testTag("alarm-editor-cancel")' "$UI"
          grep -Fq '.testTag("alarm-ringtone-row")' "$UI"
          ! grep -Fq 'PersonalAlarmHero' "$UI"
          ! grep -Fq 'alarm-edit-' "$UI"
          ! grep -Fq 'alarm-delete-' "$UI"
          ! grep -Fq 'soundLabel(rule)' "$UI"
          grep -Fq 'compactAlarmRowOpensEditingAndSwitchRemainsIndependent' "$TEST"
          grep -Fq 'compactAlarmRowHidesManagementActionsAndRingtoneName' "$TEST"
          grep -Fq 'newAlarmEditorHasNoDeleteAction' "$TEST"
          ! grep -Fq 'RemoteViews' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingOverlay.kt
          grep -Fq 'Settings.canDrawOverlays(appContext)' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmOverlayAccess.kt
          grep -Fq 'const val TEST_DELAY_MILLIS = 20_000L' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt
          grep -Fq 'AudioAttributes.USAGE_ALARM' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'AudioManager.STREAM_ALARM' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmVolumeController.kt
          test "$(stat -c '%s' app/src/main/res/raw/adhan_cc0.ogg)" = "820174"
          test "$(sha256sum app/src/main/res/raw/adhan_cc0.ogg | awk '{print $1}')" = "$ADHAN_SHA256"
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh run download 33296099459 --repo "$GITHUB_REPOSITORY" --name geonames-step4-runtime-minimal --dir /tmp/geonames
          DB="$(find /tmp/geonames -type f -name cities.db -print -quit)"
          test -n "$DB"
          cp "$DB" app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Smoke JVM regression
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Smoke assembleDebug
        run: ./gradlew assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; test -r /dev/kvm; test -w /dev/kvm; fi
      - name: API28 connected regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Verify API28 zero-skip totals
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('app/build/outputs/androidTest-results/connected/debug/**/*.xml',recursive=True); assert files
          tests=failures=errors=skipped=0; names=[]
          for f in files:
              r=ET.parse(f).getroot(); tests+=int(r.attrib.get('tests',0)); failures+=int(r.attrib.get('failures',0)); errors+=int(r.attrib.get('errors',0)); skipped+=int(r.attrib.get('skipped',0)); names += [tc.attrib.get('classname','') for tc in r.iter('testcase')]
          print(f'CONNECTED_TOTAL tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 71 and failures == 0 and errors == 0 and skipped == 0
          for n in ['AlarmPlatformAndroidTest','AlarmsScreenAndroidTest','AlarmNotificationAndroidTest','AlarmDiagnosticAndroidTest','AlarmOverlayVolumeAndroidTest','AlarmSettingsOverlayVolumeAndroidTest']:
              assert any(n in x for x in names), n
          PY

  api36-modern-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_RUNTIME_SHA: c79ec96e38c10eecce185d215e8abd7fd6ad3554
      SPEC_SHA: da10cd67cb75cc7e35f4a5706bc3430df611cc42
      CANDIDATE_SHA: 7601e41e8e7bb3d23d87eb996a37c8126bb17570
      HARNESS_SOURCE_SHA: 5c3597e60640f81994cda8c2a3cb11d5de999b4c
      GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage modern harness and checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main alarms-compact-ui-spec alarms-compact-ui-candidate --force
          test "$(git rev-parse origin/main)" = "$SPEC_SHA"
          test "$(git rev-parse origin/alarms-compact-ui-spec)" = "$SPEC_SHA"
          test "$(git rev-parse origin/alarms-compact-ui-candidate)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$BASE_RUNTIME_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$SPEC_SHA"
          git show "$HARNESS_SOURCE_SHA:.github/alarms-s25-overlay-volume/OverlayVolumeModernAndroidTest.kt" > /tmp/OverlayVolumeModernAndroidTest.kt
          git show "$HARNESS_SOURCE_SHA:.github/alarms-s25-overlay-volume/run-modern-api36.sh" > /tmp/run-modern-api36.sh
          chmod +x /tmp/run-modern-api36.sh
          git checkout --detach "$CANDIDATE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Verify modern platform contract unchanged
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingOverlay.kt
          grep -Fq 'Settings.canDrawOverlays(appContext)' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmOverlayAccess.kt
          ! grep -Fq 'RemoteViews' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'AudioManager.STREAM_ALARM' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmVolumeController.kt
          grep -Fq 'const val TEST_DELAY_MILLIS = 20_000L' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh run download 33296099459 --repo "$GITHUB_REPOSITORY" --name geonames-step4-runtime-minimal --dir /tmp/geonames
          DB="$(find /tmp/geonames -type f -name cities.db -print -quit)"
          test -n "$DB"
          cp "$DB" app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Enable KVM
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; test -r /dev/kvm; test -w /dev/kvm; fi
      - name: API36 denied/granted exact notification fullscreen overlay matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: /tmp/run-modern-api36.sh
