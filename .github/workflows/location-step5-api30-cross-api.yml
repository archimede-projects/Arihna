name: Location STEP 5 API30 coarse mock control

on:
  push:
    branches:
      - location-step5-api30-diag
    paths:
      - app/src/androidTest/java/com/archimedeprojects/arihna/core/location/platform/CoarseMockProviderCrossApiAndroidTest.kt
      - .github/workflows/location-step5-api30-cross-api.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  api30-coarse-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: android-actions/setup-android@v3

      - name: Verify COARSE-only production manifest
        run: |
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml

      - name: Run isolated COARSE-only mock-provider control on Android 11 / API 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            echo "Waiting for Android framework services package/activity..."
            ready=0
            for attempt in $(seq 1 300); do
              package_state="$(adb shell service check package 2>/dev/null || true)"
              activity_state="$(adb shell service check activity 2>/dev/null || true)"
              if echo "$package_state" | grep -q "found" && \
                 echo "$activity_state" | grep -q "found" && \
                 adb shell pm path android >/dev/null 2>&1 && \
                 adb shell am get-current-user >/dev/null 2>&1; then
                ready=1
                echo "Android framework services ready on attempt $attempt"
                break
              fi
              if [ $((attempt % 30)) -eq 0 ]; then
                echo "Still waiting: package='$package_state' activity='$activity_state'"
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Android package/activity services never became ready"
              adb shell service list || true
              exit 1
            fi
            adb shell service check package
            adb shell service check activity
            adb shell pm path android
            adb shell am get-current-user
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.archimedeprojects.arihna.core.location.platform.CoarseMockProviderCrossApiAndroidTest \
              --stacktrace
