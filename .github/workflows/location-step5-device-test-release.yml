name: Location STEP 5 device-test release

on:
  push:
    branches:
      - location-step5-device-test
    paths:
      - app/**
      - .github/test-signing/arihna-debug.keystore.b64
      - .github/workflows/location-step5-device-test-release.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: step5-device-test-s25-20260830-1
      APK_NAME: arihna-step5-device-test-s25.apk
      DEBUG_CERT_SHA256: 13:97:00:8C:1F:96:2D:BB:D3:6D:D8:A8:EA:02:16:AF:DD:06:E4:B2:B3:E0:8B:C0:F6:D4:B5:43:44:D7:B0:FA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - name: Verify production permission policy
        run: |
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -R -q 'com.google.android.gms.location' app/src/main gradle

      - name: Restore exact STEP 4 city asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/step4-asset app/src/main/assets/geonames
          mkdir -p /tmp/step4-asset app/src/main/assets/geonames
          gh run download 33296099459 \
            --repo "$GITHUB_REPOSITORY" \
            --name geonames-step4-runtime-minimal \
            --dir /tmp/step4-asset
          DB="$(find /tmp/step4-asset -type f -name cities.db -print -quit)"
          test -n "$DB"
          cp "$DB" app/src/main/assets/geonames/cities.db
          echo '7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb  app/src/main/assets/geonames/cities.db' | sha256sum -c -

      - name: Restore persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/test-signing/arihna-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          test "$(sha256sum "$HOME/.android/debug.keystore" | awk '{print $1}')" = 'bc9057f26ad6de7efb70a5df06effb1ed259f1d015c3f062d0f757b3f0983b72'
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -F "$DEBUG_CERT_SHA256"

      - name: Unit regression
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK signature and rename
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fi '13:97:00:8c:1f:96:2d:bb:d3:6d:d8:a8:ea:02:16:af:dd:06:e4:b2:b3:e0:8b:c0:f6:d4:b5:43:44:d7:b0:fa' /tmp/apksigner.txt
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Arihna STEP 5 — Galaxy S25 device test' \
            --prerelease \
            --notes "Temporary manual-test APK for the LocationManager STEP 5 bridge. ACCESS_COARSE_LOCATION only; no FINE/background location. Temporary debug UI only, not STEP 6. Persistent debug signing certificate SHA-256: $DEBUG_CERT_SHA256."
