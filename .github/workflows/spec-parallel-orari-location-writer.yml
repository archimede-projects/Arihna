name: Write parallel Orari and location spec

on:
  push:
    branches:
      - spec-parallel-orari-location-driver-20260907

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: a57da538aca183704e6c3f2731203a73b7016cc1
      TARGET_BRANCH: spec-parallel-orari-location
      SPEC_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BASE_SHA }}
      - name: Verify exact base
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"
      - name: Append approved parallel location spec
        run: |
          printf '\n\n' >> PROJECT_SPEC.md
          printf '%s' "$SPEC_B64" | base64 -d >> PROJECT_SPEC.md
      - name: Verify spec-only diff
        run: |
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          grep -F '“Posizione attuale” explicit refresh semantics APPROVED' PROJECT_SPEC.md
          grep -F '5 km significance threshold' PROJECT_SPEC.md
          grep -F 'Orari and Location may be implemented and gated on separate sibling candidates' PROJECT_SPEC.md
      - name: Commit and push shared spec branch
        run: |
          git config user.name 'Arihna Spec Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(spec): approve explicit location refresh in parallel with Orari'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "PROJECT_SPEC.md"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
          echo "SPEC_SHA=$(git rev-parse HEAD)"
