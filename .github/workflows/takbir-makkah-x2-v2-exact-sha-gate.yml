name: Makkah two-takbir v2 exact-SHA gate

on:
  push:
    branches:
      - driver/takbir-makkah-x2-v2-gate-20260925
    paths:
      - .github/workflows/takbir-makkah-x2-v2-exact-sha-gate.yml

permissions:
  contents: read

env:
  SPEC_SHA: 32d1d1a5e61c5329d8bf3fe91367d6f820e9b981
  CANDIDATE_SHA: 2182e303afde1e3823af03cbb8d8afabf3541c52
  PREVIOUS_MAIN_SHA: ab1051c43514b4595b92ae3533a3ee644b41dd29
  GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
  FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
  FROZEN_ASSET_APK: arihna-settings-s25-premium.apk
  TAKBIR_SHA256: 18740acd61b8b5946a14fc7551dee851642c710d37501892195593477e065f89
  TAKBIR_SIZE: '132738'

jobs:
  static-jvm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2182e303afde1e3823af03cbb8d8afabf3541c52
          fetch-depth: 0

      - name: Verify exact lineage scope and Makkah audio contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
          test "$(git merge-base "$SPEC_SHA" "$CANDIDATE_SHA")" = "$SPEC_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$PREVIOUS_MAIN_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$PREVIOUS_MAIN_SHA"

          mapfile -t CHANGED < <(git diff --name-only "$SPEC_SHA..$CANDIDATE_SHA" | sort)
          EXPECTED=(
            'app/build.gradle.kts'
            'app/src/androidTest/java/com/archimedeprojects/arihna/feature/prayers/PrayerAlertUiAndroidTest.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/alarms/domain/AlarmModels.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/prayers/PrayerTimesPlaceholderScreen.kt'
            'app/src/main/res/raw/takbir_makkah_x2_cc_by.opus'
            'app/src/test/java/com/archimedeprojects/arihna/feature/alarms/domain/AdhanVariantTest.kt'
            'app/src/test/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingPlaybackTest.kt'
            'docs/audio/ADHAN_SOURCES.md'
          )
          test "${#CHANGED[@]}" -eq 9
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${CHANGED[@]}")

          T=app/src/main/res/raw/takbir_makkah_x2_cc_by.opus
          test -f "$T"
          test "$(stat -c '%s' "$T")" = "$TAKBIR_SIZE"
          test "$(sha256sum "$T" | awk '{print $1}')" = "$TAKBIR_SHA256"

          M=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/domain/AlarmModels.kt
          R=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          P=app/src/main/java/com/archimedeprojects/arihna/feature/prayers/PrayerTimesPlaceholderScreen.kt
          U=app/src/test/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingPlaybackTest.kt
          D=docs/audio/ADHAN_SOURCES.md
          grep -Fq 'TAKBIR_X2("takbir-x2", "Takbīr Makkah · Allahu Akbar ×2")' "$M"
          grep -Fq 'internal fun adhanRepeatCount(variant: AdhanVariant): Int = 1' "$R"
          grep -Fq 'TAKBIR_X2 -> R.raw.takbir_makkah_x2_cc_by' "$R"
          grep -Fq 'Takbīr Makkah · Allahu Akbar ×2' "$P"
          grep -Fq 'bundledMakkahTakbirPairPlaysExactlyOnce' "$U"
          grep -Fq 'Great Mosque of Mecca' "$D"
          grep -Fq 'Seyfula Islam' "$D"
          grep -Fq 'CC BY 3.0' "$D"
          grep -Fq "$TAKBIR_SHA256" "$D"
          ! grep -R -Fq 'takbir_allahuakbar_cc0' app/build.gradle.kts app/src/main/java app/src/test app/src/androidTest || false
          test -z "$(grep -R -l -F 'takbir_allahuakbar_cc0' app/build.gradle.kts app/src/main/java app/src/test app/src/androidTest 2>/dev/null || true)"
          test -z "$(grep -R -l -F 'Takbīr breve · Allahu Akbar ×2' app/src/main app/src/test app/src/androidTest 2>/dev/null || true)"

          grep -Fq 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -Fq 'minSdk = 28' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Unit tests AndroidTest compile and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace

      - name: Verify APK Makkah audio contract
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.archimedeprojects.arihna'" /tmp/badging.txt
          grep -F "sdkVersion:'28'" /tmp/badging.txt
          grep -F "targetSdkVersion:'37'" /tmp/badging.txt
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | awk '{print $1}')" = "$GEONAMES_SHA256"
          unzip -l "$APK" | grep -Fq 'res/raw/takbir_makkah_x2_cc_by.opus'
          test "$(unzip -p "$APK" res/raw/takbir_makkah_x2_cc_by.opus | wc -c)" = "$TAKBIR_SIZE"
          test "$(unzip -p "$APK" res/raw/takbir_makkah_x2_cc_by.opus | sha256sum | awk '{print $1}')" = "$TAKBIR_SHA256"
          ! unzip -l "$APK" | grep -Fq 'takbir_allahuakbar_cc0'

  api28-full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2182e303afde1e3823af03cbb8d8afabf3541c52
          fetch-depth: 0
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - run: sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Require zero API28 failures and preserved coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files, 'no connected test XML found'
          tests=failures=errors=skipped=0; cases=[]
          for f in files:
              r=ET.parse(f).getroot()
              tests+=int(r.attrib.get('tests','0')); failures+=int(r.attrib.get('failures','0'))
              errors+=int(r.attrib.get('errors','0')); skipped+=int(r.attrib.get('skipped',r.attrib.get('disabled','0')))
              for c in r.iter('testcase'):
                  cases.append((c.attrib.get('classname',''),c.attrib.get('name','')))
          print(f'API28_CONNECTED_XML tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 101, tests
          assert failures == errors == skipped == 0, (failures,errors,skipped)
          required={
            'missingValuesDefaultToHundredAndPrayersRoundTripIndependently',
            'persistedValuesClampToZeroThroughHundred',
            'prayerDialogExposesIndependentVolumeAndDedicatedTwoTakbirChoice',
            'streamlinedSectionsHideCapabilityRowsAndKeepTenSecondTests',
            'premiumSectionsReplaceVerboseTemporaryCopy',
            'imlaiKeepsHafsPageJumpBookmarkFullscreenAndSwitchState',
          }
          seen={name for _,name in cases}
          assert required <= seen, (required-seen)
          PY

  api36-feature-quran-permission-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2182e303afde1e3823af03cbb8d8afabf3541c52
          fetch-depth: 0
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Prepare API36 device script
        shell: bash
        run: |
          cat > /tmp/api36-gate.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          CLASSES='com.archimedeprojects.arihna.feature.alarms.data.preferences.PrayerAlertPreferencesAndroidTest,com.archimedeprojects.arihna.feature.prayers.PrayerAlertUiAndroidTest,com.archimedeprojects.arihna.feature.quran.QuranFullscreenAndroidTest,com.archimedeprojects.arihna.feature.quran.QuranPostStableHardeningAndroidTest,com.archimedeprojects.arihna.feature.quran.TajwidCrashRegressionAndroidTest,com.archimedeprojects.arihna.feature.quran.QuranImlaiAndroidTest'
          ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$CLASSES" --stacktrace
          P=com.archimedeprojects.arihna
          ./gradlew :app:installDebug --stacktrace
          adb shell pm revoke "$P" android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm revoke "$P" android.permission.ACCESS_COARSE_LOCATION || true
          adb shell pm grant "$P" android.permission.ACCESS_COARSE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=false'
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -1 | grep -q 'granted=true'
          adb shell pm grant "$P" android.permission.ACCESS_FINE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=true'
          adb shell pm revoke "$P" android.permission.POST_NOTIFICATIONS || true
          adb shell dumpsys package "$P" | grep -F 'android.permission.POST_NOTIFICATIONS:' | head -1 | grep -q 'granted=false'
          adb shell pm grant "$P" android.permission.POST_NOTIFICATIONS
          adb shell dumpsys package "$P" | grep -F 'android.permission.POST_NOTIFICATIONS:' | head -1 | grep -q 'granted=true'
          echo API36_MAKKAH_TAKBIR_PERMISSION_MATRIX_SUCCESS | tee /tmp/api36-makkah-takbir-permission-matrix.txt
          SH
          chmod +x /tmp/api36-gate.sh
      - run: sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: /tmp/api36-gate.sh
      - name: Require feature Quran and permission matrix success
        shell: bash
        run: |
          test "$(cat /tmp/api36-makkah-takbir-permission-matrix.txt)" = 'API36_MAKKAH_TAKBIR_PERMISSION_MATRIX_SUCCESS'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files, 'no connected test XML found'
          tests=failures=errors=skipped=0; cases=[]; classes=set()
          for f in files:
              r=ET.parse(f).getroot()
              tests+=int(r.attrib.get('tests','0')); failures+=int(r.attrib.get('failures','0'))
              errors+=int(r.attrib.get('errors','0')); skipped+=int(r.attrib.get('skipped',r.attrib.get('disabled','0')))
              for c in r.iter('testcase'):
                  cls=c.attrib.get('classname',''); name=c.attrib.get('name','')
                  cases.append((cls,name)); classes.add(cls)
          print(f'API36_CONNECTED_XML tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert failures == errors == skipped == 0, (failures,errors,skipped)
          for suffix in (
              'PrayerAlertPreferencesAndroidTest','PrayerAlertUiAndroidTest',
              'QuranImlaiAndroidTest','QuranPostStableHardeningAndroidTest',
              'TajwidCrashRegressionAndroidTest',
          ):
              assert any(c.endswith(suffix) for c in classes), (suffix,classes)
          required={
              'missingValuesDefaultToHundredAndPrayersRoundTripIndependently',
              'prayerDialogExposesIndependentVolumeAndDedicatedTwoTakbirChoice',
              'imlaiKeepsHafsPageJumpBookmarkFullscreenAndSwitchState',
          }
          seen={name for _,name in cases}
          assert required <= seen, (required-seen)
          PY
