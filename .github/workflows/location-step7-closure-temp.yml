name: Temporary Location STEP 7 closure editor

on:
  push:
    branches: [location-step7-closure]

permissions:
  contents: write

jobs:
  close-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply asserted spec edits
        run: python3 tools/step7_close_spec_temp.py
      - name: Verify closure markers
        run: |
          grep -q '### 5.2 Location — MILESTONE CLOSED' PROJECT_SPEC.md
          grep -q 'Location STEP 7 final milestone regression — PASSED / MILESTONE CLOSED' PROJECT_SPEC.md
          grep -q '33326121715' PROJECT_SPEC.md
          grep -q '33326126008' PROJECT_SPEC.md
          grep -q 'Location milestone — CLOSED' PROJECT_SPEC.md
      - name: Commit validated spec blob
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git diff --cached --check
          git commit -m 'docs(location): close Location milestone after final regression'
          git push origin HEAD:location-step7-closure
