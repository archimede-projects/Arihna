name: Home Hijri Quran Arabic exact-SHA gate

on:
  push:
    branches:
      - home-hijri-quran-arabic-gate-driver-20260907

permissions:
  contents: read

env:
  SPEC_SHA: 89bef3ff59bebc8e3cf0db3652ff18b9dd056938
  CANDIDATE_SHA: 0bfa6016afc3a1cbecb721680e68cd7d99d7226c
  PACKAGE_NAME: com.archimedeprojects.arihna
  GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
  FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
  FROZEN_ASSET_APK: arihna-settings-s25-premium.apk

jobs:
  static-jvm-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 0bfa6016afc3a1cbecb721680e68cd7d99d7226c
          fetch-depth: 0

      - name: Verify exact SHA lineage and product contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          grep -Fq 'home-hijri-date' app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          grep -Fq 'home-calendar-dialog' app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          grep -Fq 'Icons.Rounded.MenuBook' app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          grep -Fq 'quran-mode-easy' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'quran-mode-hafs' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'settings-language-arabic' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          grep -Fq 'LayoutDirection.Rtl' app/src/main/java/com/archimedeprojects/arihna/app/ArihnaApp.kt
          grep -Fq 'settings-alarm-volume-slider' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          ! grep -Fq 'settings-alarm-volume-decrease' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          ! grep -Fq 'settings-alarm-volume-increase' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          grep -Fq 'a5284b17034d36567e4a4bac982a17ba56837448' app/build.gradle.kts
          grep -F 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -F 'minSdk = 28' app/build.gradle.kts
          grep -F 'compileSdk = 37' app/build.gradle.kts
          grep -F 'targetSdk = 37' app/build.gradle.kts
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore frozen GeoNames
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Host tests instrumentation compile and debug build
        shell: bash
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace

      - name: Verify generated Quran corpus and built APK
        shell: bash
        run: |
          set -euo pipefail
          Q=app/build/generated/quranAssets/quran
          test -s "$Q/quran-uthmani.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('app/build/generated/quranAssets/quran')
          verses=[]
          for line in (p/'quran-uthmani.txt').read_text(encoding='utf-8').splitlines():
              parts=line.split('|',2)
              if len(parts)==3 and parts[0].isdigit() and parts[1].isdigit():
                  verses.append((int(parts[0]),int(parts[1]),parts[2]))
          assert len(verses)==6236, len(verses)
          assert len({v[0] for v in verses})==114
          juz=json.loads((p/'juz-info.json').read_text())
          hizb=json.loads((p/'hizb-info.json').read_text())
          assert len(juz)==30 and len(hizb)>=60
          assert juz['1']['surahNum']==1 and juz['1']['ayahNum']==1
          assert 'Creative Commons Attribution 3.0' in (p/'TANZIL_TEXT_README.md').read_text()
          PY
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -s "$APK" && test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.archimedeprojects.arihna'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'28'"
          "$AAPT" dump badging "$APK" | grep -F "targetSdkVersion:'37'"
          ! "$AAPT" dump permissions "$APK" | grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION'
          ! "$AAPT" dump permissions "$APK" | grep -Fq 'android.permission.USE_EXACT_ALARM'
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | cut -d' ' -f1)" = "$GEONAMES_SHA256"
          sha256sum "$APK"

  api28-full-suite:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout gate driver to preserve validator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve validator and checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/validate_connected_xml.py /tmp/validate_connected_xml.py
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore frozen GeoNames
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Run every instrumentation test on Android API28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Require real zero-failure zero-error zero-skip XML
        shell: bash
        run: python3 /tmp/validate_connected_xml.py

  api36-location-permission-matrix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 0bfa6016afc3a1cbecb721680e68cd7d99d7226c
          fetch-depth: 0

      - name: Verify exact candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore frozen GeoNames
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Prepare Android 16 permission matrix harness
        shell: bash
        run: |
          cat > /tmp/api36-permission-matrix.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          PACKAGE_NAME=com.archimedeprojects.arihna
          ./gradlew :app:installDebug --stacktrace
          adb shell pm revoke "$PACKAGE_NAME" android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm revoke "$PACKAGE_NAME" android.permission.ACCESS_COARSE_LOCATION || true
          adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -n 1 | grep -q 'granted=false'
          adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -n 1 | grep -q 'granted=false'
          adb shell pm grant "$PACKAGE_NAME" android.permission.ACCESS_COARSE_LOCATION
          adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -n 1 | grep -q 'granted=false'
          adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -n 1 | grep -q 'granted=true'
          adb shell pm grant "$PACKAGE_NAME" android.permission.ACCESS_FINE_LOCATION
          adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -n 1 | grep -q 'granted=true'
          adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -n 1 | grep -q 'granted=true'
          adb shell pm revoke "$PACKAGE_NAME" android.permission.ACCESS_FINE_LOCATION
          adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -n 1 | grep -q 'granted=false'
          adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -n 1 | grep -q 'granted=true'
          echo API36_PERMISSION_MATRIX_SUCCESS
          SH
          chmod +x /tmp/api36-permission-matrix.sh

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Android 16 API36 location permission matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash /tmp/api36-permission-matrix.sh
