name: Qibla compact layout exact-SHA gate
on:
  push:
    branches: [qibla-compact-layout-gate-final2-temp]
    paths: [.github/workflows/qibla-compact-layout-gate-final2-temp.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: 7d88b83b423de353a399c07ab80ccaf247b4b45d
      SPEC_SHA: c3fc3855606a79d3d57bfa24668c1a59072faa65
      CITY_DB_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d88b83b423de353a399c07ab80ccaf247b4b45d
          fetch-depth: 0
      - name: Verify exact candidate ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-parse origin/main)" = "$SPEC_SHA"
          mapfile -t files < <(git diff --name-only "$SPEC_SHA" "$TARGET_SHA")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          printf '%s\n' "${files[@]}" | grep -Fxq 'app/src/main/java/com/archimedeprojects/arihna/feature/qibla/QiblaPlaceholderScreen.kt'
          printf '%s\n' "${files[@]}" | grep -Fxq 'app/src/androidTest/java/com/archimedeprojects/arihna/feature/qibla/QiblaScreenAndroidTest.kt'
          grep -Fq 'Galaxy S25 compact single-viewport Qibla layout — APPROVED 2026-09-04' PROJECT_SPEC.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Verify compact UI and policy contract
        shell: bash
        run: |
          set -euo pipefail
          UI=app/src/main/java/com/archimedeprojects/arihna/feature/qibla/QiblaPlaceholderScreen.kt
          TEST=app/src/androidTest/java/com/archimedeprojects/arihna/feature/qibla/QiblaScreenAndroidTest.kt
          grep -Fq 'qibla-single-viewport' "$UI"
          grep -Fq 'qibla-full-compass' "$UI"
          grep -Fq 'qibla-live-cardinal-rose' "$UI"
          grep -Fq 'qibla-live-direction' "$UI"
          grep -Fq 'qibla-magnetic-field' "$UI"
          grep -Fq 'qibla-heading-quality' "$UI"
          grep -Fq 'qibla-heading-source' "$UI"
          grep -Fq 'qibla-declination' "$UI"
          ! grep -Fq 'verticalScroll' "$UI"
          ! grep -Fq 'performScrollTo' "$TEST"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.BODY_SENSORS' app/src/main/AndroidManifest.xml
          ! grep -R -q 'com.google.android.gms.location' app/src/main gradle
          ! grep -R -q '@Ignore' app/src/test app/src/androidTest
      - name: Restore exact city asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qibla-asset app/src/main/assets/geonames
          mkdir -p /tmp/qibla-asset app/src/main/assets/geonames
          gh run download 33296099459 --repo "$GITHUB_REPOSITORY" --name geonames-step4-runtime-minimal --dir /tmp/qibla-asset
          DB="$(find /tmp/qibla-asset -type f -name cities.db -print -quit)"
          test -n "$DB"
          cp "$DB" app/src/main/assets/geonames/cities.db
          test "$(sha256sum app/src/main/assets/geonames/cities.db | awk '{print $1}')" = "$CITY_DB_SHA256"
      - name: Run complete unit regression
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Run complete Android 9 API28 connected regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Verify API28 reports and Qibla UI coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=[]
          for root in [Path('app/build/outputs/androidTest-results/connected'),Path('app/build/outputs/androidTest-results/connected/debug')]:
              if root.exists(): files.extend(root.rglob('*.xml'))
          files=sorted(set(files)); assert files
          tests=failures=errors=skipped=qibla_ui=0; seen=set()
          for f in files:
              try: root=ET.parse(f).getroot()
              except ET.ParseError: continue
              suites=[root] if root.tag=='testsuite' else root.findall('.//testsuite')
              for suite in suites:
                  key=(str(f),suite.attrib.get('name'))
                  if key in seen: continue
                  seen.add(key)
                  tests+=int(suite.attrib.get('tests',0)); failures+=int(suite.attrib.get('failures',0)); errors+=int(suite.attrib.get('errors',0)); skipped+=int(suite.attrib.get('skipped',0))
                  if 'QiblaScreenAndroidTest' in suite.attrib.get('name',''): qibla_ui += int(suite.attrib.get('tests',0))
          print(f'API28_SUMMARY tests={tests} failures={failures} errors={errors} skipped={skipped} qiblaUiCases={qibla_ui}')
          assert tests >= 48 and failures == errors == skipped == 0
          assert qibla_ui >= 5
          PY
