name: Per-alert volume exact-SHA gate

on:
  push:
    branches:
      - driver/alarm-local-volume-v1-gate-20261008
    paths:
      - .github/workflows/alarm-local-volume-v1-exact-sha-gate.yml

permissions:
  contents: read

env:
  SPEC_SHA: 5efe93d4d134091a8bfb93631819ca23cf115d3c
  CANDIDATE_SHA: add8df0d5322773989210cbca0d2b6bd2668f280
  PREVIOUS_MAIN_SHA: 2182e303afde1e3823af03cbb8d8afabf3541c52
  GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
  FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
  FROZEN_ASSET_APK: arihna-settings-s25-premium.apk

jobs:
  static-jvm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add8df0d5322773989210cbca0d2b6bd2668f280
          fetch-depth: 0

      - name: Verify exact lineage scope and local-volume contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
          test "$(git merge-base "$SPEC_SHA" "$CANDIDATE_SHA")" = "$SPEC_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$PREVIOUS_MAIN_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$PREVIOUS_MAIN_SHA"

          mapfile -t CHANGED < <(git diff --name-only "$SPEC_SHA..$CANDIDATE_SHA" | sort)
          EXPECTED=(
            'app/src/androidTest/java/com/archimedeprojects/arihna/feature/alarms/AlarmsScreenAndroidTest.kt'
            'app/src/androidTest/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmOverlayVolumeAndroidTest.kt'
            'app/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/AlarmSettingsOverlayVolumeAndroidTest.kt'
            'app/src/main/java/com/archimedeprojects/arihna/app/AppContainer.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/alarms/AlarmsPlaceholderScreen.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/alarms/AlarmsViewModel.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/alarms/data/preferences/AlarmRulePreferencesCodec.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/alarms/data/preferences/PreferencesDataStoreAlarmRuleRepository.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/alarms/domain/AlarmModels.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmOccurrenceHandler.kt'
            'app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt'
            'app/src/test/java/com/archimedeprojects/arihna/feature/alarms/data/preferences/AlarmRulePreferencesCodecTest.kt'
          )
          test "${#CHANGED[@]}" -eq 12
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${CHANGED[@]}")

          SETTINGS=app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          EDITOR=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/AlarmsPlaceholderScreen.kt
          MODEL=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/domain/AlarmModels.kt
          CODEC=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/data/preferences/AlarmRulePreferencesCodec.kt
          CONTAINER=app/src/main/java/com/archimedeprojects/arihna/app/AppContainer.kt

          test -z "$(grep -F 'Volume globale delle sveglie del telefono' "$SETTINGS" || true)"
          test -z "$(grep -F 'AlarmVolumeController' "$SETTINGS" || true)"
          test -z "$(grep -F 'settings-alarm-volume-slider' "$SETTINGS" || true)"
          grep -Fq 'Volume di questa sveglia' "$EDITOR"
          grep -Fq 'alarm-volume-slider' "$EDITOR"
          grep -Fq 'val playbackVolumePercent: Int = 100' "$MODEL"
          grep -Fq 'ARIHNA_ALARMS_V3' "$CODEC"
          grep -Fq 'rule.playbackVolumePercent' "$CONTAINER"
          grep -Fq 'prayerAlertPreferencesRepository.volumeFor(prayer)' "$CONTAINER"

          grep -Fq 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -Fq 'minSdk = 28' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Unit tests AndroidTest compile and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace

      - name: Verify APK package and SDK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.archimedeprojects.arihna'" /tmp/badging.txt
          grep -F "sdkVersion:'28'" /tmp/badging.txt
          grep -F "targetSdkVersion:'37'" /tmp/badging.txt
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | awk '{print $1}')" = "$GEONAMES_SHA256"

  api28-full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add8df0d5322773989210cbca0d2b6bd2668f280
          fetch-depth: 0
      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - run: sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Require zero API28 failures and volume coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files, 'no connected test XML found'
          tests=failures=errors=skipped=0; cases=[]
          for f in files:
              r=ET.parse(f).getroot()
              tests+=int(r.attrib.get('tests','0')); failures+=int(r.attrib.get('failures','0'))
              errors+=int(r.attrib.get('errors','0')); skipped+=int(r.attrib.get('skipped',r.attrib.get('disabled','0')))
              for c in r.iter('testcase'):
                  cases.append((c.attrib.get('classname',''),c.attrib.get('name','')))
          print(f'API28_CONNECTED_XML tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 101, tests
          assert failures == errors == skipped == 0, (failures,errors,skipped)
          required={
            'customAlarmEditorControlsOnlyItsOwnPersistedVolume',
            'settingsHideCapabilityRowsAndGlobalAlarmVolume',
            'missingValuesDefaultToHundredAndPrayersRoundTripIndependently',
            'prayerDialogExposesIndependentVolumeAndDedicatedTwoTakbirChoice',
            'imlaiKeepsHafsPageJumpBookmarkFullscreenAndSwitchState',
          }
          seen={name for _,name in cases}
          assert required <= seen, (required-seen)
          PY

  api36-feature-quran-permission-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add8df0d5322773989210cbca0d2b6bd2668f280
          fetch-depth: 0
      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-list --count "$SPEC_SHA..$CANDIDATE_SHA")" -eq 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Prepare API36 device script
        shell: bash
        run: |
          cat > /tmp/api36-gate.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          CLASSES='com.archimedeprojects.arihna.feature.alarms.AlarmsScreenAndroidTest,com.archimedeprojects.arihna.feature.settings.AlarmSettingsOverlayVolumeAndroidTest,com.archimedeprojects.arihna.feature.alarms.data.preferences.PrayerAlertPreferencesAndroidTest,com.archimedeprojects.arihna.feature.prayers.PrayerAlertUiAndroidTest,com.archimedeprojects.arihna.feature.quran.QuranFullscreenAndroidTest,com.archimedeprojects.arihna.feature.quran.QuranPostStableHardeningAndroidTest,com.archimedeprojects.arihna.feature.quran.TajwidCrashRegressionAndroidTest,com.archimedeprojects.arihna.feature.quran.QuranImlaiAndroidTest'
          ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$CLASSES" --stacktrace
          P=com.archimedeprojects.arihna
          ./gradlew :app:installDebug --stacktrace
          adb shell pm revoke "$P" android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm revoke "$P" android.permission.ACCESS_COARSE_LOCATION || true
          adb shell pm grant "$P" android.permission.ACCESS_COARSE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=false'
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -1 | grep -q 'granted=true'
          adb shell pm grant "$P" android.permission.ACCESS_FINE_LOCATION
          adb shell dumpsys package "$P" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -1 | grep -q 'granted=true'
          adb shell pm revoke "$P" android.permission.POST_NOTIFICATIONS || true
          adb shell dumpsys package "$P" | grep -F 'android.permission.POST_NOTIFICATIONS:' | head -1 | grep -q 'granted=false'
          adb shell pm grant "$P" android.permission.POST_NOTIFICATIONS
          adb shell dumpsys package "$P" | grep -F 'android.permission.POST_NOTIFICATIONS:' | head -1 | grep -q 'granted=true'
          echo API36_LOCAL_VOLUME_PERMISSION_MATRIX_SUCCESS | tee /tmp/api36-local-volume-permission-matrix.txt
          SH
          chmod +x /tmp/api36-gate.sh
      - run: sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: /tmp/api36-gate.sh
      - name: Require feature Quran and permission matrix success
        shell: bash
        run: |
          test "$(cat /tmp/api36-local-volume-permission-matrix.txt)" = 'API36_LOCAL_VOLUME_PERMISSION_MATRIX_SUCCESS'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files, 'no connected test XML found'
          tests=failures=errors=skipped=0; cases=[]
          for f in files:
              r=ET.parse(f).getroot()
              tests+=int(r.attrib.get('tests','0')); failures+=int(r.attrib.get('failures','0'))
              errors+=int(r.attrib.get('errors','0')); skipped+=int(r.attrib.get('skipped',r.attrib.get('disabled','0')))
              for c in r.iter('testcase'):
                  cases.append((c.attrib.get('classname',''),c.attrib.get('name','')))
          print(f'API36_CONNECTED_XML tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert failures == errors == skipped == 0, (failures,errors,skipped)
          required={
            'customAlarmEditorControlsOnlyItsOwnPersistedVolume',
            'settingsHideCapabilityRowsAndGlobalAlarmVolume',
            'prayerDialogExposesIndependentVolumeAndDedicatedTwoTakbirChoice',
            'imlaiKeepsHafsPageJumpBookmarkFullscreenAndSwitchState',
          }
          seen={name for _,name in cases}
          assert required <= seen, (required-seen)
          PY
