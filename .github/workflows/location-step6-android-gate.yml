name: Location step 6 Android gate

on:
  push:
    branches:
      - location-step6-ci

permissions:
  contents: read
  actions: read

jobs:
  test-location-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: android sdk install platforms/android-37 --canary || true

      - name: Verify toolchain, permission and STEP 6 policy
        run: |
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'jvmTarget.set(JvmTarget.JVM_17)' app/build.gradle.kts
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -R -q 'com.google.android.gms.location' app/src/main gradle
          ! grep -R -q '@Ignore' app/src/androidTest/java/com/archimedeprojects/arihna/feature/settings app/src/test/java/com/archimedeprojects/arihna/feature/settings
          grep -q 'Usa posizione attuale' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          grep -q 'Perché Arihna chiede la posizione' app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt

      - name: Restore exact STEP 4 city asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/step4-asset app/src/main/assets/geonames
          mkdir -p /tmp/step4-asset app/src/main/assets/geonames
          gh run download 33296099459 \
            --repo "$GITHUB_REPOSITORY" \
            --name geonames-step4-runtime-minimal \
            --dir /tmp/step4-asset
          DB="$(find /tmp/step4-asset -type f -name cities.db -print -quit)"
          test -n "$DB"
          cp "$DB" app/src/main/assets/geonames/cities.db
          echo '7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb  app/src/main/assets/geonames/cities.db' | sha256sum -c -

      - name: Run unit regression and STEP 6 presentation tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run STEP 6 and existing regression on Android 9 / API 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
