name: Prayer STEP 4 closure docs helper

on:
  push:
    branches:
      - prayer-integration-step4-close-helper

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch STEP 4 closure
        run: python3 tools/prayer_step4_close_docs_temp.py
      - name: Validate diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          grep -q 'MILESTONE OPEN / STEP 4 CLOSED' PROJECT_SPEC.md
          grep -q '5019906d0ef83a33d09f5a3295d736422c8af7a4' PROJECT_SPEC.md
          grep -q '33360819887' PROJECT_SPEC.md
          grep -q '99391679780' PROJECT_SPEC.md
          grep -q 'STEP 5 remains \*\*NOT STARTED\*\* and requires separate authorization' PROJECT_SPEC.md
          ! grep -q 'MILESTONE OPEN / STEP 4 IN PROGRESS' PROJECT_SPEC.md
          ! grep -q 'STEP 3 schedule orchestration remains \*\*NOT STARTED\*\*' PROJECT_SPEC.md
      - name: Commit validated spec only
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_SPEC.md
          git commit -m 'docs(integration): close Prayer schedule STEP 4 temp'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "PROJECT_SPEC.md"
          git push origin HEAD:prayer-integration-step4-close-helper
