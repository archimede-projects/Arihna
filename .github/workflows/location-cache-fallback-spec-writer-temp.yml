name: Location cache fallback spec writer temp

on:
  push:
    branches:
      - location-cache-fallback-spec-writer-temp
    paths:
      - .github/workflows/location-cache-fallback-spec-writer-temp.yml

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean spec-first decision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "df5bcaa8c394cc332547453f30fbe4fdeaee8900"
          cp .github/scripts/location-cache-fallback-spec-patch.py /tmp/location-cache-fallback-spec-patch.py
          git checkout --detach df5bcaa8c394cc332547453f30fbe4fdeaee8900
          python3 /tmp/location-cache-fallback-spec-patch.py
          git diff --check -- PROJECT_SPEC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(location): approve transparent cache fallback'
          git branch -f fix-location-cache-fallback HEAD
          git push origin fix-location-cache-fallback --force
