name: Makkah two-takbir frozen audio asset

on:
  push:
    branches:
      - driver/makkah-takbir-x2-audio-asset-20260925
    paths:
      - .github/workflows/makkah-takbir-x2-audio-asset.yml

permissions:
  actions: read
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SIZE: '9359941'
      SOURCE_SHA256: f4acc1bcc6e7919fce60b21162a3c794952c562a6df7b6aa7971f80d191eb5f0
      PROBE_RUN: '36176580621'
      PROBE_ARTIFACT_ID: '10882303514'
      DERIVED_NAME: takbir-makkah-x2.opus
      DERIVED_SIZE: '132738'
      DERIVED_SHA256: 18740acd61b8b5946a14fc7551dee851642c710d37501892195593477e065f89
      RELEASE_TAG: audio-makkah-takbir-x2-20260925
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32d1d1a5e61c5329d8bf3fe91367d6f820e9b981
          fetch-depth: 0

      - name: Verify exact probe run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROBE_RUN")"
          test "$(jq -r '.status' <<<"$RUN")" = completed
          test "$(jq -r '.conclusion' <<<"$RUN")" = success
          ART="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROBE_ARTIFACT_ID")"
          test "$(jq -r '.expired' <<<"$ART")" = false
          test "$(jq -r '.workflow_run.id' <<<"$ART")" = "$PROBE_RUN"

      - name: Download exact verified probe artifact
        uses: actions/download-artifact@v4
        with:
          name: makkah-adhan-source-probe
          path: /tmp/probe
          github-token: ${{ github.token }}
          run-id: 36176580621

      - name: Verify frozen derived bytes
        shell: bash
        run: |
          set -euo pipefail
          cp "/tmp/probe/$DERIVED_NAME" "$DERIVED_NAME"
          test "$(stat -c '%s' "$DERIVED_NAME")" = "$DERIVED_SIZE"
          test "$(sha256sum "$DERIVED_NAME" | awk '{print $1}')" = "$DERIVED_SHA256"

      - name: Publish frozen audio asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release create "$RELEASE_TAG" "$DERIVED_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target 32d1d1a5e61c5329d8bf3fe91367d6f820e9b981 \
            --prerelease \
            --title 'Arihna audio source — Makkah Takbīr ×2' \
            --notes "Frozen derived audio source for Arihna. Source: Wikimedia Commons, Adhan at the Great Mosque of Mecca (21 Jan 2013), attribution Seyfula Islam, CC BY 3.0. Modification: extracted the first takbīr pair from 00:07.35 through 00:15.55, without time compression, in verified probe run $PROBE_RUN. Original source bytes $SOURCE_SIZE, source SHA-256 $SOURCE_SHA256. Derived bytes $DERIVED_SIZE, derived SHA-256 $DERIVED_SHA256. License: https://creativecommons.org/licenses/by/3.0/ . Source page: https://commons.wikimedia.org/wiki/File:Adhan,_Great_Mosque_of_Mecca_-_Jan_21,_2013.webm"

      - name: Redownload and verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$JSON")" = false
          test "$(jq -r '.prerelease' <<<"$JSON")" = true
          test "$(jq -r '.assets | length' <<<"$JSON")" = 1
          test "$(jq -r '.assets[0].name' <<<"$JSON")" = "$DERIVED_NAME"
          test "$(jq -r '.assets[0].size' <<<"$JSON")" = "$DERIVED_SIZE"
          test "$(jq -r '.assets[0].digest' <<<"$JSON")" = "sha256:$DERIVED_SHA256"
          rm -rf /tmp/recheck && mkdir -p /tmp/recheck
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$DERIVED_NAME" --dir /tmp/recheck
          test "$(stat -c '%s' "/tmp/recheck/$DERIVED_NAME")" = "$DERIVED_SIZE"
          test "$(sha256sum "/tmp/recheck/$DERIVED_NAME" | awk '{print $1}')" = "$DERIVED_SHA256"
