name: Alarms S25 crash remediation prerelease

on:
  push:
    branches:
      - alarms-s25-crash-remediation-release-temp
    paths:
      - .github/workflows/alarms-s25-crash-remediation-release-temp.yml

permissions:
  actions: read
  contents: write

jobs:
  build-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUNTIME_SHA: 925a3c45193d059122c2b65c09c33e9a22fb6b48
      SPEC_SHA: 29d8b765bbe4f063db09aac1016b5a09be992509
      BASE_RUNTIME_SHA: 9de81ce72ed0c6ee2f22cad26ea8dc05394de9dc
      VERIFIED_GATE_RUN: '33978303544'
      VERIFIED_API28_JOB: '101338811260'
      VERIFIED_API36_JOB: '101338811132'
      SIGNING_SOURCE_SHA: ce23a7f78695be95c7f8dfd2bcedbe22544da94c
      DEBUG_CERT_SHA256: 13:97:00:8C:1F:96:2D:BB:D3:6D:D8:A8:EA:02:16:AF:DD:06:E4:B2:B3:E0:8B:C0:F6:D4:B5:43:44:D7:B0:FA
      DEBUG_KEYSTORE_SHA256: bc9057f26ad6de7efb70a5df06effb1ed259f1d015c3f062d0f757b3f0983b72
      GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
      ADHAN_SHA256: 3b350bc210d657727578ed977e32323c06b63c2088c3ebcea9fc9afb7d487702
      RELEASE_TAG: alarms-s25-crash-remediation-925a3c45-20260905
      APK_NAME: arihna-alarms-s25-crash-remediation.apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 925a3c45193d059122c2b65c09c33e9a22fb6b48
          fetch-depth: 0

      - name: Verify exact runtime lineage main and definitive gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$BASE_RUNTIME_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$RUNTIME_SHA"
          test "$(git diff --name-only "$BASE_RUNTIME_SHA" "$SPEC_SHA")" = "PROJECT_SPEC.md"
          SPEC_TEXT="$(git show "$SPEC_SHA:PROJECT_SPEC.md")"
          grep -Fq 'Galaxy S25 immediate alarm crash remediation — APPROVED 2026-09-05' <<<"$SPEC_TEXT"
          grep -Fq 'Remove custom `RemoteViews`' <<<"$SPEC_TEXT"
          grep -Fq 'Restore conditional full-screen intent attachment' <<<"$SPEC_TEXT"
          for JOB in "$VERIFIED_API28_JOB" "$VERIFIED_API36_JOB"; do
            ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB" --jq '[(.id|tostring),(.run_id|tostring),.conclusion] | join(" ")')"
            test "$ACTUAL" = "$JOB $VERIFIED_GATE_RUN success"
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: android-actions/setup-android@v3

      - name: Restore and verify frozen GeoNames asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh run download 33296099459 --repo "$GITHUB_REPOSITORY" --name geonames-step4-runtime-minimal --dir /tmp/geonames
          DB="$(find /tmp/geonames -type f -name cities.db -print -quit)"
          test -n "$DB"
          cp "$DB" app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Verify corrected ringing runtime contract and Adhan artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -q 'minSdk = 28' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          ! grep -Fq 'RemoteViews' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          ! grep -Fq 'setCustomHeadsUpContentView' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          ! grep -Fq 'setCustomBigContentView' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          ! grep -Fq 'DecoratedCustomViewStyle' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq '.setStyle(NotificationCompat.BigTextStyle().bigText(subtitle))' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'if (fullScreenAccess.isGranted())' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'builder.setFullScreenIntent(activityPendingIntent, true)' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq '.addAction(0, "Interrompi"' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq '.addAction(0, "Rinvia"' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'Text("Interrompi"' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingActivity.kt
          grep -Fq 'Text("Rinvia 5 min"' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingActivity.kt
          grep -Fq 'const val TEST_DELAY_MILLIS = 20_000L' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt
          ! test -e app/src/main/res/layout/notification_alarm_heads_up.xml
          test -f app/src/main/res/raw/adhan_cc0.ogg
          test "$(stat -c '%s' app/src/main/res/raw/adhan_cc0.ogg)" = "820174"
          test "$(sha256sum app/src/main/res/raw/adhan_cc0.ogg | awk '{print $1}')" = "$ADHAN_SHA256"

      - name: Restore persistent Arihna debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin location-step5-device-test
          mkdir -p "$HOME/.android"
          git show "$SIGNING_SOURCE_SHA:.github/test-signing/arihna-debug.keystore.b64" | base64 --decode > "$HOME/.android/debug.keystore"
          ACTUAL_KEYSTORE_SHA="$(sha256sum "$HOME/.android/debug.keystore" | awk '{print $1}')"
          test "$ACTUAL_KEYSTORE_SHA" = "$DEBUG_KEYSTORE_SHA256"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee /tmp/keytool.txt
          grep -F "$DEBUG_CERT_SHA256" /tmp/keytool.txt
          echo "REMEDIATION_KEYSTORE_SHA256=$ACTUAL_KEYSTORE_SHA"
          echo "REMEDIATION_CERT_SHA256=$DEBUG_CERT_SHA256"

      - name: Apply transient persistent debug signing configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          marker = '    buildFeatures {\n'
          block = '''    signingConfigs {\n        getByName("debug") {\n            storeFile = file("${System.getProperty("user.home")}/.android/debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n\n'''
          if marker not in text:
              raise SystemExit('buildFeatures marker not found')
          path.write_text(text.replace(marker, block + marker, 1))
          PY
          git diff --check -- app/build.gradle.kts
          test "$(git diff --name-only)" = "app/build.gradle.kts"
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Build exact corrected runtime for Galaxy S25 validation
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK package signer permissions and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fi '1397008c1f962dbbd36dd8a8ea0216afdd06e4b2b3e08bc0f6d4b54344d7b0fa' /tmp/apksigner.txt
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.archimedeprojects.arihna'" /tmp/badging.txt
          grep -F "sdkVersion:'28'" /tmp/badging.txt
          grep -F "targetSdkVersion:'37'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_FULL_SCREEN_INTENT FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK; do grep -Fq "android.permission.$P" /tmp/permissions.txt; done
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' /tmp/permissions.txt
          ! grep -Fq 'android.permission.ACCESS_FINE_LOCATION' /tmp/permissions.txt
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/permissions.txt
          ! grep -Fq 'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' /tmp/permissions.txt
          cp "$APK" "$APK_NAME"
          APK_SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$APK_NAME")"
          echo "$APK_SHA" > /tmp/apk-sha256.txt
          echo "$APK_SIZE" > /tmp/apk-size.txt
          echo "REMEDIATION_APK_SHA256=$APK_SHA"
          echo "REMEDIATION_APK_SIZE=$APK_SIZE"
          echo "REMEDIATION_APPLICATION_ID=com.archimedeprojects.arihna"

      - name: Publish Galaxy S25 crash remediation prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA="$(cat /tmp/apk-sha256.txt)"
          APK_SIZE="$(cat /tmp/apk-size.txt)"
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RUNTIME_SHA" \
            --title 'S25 validation — Alarms crash remediation — 925a3c45' \
            --prerelease \
            --notes "GALAXY S25 RETEST BUILD after the physical crash seen on runtime $BASE_RUNTIME_SHA. Exact corrected runtime $RUNTIME_SHA; direct parent corrective spec $SPEC_SHA. Definitive gate run $VERIFIED_GATE_RUN passed: API28 job $VERIFIED_API28_JOB completed 66 connected tests with 0 failures, 0 errors and 0 skips; API36 job $VERIFIED_API36_JOB passed denied/granted exact-alarm, notifications and full-screen-access matrix with the platform-native alarm notification path. The custom RemoteViews heads-up content was removed and full-screen intent is again attached only when Android reports the special access granted. Test sveglia remains 20 seconds; ringing service, Interrompi, Rinvia 5 min and Adhan audio remain. Package com.archimedeprojects.arihna. Persistent Arihna debug certificate SHA-256 $DEBUG_CERT_SHA256; keystore SHA-256 $DEBUG_KEYSTORE_SHA256. APK bytes $APK_SIZE. APK SHA-256 $APK_SHA. Galaxy S25 physical validation is still required."

      - name: Verify published tag prerelease and uploaded APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RUNTIME_SHA"
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = "false"
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = "true"
          test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<<"$RELEASE_JSON")" = "$RUNTIME_SHA"
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" = "1"
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$APK_NAME"
          test "$(jq -r '.assets[0].state' <<<"$RELEASE_JSON")" = "uploaded"
          test "$(jq -r '.assets[0].size' <<<"$RELEASE_JSON")" = "$(cat /tmp/apk-size.txt)"
          test "$(jq -r '.assets[0].digest' <<<"$RELEASE_JSON")" = "sha256:$(cat /tmp/apk-sha256.txt)"
          echo "REMEDIATION_RELEASE_ID=$(jq -r '.id' <<<"$RELEASE_JSON")"
          echo "REMEDIATION_RELEASE_TAG=$(jq -r '.tag_name' <<<"$RELEASE_JSON")"
          echo "REMEDIATION_RELEASE_URL=$(jq -r '.html_url' <<<"$RELEASE_JSON")"
          echo "REMEDIATION_ASSET_ID=$(jq -r '.assets[0].id' <<<"$RELEASE_JSON")"
          echo "REMEDIATION_ASSET_STATE=$(jq -r '.assets[0].state' <<<"$RELEASE_JSON")"
          echo "REMEDIATION_ASSET_SIZE=$(jq -r '.assets[0].size' <<<"$RELEASE_JSON")"
          echo "REMEDIATION_ASSET_DIGEST=$(jq -r '.assets[0].digest' <<<"$RELEASE_JSON")"
          echo "REMEDIATION_ASSET_URL=$(jq -r '.assets[0].browser_download_url' <<<"$RELEASE_JSON")"
