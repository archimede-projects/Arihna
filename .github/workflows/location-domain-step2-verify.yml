name: Location domain step 2 verification

on:
  push:
    branches:
      - location-domain-step2

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - name: Install Android API 37
        run: android sdk install platforms/android-37 --canary || true

      - name: Verify app target remains Java/Kotlin 17
        run: |
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'jvmTarget.set(JvmTarget.JVM_17)' app/build.gradle.kts

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
