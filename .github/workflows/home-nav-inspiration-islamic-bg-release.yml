name: Home nav inspiration Islamic background S25 prerelease

on:
  push:
    branches:
      - home-nav-inspiration-islamic-bg-release-driver
    paths:
      - .github/workflows/home-nav-inspiration-islamic-bg-release.yml

permissions:
  actions: read
  contents: write

jobs:
  build-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUNTIME_SHA: b5a3ae228bbecc2a9b0d325a55f45a1805a9ddf9
      SPEC_SHA: fd8134a6e7539d3e69248b6470014d1ba6df6d8c
      VERIFIED_GATE_RUN: '34052841763'
      VERIFIED_STATIC_JOB: '101539411533'
      VERIFIED_API28_JOB: '101539411497'
      VERIFIED_API36_JOB: '101539411414'
      SIGNING_SOURCE_SHA: ce23a7f78695be95c7f8dfd2bcedbe22544da94c
      DEBUG_CERT_SHA256: 13:97:00:8C:1F:96:2D:BB:D3:6D:D8:A8:EA:02:16:AF:DD:06:E4:B2:B3:E0:8B:C0:F6:D4:B5:43:44:D7:B0:FA
      DEBUG_CERT_SHA256_COMPACT: 1397008c1f962dbbd36dd8a8ea0216afdd06e4b2b3e08bc0f6d4b54344d7b0fa
      DEBUG_KEYSTORE_SHA256: bc9057f26ad6de7efb70a5df06effb1ed259f1d015c3f062d0f757b3f0983b72
      GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
      ADHAN_SHA256: 3b350bc210d657727578ed977e32323c06b63c2088c3ebcea9fc9afb7d487702
      FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
      FROZEN_ASSET_APK: arihna-settings-s25-premium.apk
      PACKAGE_NAME: com.archimedeprojects.arihna
      RELEASE_TAG: home-s25-nav-inspiration-islamic-bg-b5a3ae22-20260906
      APK_NAME: arihna-home-nav-inspiration-islamic-bg.apk

    steps:
      - name: Checkout exact promoted runtime
        uses: actions/checkout@v4
        with:
          ref: b5a3ae228bbecc2a9b0d325a55f45a1805a9ddf9
          fetch-depth: 0

      - name: Verify exact promoted runtime and definitive gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$RUNTIME_SHA"
          for JOB in "$VERIFIED_STATIC_JOB" "$VERIFIED_API28_JOB" "$VERIFIED_API36_JOB"; do
            ACTUAL_JOB="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB" --jq '[(.id|tostring),(.run_id|tostring),.status,.conclusion] | join(" ")')"
            test "$ACTUAL_JOB" = "$JOB $VERIFIED_GATE_RUN completed success"
          done
          RUN_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_GATE_RUN" --jq '[.status,.conclusion] | join(" ")')"
          test "$RUN_STATE" = 'completed success'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore frozen GeoNames and verify Adhan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
          echo "$ADHAN_SHA256  app/src/main/res/raw/adhan_cc0.ogg" | sha256sum -c -

      - name: Verify frozen platform and corrected Home contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'minSdk = 28' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'implementation(libs.play.services.location)' app/build.gradle.kts
          grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          FUSED=app/src/main/java/com/archimedeprojects/arihna/core/location/platform/GoogleFusedDeviceLocationDataSource.kt
          grep -q 'FusedLocationProviderClient' "$FUSED"
          grep -q 'lastLocation' "$FUSED"
          grep -q 'Priority.PRIORITY_HIGH_ACCURACY' "$FUSED"
          grep -q 'requestLocationUpdates' "$FUSED"
          grep -q 'GoogleFusedDeviceLocationDataSource(appContext)' app/src/main/java/com/archimedeprojects/arihna/app/AppContainer.kt
          grep -q 'popBackStack(homeRoute, inclusive = false)' app/src/main/java/com/archimedeprojects/arihna/app/TopLevelNavigation.kt
          grep -q 'Intent.ACTION_SEND' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          grep -q 'text/plain' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          grep -q '.islamicBackdrop()' app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          grep -q 'const val TEST_DELAY_MILLIS = 10_000L' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt

      - name: Restore persistent Arihna debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin location-step5-device-test
          mkdir -p "$HOME/.android"
          git show "$SIGNING_SOURCE_SHA:.github/test-signing/arihna-debug.keystore.b64" | base64 --decode > "$HOME/.android/debug.keystore"
          ACTUAL_KEYSTORE_SHA="$(sha256sum "$HOME/.android/debug.keystore" | awk '{print $1}')"
          test "$ACTUAL_KEYSTORE_SHA" = "$DEBUG_KEYSTORE_SHA256"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee /tmp/keytool.txt
          grep -F "$DEBUG_CERT_SHA256" /tmp/keytool.txt

      - name: Apply transient persistent debug signing configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          marker = '    buildFeatures {\n'
          block = '''    signingConfigs {\n        getByName("debug") {\n            storeFile = file("${System.getProperty("user.home")}/.android/debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n\n'''
          if marker not in text:
              raise SystemExit('buildFeatures marker not found')
          path.write_text(text.replace(marker, block + marker, 1))
          PY
          git diff --check -- app/build.gradle.kts
          test "$(git diff --name-only)" = "app/build.gradle.kts"
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Build exact promoted runtime with persistent signer
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK package SDK signer permissions assets and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          tr '[:upper:]' '[:lower:]' < /tmp/apksigner.txt | tr -d ':' | grep -F "$DEBUG_CERT_SHA256_COMPACT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='$PACKAGE_NAME'" /tmp/badging.txt
          grep -F "sdkVersion:'28'" /tmp/badging.txt
          grep -F "targetSdkVersion:'37'" /tmp/badging.txt
          grep -F "compileSdkVersion='37'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED USE_FULL_SCREEN_INTENT SYSTEM_ALERT_WINDOW FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK; do
            grep -Fq "android.permission.$P" /tmp/permissions.txt
          done
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/permissions.txt
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' /tmp/permissions.txt
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | awk '{print $1}')" = "$GEONAMES_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_cc0.ogg | sha256sum | awk '{print $1}')" = "$ADHAN_SHA256"
          cp "$APK" "$APK_NAME"
          APK_SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$APK_NAME")"
          echo "$APK_SHA" > /tmp/apk-sha256.txt
          echo "$APK_SIZE" > /tmp/apk-size.txt
          echo "FINAL_APK_SHA256=$APK_SHA"
          echo "FINAL_APK_SIZE=$APK_SIZE"

      - name: Publish Galaxy S25 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA="$(cat /tmp/apk-sha256.txt)"
          APK_SIZE="$(cat /tmp/apk-size.txt)"
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RUNTIME_SHA" \
            --title 'S25 validation — Home navigation + inspiration + Islamic backdrop — b5a3ae22' \
            --prerelease \
            --notes "GALAXY S25 VALIDATION BUILD. PROJECT_SPEC.md was updated first in spec commit $SPEC_SHA, then exact technical candidate $RUNTIME_SHA was created as its direct child. Definitive exact-SHA gate run $VERIFIED_GATE_RUN passed: host tests/build green; API28 full instrumentation executed 76 tests with 0 failures, 0 errors and 0 skips; API36 location-permission matrix passed. Home top-level navigation is corrected so Qibla, Sveglie and Posizione/Impostazioni can return to Home from the bottom bar without Android Back. Ispirazione del giorno uses a curated positive Quran/hadith set with explicit references, opens a detail dialog and shares through Android ACTION_SEND text/plain. Home now has a low-contrast Islamic geometric/architectural backdrop without sacred decorative text. Package $PACKAGE_NAME; minSdk 28; compileSdk 37; targetSdk 37. Persistent Arihna debug certificate SHA-256 $DEBUG_CERT_SHA256; keystore SHA-256 $DEBUG_KEYSTORE_SHA256. GeoNames and Adhan frozen hashes verified. ACCESS_FINE_LOCATION + ACCESS_COARSE_LOCATION present; ACCESS_BACKGROUND_LOCATION and USE_EXACT_ALARM absent. APK bytes $APK_SIZE. APK SHA-256 $APK_SHA. New physical Galaxy S25 validation remains required."

      - name: Verify published prerelease and uploaded APK bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/apk-sha256.txt)"
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RUNTIME_SHA"
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = "false"
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = "true"
          test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<<"$RELEASE_JSON")" = "$RUNTIME_SHA"
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" = "1"
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$APK_NAME"
          test "$(jq -r '.assets[0].state' <<<"$RELEASE_JSON")" = "uploaded"
          rm -rf /tmp/releasecheck
          mkdir -p /tmp/releasecheck
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME" --dir /tmp/releasecheck
          DOWNLOADED_SHA="$(sha256sum "/tmp/releasecheck/$APK_NAME" | awk '{print $1}')"
          test "$DOWNLOADED_SHA" = "$EXPECTED_SHA"
          DIRECT_URL="$(jq -r '.assets[0].browser_download_url' <<<"$RELEASE_JSON")"
          test -n "$DIRECT_URL"
          echo "VERIFIED_RELEASE_TAG=$RELEASE_TAG"
          echo "VERIFIED_APK_SHA256=$DOWNLOADED_SHA"
          echo "DIRECT_APK_URL=$DIRECT_URL"
