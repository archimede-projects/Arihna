name: Daily inspiration takbir prayer volume v2 preflight

on:
  push:
    branches:
      - driver/daily-inspiration-takbir-prayer-volume-v2-preflight-20260925
    paths:
      - .github/workflows/daily-inspiration-takbir-prayer-volume-v2-preflight.yml

permissions:
  contents: read

jobs:
  compile-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40382a922c585d2765a1e7f91b803ed1e16d4685
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download settings-s25-premium-3f28b6f0-20260906 --repo "$GITHUB_REPOSITORY" --pattern arihna-settings-s25-premium.apk --dir /tmp/geonames
          unzip -p /tmp/geonames/arihna-settings-s25-premium.apk assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Compile test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace
      - name: Verify two-takbir source bytes in generated resources
        shell: bash
        run: |
          set -euo pipefail
          F="$(find app/build/generated/takbirRes -type f -name takbir_allahuakbar_cc0.opus | head -1)"
          test -n "$F"
          test "$(stat -c '%s' "$F")" = 21136
          test "$(sha256sum "$F" | awk '{print $1}')" = ccb7a98ba419b9e1163e57a41423016766fae9c07a004862423c757bab5985c3
