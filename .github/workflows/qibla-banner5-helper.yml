name: Qibla banner 5 helper
on:
  push:
    branches: [qibla-banner5-auto-temp]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage implementation from approved spec
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin qibla-banner5-spec
          SPEC_SHA=$(git rev-parse origin/qibla-banner5-spec)
          git checkout -B qibla-banner5-impl "$SPEC_SHA"
          echo '' | base64 --decode > /tmp/edit.py
          python3 /tmp/edit.py
          git diff --check
          git add app/src/main/java/com/archimedeprojects/arihna/feature/qibla/QiblaPlaceholderScreen.kt app/src/androidTest/java/com/archimedeprojects/arihna/feature/qibla/QiblaScreenAndroidTest.kt
          git commit -m 'feat(qibla): add approved sacred gold live banner'
          git push origin HEAD:refs/heads/qibla-banner5-impl --force
