name: Quran Tajwid runtime candidate builder

on:
  push:
    branches:
      - quran-tajwid-runtime-builder

permissions:
  contents: write

concurrency:
  group: quran-tajwid-runtime-builder
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3

      - name: Create and preflight single-commit candidate
        shell: bash
        run: |
          set -euo pipefail
          SPEC='30f8ad09b4303715b2d89716dd8cb9be756e3ad8'
          CANDIDATE_BRANCH='quran-tajwid-runtime-candidate-1'
          cp -R .github/builders/quran-tajwid-runtime /tmp/quran-tajwid-runtime
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SPEC"
          git checkout --detach "$SPEC"

          python3 /tmp/quran-tajwid-runtime/patch.py
          python3 /tmp/quran-tajwid-runtime/patch_after.py
          mkdir -p app/src/main/java/com/archimedeprojects/arihna/feature/quran
          mkdir -p app/src/test/java/com/archimedeprojects/arihna/feature/quran
          mkdir -p docs/third-party
          cp /tmp/quran-tajwid-runtime/UthmaniTajwidEngine.kt app/src/main/java/com/archimedeprojects/arihna/feature/quran/UthmaniTajwidEngine.kt
          cp /tmp/quran-tajwid-runtime/UthmaniTajwidEngineTest.kt app/src/test/java/com/archimedeprojects/arihna/feature/quran/UthmaniTajwidEngineTest.kt
          cp /tmp/quran-tajwid-runtime/tajweed-api-mit.md docs/third-party/tajweed-api-mit.md

          java -version
          test "$(java -version 2>&1 | head -n1 | sed -E 's/.*version "([0-9]+).*/\1/')" = '21'
          git diff --check
          ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace

          CORPUS='app/build/generated/quranAssets/quran/quran-uthmani.txt'
          test -s "$CORPUS"
          python3 - <<'PY'
          from pathlib import Path
          import unicodedata

          path = Path('app/build/generated/quranAssets/quran/quran-uthmani.txt')
          verses = {}
          for raw in path.read_text(encoding='utf-8').splitlines():
              parts = raw.split('|', 2)
              if len(parts) == 3 and parts[0].isdigit() and parts[1].isdigit():
                  verses[(int(parts[0]), int(parts[1]))] = parts[2]
          assert len(verses) == 6236, len(verses)
          assert len({s for s, _ in verses}) == 114

          def letters(text: str) -> str:
              normalized = unicodedata.normalize('NFD', text)
              return ''.join(ch for ch in normalized if unicodedata.category(ch)[0] != 'M')

          checks = {
              (113, 2): ('من شر',),
              (2, 26): ('ان يضرب', 'مثلا ما', 'من ربهم'),
              (2, 27): ('من بعد',),
          }
          for key, phrases in checks.items():
              assert key in verses, key
              value = letters(verses[key])
              compact = ' '.join(value.split())
              print(f'UTHMANI_FIXTURE {key[0]}:{key[1]} {compact}')
              for phrase in phrases:
                  assert phrase in compact, (key, phrase, compact)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt \
                  app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt \
                  app/src/main/java/com/archimedeprojects/arihna/feature/quran/UthmaniTajwidEngine.kt \
                  app/src/test/java/com/archimedeprojects/arihna/feature/quran/UthmaniTajwidEngineTest.kt \
                  app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt \
                  docs/third-party/tajweed-api-mit.md
          git commit -m 'feat(quran): add offline Uthmani Tajwid beta coloring'
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SPEC"
          test "$(git rev-list --count "$SPEC..HEAD")" -eq 1
          test "$(git diff --name-only "$SPEC..HEAD" | wc -l)" -eq 6
          git diff-tree --no-commit-id --name-only -r HEAD | sort
          git push origin HEAD:"$CANDIDATE_BRANCH"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
