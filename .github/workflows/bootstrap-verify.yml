name: Persist verified wrapper

on:
  push:
    branches:
      - bootstrap-verify

permissions:
  contents: write

jobs:
  persist-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Generate Gradle wrapper 9.5.0
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-gen"
          printf 'rootProject.name = "wrapper-gen"\n' > "$RUNNER_TEMP/wrapper-gen/settings.gradle"
          cd "$RUNNER_TEMP/wrapper-gen"
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin
          cp gradlew "$GITHUB_WORKSPACE/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/gradlew.bat"
          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"
          cp gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.properties"
          chmod +x "$GITHUB_WORKSPACE/gradlew"
      - name: Persist wrapper on verification branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "test: persist verified Gradle wrapper [skip ci]"
          git push origin HEAD:bootstrap-verify
