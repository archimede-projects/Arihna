name: Bootstrap verify

on:
  push:
    branches:
      - bootstrap-verify

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - name: Install Android API 37
        run: android sdk install platforms/android-37 --canary
      - name: Generate Gradle wrapper 9.5.0
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-gen"
          printf 'rootProject.name = "wrapper-gen"\n' > "$RUNNER_TEMP/wrapper-gen/settings.gradle"
          cd "$RUNNER_TEMP/wrapper-gen"
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin
          cp gradlew "$GITHUB_WORKSPACE/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/gradlew.bat"
          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"
          cp gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.properties"
          chmod +x "$GITHUB_WORKSPACE/gradlew"
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload generated wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-9.5.0
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          retention-days: 1
