name: Bootstrap verify

on:
  push:
    branches:
      - bootstrap-verify

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37"
      - name: Generate Gradle wrapper 9.5.0
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload generated wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-9.5.0
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          retention-days: 1
