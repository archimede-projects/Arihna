name: Daily inspiration variety spec

on:
  push:
    branches:
      - driver/daily-inspiration-spec-20260916

permissions:
  contents: write

jobs:
  commit-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append approved spec and fast-forward main
        shell: bash
        env:
          SPEC_PAYLOAD_B64: 
        run: |
          set -euo pipefail
          BASE='30550305c7e6ec77abf35e9e6e53162ec8369e8a'
          test "$(git rev-parse HEAD)" = "$BASE"
          printf '%s' "$SPEC_PAYLOAD_B64" | base64 -d >> PROJECT_SPEC.md
          git diff --check
          test "$(git diff --name-only)" = 'PROJECT_SPEC.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'spec(home): expand daily inspiration variety'
          test "$(git rev-parse HEAD^)" = "$BASE"
          git push origin HEAD:main
          echo "SPEC_SHA=$(git rev-parse HEAD)"
