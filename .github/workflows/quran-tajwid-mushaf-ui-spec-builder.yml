name: Quran Tajwid Mushaf UI spec builder

on:
  push:
    branches:
      - driver/quran-tajwid-mushaf-ui-spec-20260910

permissions:
  contents: write

concurrency:
  group: quran-tajwid-mushaf-ui-spec-builder
  cancel-in-progress: true

jobs:
  build-spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create specification commit from exact released runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='b90473abc2e56111b87901710ae973f0419e345d'
          SPEC_BRANCH='spec/quran-tajwid-mushaf-ui-20260910'
          cp .github/builders/quran-tajwid-mushaf-ui-spec/spec_append.md /tmp/tajwid-ui-spec-append.md
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          ! grep -Fq 'Corano: Muṣḥaf Tajwid page-first UX remediation' PROJECT_SPEC.md
          cat /tmp/tajwid-ui-spec-append.md >> PROJECT_SPEC.md
          test "$(git diff --name-only | tr -d '\n')" = 'PROJECT_SPEC.md'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'spec(quran): approve page-first Tajwid Mushaf remediation'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..HEAD")" -eq 1
          git push origin HEAD:"refs/heads/$SPEC_BRANCH"
          echo "SPEC_SHA=$(git rev-parse HEAD)"
