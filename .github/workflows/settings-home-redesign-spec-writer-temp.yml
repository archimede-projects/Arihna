name: Settings Home redesign spec writer temp

on:
  push:
    branches:
      - settings-home-redesign-spec-writer-temp

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pre-spec main
        uses: actions/checkout@v4
        with:
          ref: 1ebac29f89dfc46d7a5f31285eafd4d90b15658c
          fetch-depth: 0
      - name: Verify exact starting main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1ebac29f89dfc46d7a5f31285eafd4d90b15658c"
          test "$(git rev-parse origin/main)" = "1ebac29f89dfc46d7a5f31285eafd4d90b15658c"
      - name: Append approved Settings and Home redesign spec
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d >> PROJECT_SPEC.md
          git diff -- PROJECT_SPEC.md
      - name: Commit spec first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IbnKhaldoun-svg"
          git config user.email "essalih.idriss.w@gmail.com"
          git add PROJECT_SPEC.md
          git commit -m "docs(ui): authorize Settings and Home redesign"
          git push origin HEAD:refs/heads/settings-home-redesign-spec
