          fetch-depth: 0

      - name: Verify SPEC lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SPEC_SHA"
          test "$(git rev-parse HEAD^)" = "d66d87615584bdb43721db751a54339ded9607f8"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2

