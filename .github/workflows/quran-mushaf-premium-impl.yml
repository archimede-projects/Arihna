name: Quran Mushaf premium implementation

on:
  push:
    branches:
      - driver/quran-mushaf-premium-impl-20260908

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve patcher and checkout exact SPEC
        shell: bash
        run: |
          set -euo pipefail
          cp tools/ci/patch_quran_mushaf_premium.py /tmp/patch_quran_mushaf_premium.py
          git checkout --detach 906de6bf1f53e643012f9a4d4ce120f93c0c66ec
          test "$(git rev-parse HEAD)" = "906de6bf1f53e643012f9a4d4ce120f93c0c66ec"
          test "$(git rev-parse HEAD^)" = "d66d87615584bdb43721db751a54339ded9607f8"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: android-actions/setup-android@v3

      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download settings-s25-premium-3f28b6f0-20260906 --repo "$GITHUB_REPOSITORY" --pattern arihna-settings-s25-premium.apk --dir /tmp/geonames
          unzip -p /tmp/geonames/arihna-settings-s25-premium.apk assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo '7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb  app/src/main/assets/geonames/cities.db' | sha256sum -c -

      - name: Apply premium implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/patch_quran_mushaf_premium.py')
          s = p.read_text()
          start = s.index('old_tail = dedent(', s.index('repo = Path('))
          end_marker = 'repo.write_text(r.replace(old_tail, new_tail, 1))'
          end = s.index(end_marker, start) + len(end_marker)
          replacement = '''insert_at = r.rfind("\\n}")
          if insert_at < 0:
              raise SystemExit("QuranReadingPrefs final object close missing")
          visual_methods = """

              fun visualStyle(context: Context): MushafVisualStyle = runCatching {
                  MushafVisualStyle.valueOf(
                      prefs(context).getString(KEY_VISUAL_STYLE, MushafVisualStyle.CLASSIC.name).orEmpty(),
                  )
              }.getOrDefault(MushafVisualStyle.CLASSIC)

              fun setVisualStyle(context: Context, style: MushafVisualStyle) {
                  prefs(context).edit().putString(KEY_VISUAL_STYLE, style.name).apply()
              }
          """
          repo.write_text(r[:insert_at] + visual_methods + r[insert_at:])'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          python3 /tmp/patch_quran_mushaf_premium.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt')
          s = p.read_text()
          marker = "\\\n    @Composable\n    private fun MushafBookReader("
          if marker not in s:
              raise SystemExit('premium block leading raw-string slash marker missing')
          p.write_text(s.replace(marker, "    @Composable\n    private fun MushafBookReader(", 1))
          PY
          git diff --check
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/quran/NativeMushafPage.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt | sort)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Static premium contracts
        shell: bash
        run: |
          set -euo pipefail
          Q=app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          R=app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt
          N=app/src/main/java/com/archimedeprojects/arihna/feature/quran/NativeMushafPage.kt
          T=app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt
          grep -Fq 'enum class MushafVisualStyle { CLASSIC, CLEAN }' "$Q"
          grep -Fq '510.23599f / 729.448f' "$Q"
          ! grep -Fq 'scaleX = 1.22f' "$Q"
          grep -Fq 'quran-style-classic' "$Q"
          grep -Fq 'quran-style-clean' "$Q"
          grep -Fq 'quran-premium-page-frame' "$Q"
          grep -Fq 'quran-fullscreen-chrome' "$Q"
          grep -Fq 'quran-fullscreen-page-context' "$Q"
          grep -Fq 'quran-fullscreen-bottom-context' "$Q"
          grep -Fq 'coerceIn(1f, 5f)' "$Q"
          grep -Fq 'userScrollEnabled = !zoomed' "$Q"
          grep -Fq 'LocalLayoutDirection provides LayoutDirection.Rtl' "$Q"
          grep -Fq 'quran_visual_style_v1' "$R"
          grep -Fq 'LruCache<String, Picture>(12)' "$N"
          grep -Fq 'Dispatchers.IO' "$N"
          grep -Fq 'premiumStylePersistsAndFullscreenChromeToggles' "$T"
          grep -Fq 'assertCountEquals(0)' "$T"
          grep -Fq 'quranSourceCommit = "a5284b17034d36567e4a4bac982a17ba56837448"' app/build.gradle.kts
          grep -Fq 'quranSvgCommit = "78d97544bfdc57e9f04bc97ace3f857ed972d772"' app/build.gradle.kts

      - name: Compile tests and APK
        shell: bash
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace

      - name: Create direct-child candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Arihna CI'
          git config user.email 'ci@arihna.local'
          git add \
            app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/quran/NativeMushafPage.kt \
            app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt
          TREE="$(git write-tree)"
          CANDIDATE="$(printf '%s\n' 'feat: premium Quran Mushaf reading experience' | git commit-tree "$TREE" -p 906de6bf1f53e643012f9a4d4ce120f93c0c66ec)"
          test "$(git rev-parse "$CANDIDATE^")" = '906de6bf1f53e643012f9a4d4ce120f93c0c66ec'
          test "$(git rev-list --parents -n1 "$CANDIDATE" | wc -w)" -eq 2
          echo "CANDIDATE_SHA=$CANDIDATE"
          git push origin "$CANDIDATE:refs/heads/candidate/quran-mushaf-premium-v1"
