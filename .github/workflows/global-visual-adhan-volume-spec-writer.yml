name: Global visual Adhan volume spec writer

on:
  push:
    branches:
      - global-visual-adhan-volume-spec-driver-20260907

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 882e434ea036ef9033608131b428e46b16b64d1e
      SPEC_BRANCH: global-visual-adhan-volume-spec-20260907
      SPEC_B64: 
    steps:
      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      - name: Guard baseline and write spec
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git switch -C "$SPEC_BRANCH" "$BASE_SHA"
          printf '%s' "$SPEC_B64" | base64 --decode > /tmp/spec-section.md
          printf '\n\n' >> PROJECT_SPEC.md
          cat /tmp/spec-section.md >> PROJECT_SPEC.md
          git diff --check
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          git config user.name "IbnKhaldoun-svg"
          git config user.email "essalih.idriss.w@gmail.com"
          git add PROJECT_SPEC.md
          git commit -m "docs(spec): unify visual identity and expand Adhan catalogue"
          SPEC_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/$SPEC_BRANCH"
          echo "SPEC_SHA=$SPEC_SHA"
