name: Build Home nav inspiration Islamic background candidate

on:
  push:
    branches:
      - home-nav-inspiration-islamic-bg-impl-driver

permissions:
  contents: write

jobs:
  create-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved spec
        uses: actions/checkout@v4
        with:
          ref: fd8134a6e7539d3e69248b6470014d1ba6df6d8c
          fetch-depth: 0

      - name: Verify exact spec parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fd8134a6e7539d3e69248b6470014d1ba6df6d8c"

      - name: Implement top-level navigation correction
        shell: bash
        run: |
          cat > app/src/main/java/com/archimedeprojects/arihna/app/TopLevelNavigation.kt <<'EOF'
          package com.archimedeprojects.arihna.app

          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.NavHostController

          internal fun NavHostController.navigateTopLevel(
              route: String,
              homeRoute: String,
          ) {
              if (route == homeRoute) {
                  val poppedToHome = popBackStack(homeRoute, inclusive = false)
                  if (!poppedToHome && currentDestination?.route != homeRoute) {
                      navigate(homeRoute) {
                          popUpTo(graph.findStartDestination().id) { saveState = true }
                          launchSingleTop = true
                          restoreState = true
                      }
                  }
                  return
              }

              navigate(route) {
                  popUpTo(graph.findStartDestination().id) { saveState = true }
                  launchSingleTop = true
                  restoreState = true
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/archimedeprojects/arihna/app/ArihnaNavHost.kt")
          text = path.read_text()

          old = '''                        onClick = {
                            navController.navigate(destination.route) {
                                popUpTo(Destination.Home.route) { saveState = true }
                                launchSingleTop = true
                                restoreState = true
                            }
                        },'''
          new = '''                        onClick = {
                            navController.navigateTopLevel(
                                route = destination.route,
                                homeRoute = Destination.Home.route,
                            )
                        },'''
          if old not in text:
              raise SystemExit("Bottom navigation block not found")
          text = text.replace(old, new, 1)

          replacements = {
              'navController.navigate(Destination.Settings.route) { launchSingleTop = true }': 'navController.navigateTopLevel(Destination.Settings.route, Destination.Home.route)',
              'navController.navigate(Destination.Qibla.route) { launchSingleTop = true }': 'navController.navigateTopLevel(Destination.Qibla.route, Destination.Home.route)',
              'navController.navigate(Destination.Alarms.route) { launchSingleTop = true }': 'navController.navigateTopLevel(Destination.Alarms.route, Destination.Home.route)',
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f"Navigation callback not found: {old_value}")
              text = text.replace(old_value, new_value)

          path.write_text(text)
          PY

