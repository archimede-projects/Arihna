      - name: Validate candidate diff and frozen scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          expected=$(cat <<'EOF'
          app/src/androidTest/java/com/archimedeprojects/arihna/app/TopLevelNavigationAndroidTest.kt
          app/src/androidTest/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreenAndroidTest.kt
          app/src/main/java/com/archimedeprojects/arihna/app/ArihnaNavHost.kt
          app/src/main/java/com/archimedeprojects/arihna/app/TopLevelNavigation.kt
          app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          app/src/main/java/com/archimedeprojects/arihna/feature/home/IslamicBackdrop.kt
          app/src/test/java/com/archimedeprojects/arihna/feature/home/DailyInspirationTest.kt
          EOF
          )
          actual="$(git status --porcelain | sed 's/^...//' | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          grep -F 'navigateTopLevel' app/src/main/java/com/archimedeprojects/arihna/app/ArihnaNavHost.kt
          grep -F 'popBackStack(homeRoute, inclusive = false)' app/src/main/java/com/archimedeprojects/arihna/app/TopLevelNavigation.kt
          grep -F 'Intent.ACTION_SEND' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          grep -F 'Sahih al-Bukhari 6464' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          grep -F 'Sahih al-Bukhari 2989' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          grep -F '.islamicBackdrop()' app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          grep -F 'homeRemainsReachableAfterQiblaAlarmsAndSettingsQuickRoutes' app/src/androidTest/java/com/archimedeprojects/arihna/app/TopLevelNavigationAndroidTest.kt

