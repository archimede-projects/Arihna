name: Build Home correction candidate

on:
  push:
    branches:
      - home-nav-inspiration-islamic-bg-impl-driver

permissions:
  contents: write

jobs:
  create-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve construction script
        shell: bash
        run: cp .github/scripts/build_home_correction_candidate.py /tmp/build_home_correction_candidate.py

      - name: Checkout exact approved spec
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach fd8134a6e7539d3e69248b6470014d1ba6df6d8c
          test "$(git rev-parse HEAD)" = "fd8134a6e7539d3e69248b6470014d1ba6df6d8c"

      - name: Apply approved implementation
        shell: bash
        run: python3 /tmp/build_home_correction_candidate.py

      - name: Validate exact candidate scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only | grep -E 'AndroidManifest.xml|build.gradle.kts|libs.versions.toml' || true)"
          grep -F 'popBackStack(homeRoute, inclusive = false)' app/src/main/java/com/archimedeprojects/arihna/app/TopLevelNavigation.kt
          grep -F 'Intent.ACTION_SEND' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          grep -F 'Sahih al-Bukhari 6464' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          grep -F 'Sahih al-Bukhari 2989' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt
          grep -F '.islamicBackdrop()' app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          grep -F 'homeRemainsReachableAfterQiblaAlarmsAndSettingsQuickRoutes' app/src/androidTest/java/com/archimedeprojects/arihna/app/TopLevelNavigationAndroidTest.kt

      - name: Commit direct-child candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test app/src/androidTest
          git commit -m "feat(home): fix navigation and enrich daily inspiration"
          test "$(git rev-parse HEAD^)" = "fd8134a6e7539d3e69248b6470014d1ba6df6d8c"
          git push origin HEAD:refs/heads/home-nav-inspiration-islamic-bg-v1
