name: Generate S25 Quran RTL reading and Adhan preview candidate

on:
  push:
    branches: [s25-quran-rtl-reading-adhan-preview-impl-driver-20260907]

permissions:
  contents: write

env:
  SPEC_SHA: 69bb050afe4e29bd2c0cf932885d6aed35bf3f99
  BASE_RUNTIME_SHA: e3350b74e927d5dbc411f85be86be95cf652e93c
  CANDIDATE_BRANCH: s25-quran-rtl-reading-adhan-preview-v1

jobs:
  generate-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve patch and checkout exact SPEC
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/s25-quran-rtl-reading-adhan-preview.py /tmp/s25-remediation.py
          git checkout --detach "$SPEC_SHA"
          test "$(git rev-parse HEAD)" = "$SPEC_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_RUNTIME_SHA"
      - name: Apply physical S25 remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/s25-remediation.py
          git diff --check
          Q=app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          P=app/src/main/java/com/archimedeprojects/arihna/feature/prayers/PrayerTimesPlaceholderScreen.kt
          grep -Fq 'LocalLayoutDirection provides LayoutDirection.Rtl' "$Q"
          grep -Fq 'quran-reading-fullscreen' "$Q"
          grep -Fq 'quran-zoomable-page-' "$Q"
          grep -Fq 'Indice del Corano' "$Q"
          grep -Fq 'prayer-sound-choose-adhan' "$P"
          grep -Fq 'AudioAttributes.USAGE_MEDIA' "$P"
          grep -Fq 'previewPlayer.play(variant)' "$P"
          test "$(git diff --name-only | sort)" = $'app/src/main/java/com/archimedeprojects/arihna/feature/prayers/PrayerTimesPlaceholderScreen.kt\napp/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt'
      - name: Create direct single-parent candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Arihna SPEC-first CI'
          git config user.email 'arihna-ci@users.noreply.github.com'
          git add app/src/main/java/com/archimedeprojects/arihna/feature/prayers/PrayerTimesPlaceholderScreen.kt \
                  app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          TREE_SHA="$(git write-tree)"
          CANDIDATE_SHA="$(printf '%s\n' 'fix: S25 Quran RTL reading and Adhan preview' | git commit-tree "$TREE_SHA" -p "$SPEC_SHA")"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$SPEC_SHA"
          test "$(git rev-list --parents -n1 "$CANDIDATE_SHA" | wc -w)" -eq 2
          git diff --check "$SPEC_SHA" "$CANDIDATE_SHA"
          test -n "$(git diff --name-only "$SPEC_SHA" "$CANDIDATE_SHA")"
          git push origin "$CANDIDATE_SHA:refs/heads/$CANDIDATE_BRANCH" --force
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
      - name: Verify pushed candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_BRANCH" --force
          test "$(git rev-parse "origin/$CANDIDATE_BRANCH")" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$SPEC_SHA"
          echo "DIRECT_CHILD_CANDIDATE=$CANDIDATE_SHA"
