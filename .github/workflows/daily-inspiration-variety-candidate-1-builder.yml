name: Daily inspiration variety candidate 1 builder

on:
  push:
    branches:
      - driver/daily-inspiration-variety-candidate-1-20260916
    paths:
      - .github/workflows/daily-inspiration-variety-candidate-1-builder.yml

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 08eb114b6eec46ceee2cef65451302ac03b7e0fa
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Create direct-child runtime candidate and preflight
        shell: bash
        env:
          CATALOG_Z: 
          TEST_Z: 
        run: |
          set -euo pipefail
          SPEC='08eb114b6eec46ceee2cef65451302ac03b7e0fa'
          CANDIDATE_BRANCH='daily-inspiration-variety-candidate-1'
          test "$(git rev-parse HEAD)" = "$SPEC"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$SPEC"
          python3 -c "import os,base64,zlib,pathlib; p=pathlib.Path('app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspirationCatalog.kt'); p.write_bytes(zlib.decompress(base64.b64decode(os.environ['CATALOG_Z'])))"
          python3 -c "import os,base64,zlib,pathlib; p=pathlib.Path('app/src/test/java/com/archimedeprojects/arihna/feature/home/DailyInspirationTest.kt'); p.write_bytes(zlib.decompress(base64.b64decode(os.environ['TEST_Z'])))"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt')
          s = p.read_text(encoding='utf-8')
          old_comment = '''/**
           * Only directly sourced Quran / sahih hadith text is presented as Quran or hadith.
           * Free-form encouragement lives in the separate DailyAction model below and is not
           * attributed to scripture.
           */'''
          new_comment = '''/**
           * Only directly sourced Quran / sahih hadith text is presented as Quran or hadith.
           * Original Arihna encouragement is explicitly labeled as non-scripture, while DailyAction
           * remains practical guidance and is never attributed to Quran or hadith.
           */'''
          assert s.count(old_comment) == 1, s.count(old_comment)
          s = s.replace(old_comment, new_comment)
          old_inspiration_end = ')\n\ninternal data class DailyAction('
          assert s.count(old_inspiration_end) == 1, s.count(old_inspiration_end)
          s = s.replace(old_inspiration_end, ') + additionalDailyInspirations\n\ninternal data class DailyAction(', 1)
          old_action_end = ')\n\ninternal fun dailyInspirationFor'
          assert s.count(old_action_end) == 1, s.count(old_action_end)
          s = s.replace(old_action_end, ') + additionalDailyActions\n\ninternal fun dailyInspirationFor', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          mapfile -t CHANGED < <(git status --short | sed 's/^...//' | sort)
          printf 'CHANGED=%s\n' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -eq 3
          test "${CHANGED[0]}" = 'app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt'
          test "${CHANGED[1]}" = 'app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspirationCatalog.kt'
          test "${CHANGED[2]}" = 'app/src/test/java/com/archimedeprojects/arihna/feature/home/DailyInspirationTest.kt'
          ! printf '%s\n' "${CHANGED[@]}" | grep -Ei 'prayer|location|qibla|alarm|quran'
          grep -Fq 'Promemoria Arihna · non è una citazione' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspirationCatalog.kt
          test "$(grep -c '    DailyInspiration(' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspirationCatalog.kt)" -eq 54
          test "$(grep -c '    DailyAction(' app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspirationCatalog.kt)" -eq 22
          grep -Fq 'inspirationCorpusHasSixtyUniqueDaysWithoutExactRepeats' app/src/test/java/com/archimedeprojects/arihna/feature/home/DailyInspirationTest.kt
          ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspiration.kt app/src/main/java/com/archimedeprojects/arihna/feature/home/DailyInspirationCatalog.kt app/src/test/java/com/archimedeprojects/arihna/feature/home/DailyInspirationTest.kt
          git commit -m 'feat(home): expand daily inspiration variety'
          test "$(git rev-parse HEAD^)" = "$SPEC"
          test "$(git rev-list --count "$SPEC..HEAD")" -eq 1
          test "$(git diff --name-only "$SPEC..HEAD" | wc -l)" -eq 3
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
