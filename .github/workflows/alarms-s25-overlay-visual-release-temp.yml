name: Alarms S25 overlay visual prerelease

on:
  push:
    branches:
      - alarms-s25-overlay-visual-release-temp
    paths:
      - .github/workflows/alarms-s25-overlay-visual-release-temp.yml

permissions:
  actions: read
  contents: write

jobs:
  build-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUNTIME_SHA: c79ec96e38c10eecce185d215e8abd7fd6ad3554
      SPEC_SHA: a2e8b3e518f4220e7ac6da36b7412cd07f080f40
      BASE_RUNTIME_SHA: 79c6e521e234e4b5f06b9b3366400fec1c69a9ab
      VERIFIED_GATE_RUN: '33991209485'
      VERIFIED_API28_JOB: '101373655162'
      VERIFIED_API36_JOB: '101373655336'
      SIGNING_SOURCE_SHA: ce23a7f78695be95c7f8dfd2bcedbe22544da94c
      DEBUG_CERT_SHA256: 13:97:00:8C:1F:96:2D:BB:D3:6D:D8:A8:EA:02:16:AF:DD:06:E4:B2:B3:E0:8B:C0:F6:D4:B5:43:44:D7:B0:FA
      DEBUG_CERT_SHA256_COMPACT: 1397008c1f962dbbd36dd8a8ea0216afdd06e4b2b3e08bc0f6d4b54344d7b0fa
      DEBUG_KEYSTORE_SHA256: bc9057f26ad6de7efb70a5df06effb1ed259f1d015c3f062d0f757b3f0983b72
      GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
      ADHAN_SHA256: 3b350bc210d657727578ed977e32323c06b63c2088c3ebcea9fc9afb7d487702
      RELEASE_TAG: alarms-s25-overlay-visual-c79ec96e-20260905
      APK_NAME: arihna-alarms-s25-overlay-visual.apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c79ec96e38c10eecce185d215e8abd7fd6ad3554
          fetch-depth: 0

      - name: Verify exact runtime lineage main and definitive gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$BASE_RUNTIME_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$RUNTIME_SHA"
          test "$(git diff --name-only "$BASE_RUNTIME_SHA" "$SPEC_SHA")" = "PROJECT_SPEC.md"
          EXPECTED=$'app/src/androidTest/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmOverlayVolumeAndroidTest.kt\napp/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingOverlay.kt'
          ACTUAL="$(git diff --name-only "$SPEC_SHA" "$RUNTIME_SHA" | sort)"
          test "$ACTUAL" = "$EXPECTED"
          SPEC_TEXT="$(git show "$SPEC_SHA:PROJECT_SPEC.md")"
          grep -Fq 'Galaxy S25 overlay action contrast correction — APPROVED 2026-09-05' <<<"$SPEC_TEXT"
          for JOB in "$VERIFIED_API28_JOB" "$VERIFIED_API36_JOB"; do
            ACTUAL_JOB="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB" --jq '[(.id|tostring),(.run_id|tostring),.status,.conclusion] | join(" ")')"
            test "$ACTUAL_JOB" = "$JOB $VERIFIED_GATE_RUN completed success"
          done
          RUN_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_GATE_RUN" --jq '[.status,.conclusion] | join(" ")')"
          test "$RUN_STATE" = 'completed success'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: android-actions/setup-android@v3

      - name: Restore and verify frozen GeoNames asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh run download 33296099459 --repo "$GITHUB_REPOSITORY" --name geonames-step4-runtime-minimal --dir /tmp/geonames
          DB="$(find /tmp/geonames -type f -name cities.db -print -quit)"
          test -n "$DB"
          cp "$DB" app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Verify visual-only runtime contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -q 'minSdk = 28' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_FULL_SCREEN_INTENT FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK SYSTEM_ALERT_WINDOW; do grep -q "android.permission.$P" app/src/main/AndroidManifest.xml; done
          ! grep -q 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          OVERLAY=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingOverlay.kt
          ! grep -Fq 'import android.widget.Button' "$OVERLAY"
          ! grep -Fq 'Button(context)' "$OVERLAY"
          grep -Fq '): TextView = TextView(context).apply' "$OVERLAY"
          grep -Fq 'text = "Interrompi"' "$OVERLAY"
          grep -Fq 'text = "Rinvia 5 min"' "$OVERLAY"
          grep -Fq 'fill = if (filled) ARIHNA_GOLD else ARIHNA_GREEN_DARK' "$OVERLAY"
          grep -Fq 'strokeDp = if (filled) 0 else 2' "$OVERLAY"
          grep -Fq 'minimumHeight = dp(56)' "$OVERLAY"
          grep -Fq 'WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY' "$OVERLAY"
          grep -Fq 'Settings.canDrawOverlays(appContext)' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmOverlayAccess.kt
          ! grep -Fq 'RemoteViews' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'AudioAttributes.USAGE_ALARM' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'AudioManager.STREAM_ALARM' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmVolumeController.kt
          grep -Fq 'const val TEST_DELAY_MILLIS = 20_000L' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt
          test -f app/src/main/res/raw/adhan_cc0.ogg
          test "$(stat -c '%s' app/src/main/res/raw/adhan_cc0.ogg)" = "820174"
          test "$(sha256sum app/src/main/res/raw/adhan_cc0.ogg | awk '{print $1}')" = "$ADHAN_SHA256"

      - name: Restore persistent Arihna debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin location-step5-device-test
          mkdir -p "$HOME/.android"
          git show "$SIGNING_SOURCE_SHA:.github/test-signing/arihna-debug.keystore.b64" | base64 --decode > "$HOME/.android/debug.keystore"
          ACTUAL_KEYSTORE_SHA="$(sha256sum "$HOME/.android/debug.keystore" | awk '{print $1}')"
          test "$ACTUAL_KEYSTORE_SHA" = "$DEBUG_KEYSTORE_SHA256"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee /tmp/keytool.txt
          grep -F "$DEBUG_CERT_SHA256" /tmp/keytool.txt
          echo "VISUAL_KEYSTORE_SHA256=$ACTUAL_KEYSTORE_SHA"
          echo "VISUAL_CERT_SHA256=$DEBUG_CERT_SHA256"

      - name: Apply transient persistent debug signing configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          marker = '    buildFeatures {\n'
          block = '''    signingConfigs {\n        getByName("debug") {\n            storeFile = file("${System.getProperty("user.home")}/.android/debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n\n'''
          if marker not in text:
              raise SystemExit('buildFeatures marker not found')
          path.write_text(text.replace(marker, block + marker, 1))
          PY
          git diff --check -- app/build.gradle.kts
          test "$(git diff --name-only)" = "app/build.gradle.kts"
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -

      - name: Build exact visual-correction runtime for Galaxy S25 validation
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK package signer permissions and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          tr '[:upper:]' '[:lower:]' < /tmp/apksigner.txt | tr -d ':' | grep -F "$DEBUG_CERT_SHA256_COMPACT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.archimedeprojects.arihna'" /tmp/badging.txt
          grep -F "sdkVersion:'28'" /tmp/badging.txt
          grep -F "targetSdkVersion:'37'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_FULL_SCREEN_INTENT FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK SYSTEM_ALERT_WINDOW; do grep -Fq "android.permission.$P" /tmp/permissions.txt; done
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' /tmp/permissions.txt
          ! grep -Fq 'android.permission.ACCESS_FINE_LOCATION' /tmp/permissions.txt
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/permissions.txt
          cp "$APK" "$APK_NAME"
          APK_SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$APK_NAME")"
          echo "$APK_SHA" > /tmp/apk-sha256.txt
          echo "$APK_SIZE" > /tmp/apk-size.txt
          echo "VISUAL_APK_SHA256=$APK_SHA"
          echo "VISUAL_APK_SIZE=$APK_SIZE"
          echo "VISUAL_APPLICATION_ID=com.archimedeprojects.arihna"

      - name: Publish Galaxy S25 overlay visual prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA="$(cat /tmp/apk-sha256.txt)"
          APK_SIZE="$(cat /tmp/apk-size.txt)"
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RUNTIME_SHA" \
            --title 'S25 validation — Alarms overlay visual — c79ec96e' \
            --prerelease \
            --notes "GALAXY S25 RETEST BUILD for the visual-only unlocked alarm overlay action correction. Exact runtime $RUNTIME_SHA; direct parent spec $SPEC_SHA; previously validated overlay-volume runtime $BASE_RUNTIME_SHA. Definitive exact-SHA gate run $VERIFIED_GATE_RUN passed: API28 job $VERIFIED_API28_JOB completed successfully with zero skipped regression tests; API36 job $VERIFIED_API36_JOB passed denied/granted exact-alarm, notification, full-screen-access and overlay-access matrix. The native OEM-themeable Button controls were replaced only inside the ringing overlay by Arihna-owned high-contrast clickable text controls; ringing lifecycle, lock-screen full-screen path, notification fallback, 5-minute snooze, audio, alarm volume, 20-second diagnostics, Prayer, Location and Qibla are unchanged. Package com.archimedeprojects.arihna. Persistent Arihna debug certificate SHA-256 $DEBUG_CERT_SHA256; keystore SHA-256 $DEBUG_KEYSTORE_SHA256. APK bytes $APK_SIZE. APK SHA-256 $APK_SHA. Galaxy S25 physical visual validation is still required."

      - name: Verify published tag prerelease and uploaded APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RUNTIME_SHA"
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = "false"
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = "true"
          test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<<"$RELEASE_JSON")" = "$RUNTIME_SHA"
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" = "1"
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$APK_NAME"
          test "$(jq -r '.assets[0].state' <<<"$RELEASE_JSON")" = "uploaded"
          test "$(jq -r '.assets[0].size' <<<"$RELEASE_JSON")" = "$(cat /tmp/apk-size.txt)"
          test "$(jq -r '.assets[0].digest' <<<"$RELEASE_JSON")" = "sha256:$(cat /tmp/apk-sha256.txt)"
          echo "VISUAL_RELEASE_ID=$(jq -r '.id' <<<"$RELEASE_JSON")"
          echo "VISUAL_RELEASE_TAG=$(jq -r '.tag_name' <<<"$RELEASE_JSON")"
          echo "VISUAL_RELEASE_URL=$(jq -r '.html_url' <<<"$RELEASE_JSON")"
          echo "VISUAL_ASSET_ID=$(jq -r '.assets[0].id' <<<"$RELEASE_JSON")"
          echo "VISUAL_ASSET_STATE=$(jq -r '.assets[0].state' <<<"$RELEASE_JSON")"
          echo "VISUAL_ASSET_SIZE=$(jq -r '.assets[0].size' <<<"$RELEASE_JSON")"
          echo "VISUAL_ASSET_DIGEST=$(jq -r '.assets[0].digest' <<<"$RELEASE_JSON")"
          echo "VISUAL_ASSET_URL=$(jq -r '.assets[0].browser_download_url' <<<"$RELEASE_JSON")"
