name: Settings streamline v4 definitive gate temp

on:
  push:
    branches:
      - settings-streamline-v4-gate-temp
    paths:
      - .github/workflows/settings-streamline-v4-definitive-gate-temp.yml

permissions:
  contents: read
  actions: read

env:
  BASE_RUNTIME_SHA: 3f28b6f053ed7cb10b0f74d789e2db730a0c2c76
  SPEC_SHA: e758f57173b31fe40ca2ada5687b37309a9c53ea
  CANDIDATE_SHA: 1ce14ee06a5e2195d5f884fdb4d3fb8c146e8198
  GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
  ADHAN_SHA256: 3b350bc210d657727578ed977e32323c06b63c2088c3ebcea9fc9afb7d487702
  HARNESS_SOURCE_SHA: 5c3597e60640f81994cda8c2a3cb11d5de999b4c
  FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
  FROZEN_ASSET_APK: arihna-settings-s25-premium.apk

jobs:
  api28-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact lineage scope and frozen main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main settings-streamline-spec settings-streamline-candidate-v4 --force
          test "$(git rev-parse origin/main)" = "$SPEC_SHA"
          test "$(git rev-parse origin/settings-streamline-spec)" = "$SPEC_SHA"
          test "$(git rev-parse origin/settings-streamline-candidate-v4)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$BASE_RUNTIME_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$SPEC_SHA"
          test "$(git diff --name-only "$BASE_RUNTIME_SHA" "$SPEC_SHA")" = "PROJECT_SPEC.md"
          EXPECTED=$'app/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/AlarmSettingsOverlayVolumeAndroidTest.kt\napp/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreenAndroidTest.kt\napp/src/main/java/com/archimedeprojects/arihna/app/ArihnaApp.kt\napp/src/main/java/com/archimedeprojects/arihna/app/StartupCapabilityGate.kt\napp/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt\napp/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt\napp/src/test/java/com/archimedeprojects/arihna/app/StartupCapabilityGateTest.kt\napp/src/test/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticDelayTest.kt'
          ACTUAL="$(git diff --name-only "$SPEC_SHA" "$CANDIDATE_SHA" | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git show "$SPEC_SHA:PROJECT_SPEC.md" | grep -Fq 'General Settings streamline + startup capability guidance — APPROVED 2026-09-06'
          git checkout --detach "$CANDIDATE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Verify streamlined settings and frozen platform contract
        shell: bash
        run: |
          set -euo pipefail
          UI=app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          GATE=app/src/main/java/com/archimedeprojects/arihna/app/StartupCapabilityGate.kt
          APP=app/src/main/java/com/archimedeprojects/arihna/app/ArihnaApp.kt
          DELAY=app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt
          TEST=app/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/AlarmSettingsOverlayVolumeAndroidTest.kt
          grep -q 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -q 'minSdk = 28' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          for P in ACCESS_COARSE_LOCATION POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED USE_FULL_SCREEN_INTENT FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK SYSTEM_ALERT_WINDOW; do grep -q "android.permission.$P" app/src/main/AndroidManifest.xml; done
          ! grep -q 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          grep -Fq 'SettingsBackground = Color(0xFF07100D)' "$UI"
          grep -Fq 'SettingsSurface = Color(0xFF101C18)' "$UI"
          grep -Fq 'SettingsAccent = Color(0xFFD8BC5A)' "$UI"
          grep -Fq 'settings-location-search' "$UI"
          grep -Fq 'settings-use-current-location' "$UI"
          grep -Fq 'Text("Attuale", fontWeight = FontWeight.Bold)' "$UI"
          ! grep -Fq 'AlarmCapabilitySettingRow' "$UI"
          ! grep -Fq 'SourceBadge' "$UI"
          grep -Fq 'Volume globale delle sveglie del telefono' "$UI"
          grep -Fq 'Test sveglia (10 secondi)' "$UI"
          grep -Fq 'Test Adhan (10 secondi)' "$UI"
          grep -Fq 'Test sveglia programmato tra 10 secondi' "$UI"
          grep -Fq 'Test Adhan programmato tra 10 secondi' "$UI"
          grep -Fq 'const val TEST_DELAY_MILLIS = 10_000L' "$DELAY"
          ! grep -Fq '20_000L' "$DELAY"
          grep -Fq 'StartupCapabilityGate(' "$APP"
          for C in LOCATION NOTIFICATIONS EXACT_ALARM FULL_SCREEN OVERLAY; do grep -Fq "StartupCapability.$C" "$GATE"; done
          grep -Fq 'Manifest.permission.POST_NOTIFICATIONS' "$GATE"
          grep -Fq 'locationLauncher.launch(locationPermissionStateResolver.permission)' "$GATE"
          grep -Fq 'Text("Non ora")' "$GATE"
          grep -Fq 'exactAlarmAccessIntentFactory.create()' "$GATE"
          grep -Fq 'alarmFullScreenAccess.createSettingsIntent()' "$GATE"
          grep -Fq 'overlayAccess.createSettingsIntent()' "$GATE"
          ! grep -Fq 'composeRule.runOnIdle' "$TEST"
          grep -Fq 'fetchSemanticsNodes().isEmpty()' "$TEST"
          ! grep -Fq 'RemoteViews' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingOverlay.kt
          grep -Fq 'Settings.canDrawOverlays(appContext)' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmOverlayAccess.kt
          grep -Fq 'AudioAttributes.USAGE_ALARM' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'AudioManager.STREAM_ALARM' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmVolumeController.kt
          test "$(stat -c '%s' app/src/main/res/raw/adhan_cc0.ogg)" = "820174"
          test "$(sha256sum app/src/main/res/raw/adhan_cc0.ogg | awk '{print $1}')" = "$ADHAN_SHA256"
      - name: Restore frozen GeoNames from physically shipped APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          test -s app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: JVM regression
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble exact candidate
        run: ./gradlew assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; test -r /dev/kvm; test -w /dev/kvm; fi
      - name: API28 connected regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Verify API28 zero failures errors and skips
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('app/build/outputs/androidTest-results/connected/debug/**/*.xml', recursive=True)
          assert files
          tests=failures=errors=skipped=0; names=[]
          for f in files:
              r=ET.parse(f).getroot()
              tests += int(r.attrib.get('tests',0)); failures += int(r.attrib.get('failures',0)); errors += int(r.attrib.get('errors',0)); skipped += int(r.attrib.get('skipped',0))
              names += [tc.attrib.get('classname','') for tc in r.iter('testcase')]
          print(f'CONNECTED_TOTAL tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 74 and failures == 0 and errors == 0 and skipped == 0
          for n in ['LocationSettingsScreenAndroidTest','AlarmSettingsOverlayVolumeAndroidTest','AlarmsScreenAndroidTest','AlarmOverlayVolumeAndroidTest','QiblaScreenAndroidTest']:
              assert any(n in x for x in names), n
          PY

  api36-modern-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage modern harness and checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main settings-streamline-spec settings-streamline-candidate-v4 --force
          test "$(git rev-parse origin/main)" = "$SPEC_SHA"
          test "$(git rev-parse origin/settings-streamline-spec)" = "$SPEC_SHA"
          test "$(git rev-parse origin/settings-streamline-candidate-v4)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$SPEC_SHA"
          git show "$HARNESS_SOURCE_SHA:.github/alarms-s25-overlay-volume/OverlayVolumeModernAndroidTest.kt" > /tmp/OverlayVolumeModernAndroidTest.kt
          git show "$HARNESS_SOURCE_SHA:.github/alarms-s25-overlay-volume/run-modern-api36.sh" > /tmp/run-modern-api36.sh
          chmod +x /tmp/run-modern-api36.sh
          git checkout --detach "$CANDIDATE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Verify modern platform contract unchanged
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -Fq 'const val TEST_DELAY_MILLIS = 10_000L' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt
          grep -Fq 'WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingOverlay.kt
          grep -Fq 'Settings.canDrawOverlays(appContext)' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmOverlayAccess.kt
          ! grep -Fq 'RemoteViews' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
      - name: Restore frozen GeoNames from physically shipped APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          test -s app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; test -r /dev/kvm; test -w /dev/kvm; fi
      - name: API36 denied granted exact notification fullscreen overlay matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: /tmp/run-modern-api36.sh
