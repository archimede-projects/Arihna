name: Per-alarm volume v5 published APK verification

on:
  push:
    branches:
      - driver/per-alarm-volume-only-v5-release-verify-20261009
    paths:
      - .github/workflows/per-alarm-volume-only-v5-release-verify.yml

permissions:
  contents: read

jobs:
  verify-published-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUNTIME_SHA: c01414f82d257bcd2fa6c0a6b456d49c75f00b68
      RELEASE_TAG: per-alarm-volume-c01414f8-20261009
      APK_NAME: arihna-per-alarm-volume.apk
      EXPECTED_SHA256: 5d676b84ed6e36a40f593d42f5e4337699a1228076540f4c30c4814e9f7c7703
      EXPECTED_SIZE: '387688508'
      EXPECTED_SIGNER_SHA256: 1397008c1f962dbbd36dd8a8ea0216afdd06e4b2b3e08bc0f6d4b54344d7b0fa

    steps:
      - uses: actions/checkout@v4
        with:
          ref: c01414f82d257bcd2fa6c0a6b456d49c75f00b68
          fetch-depth: 0

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Redownload and verify exact published APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$JSON")" = false
          test "$(jq -r '.prerelease' <<<"$JSON")" = true
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$RUNTIME_SHA"
          test "$(jq '.assets | length' <<<"$JSON")" = 1
          test "$(jq -r '.assets[0].name' <<<"$JSON")" = "$APK_NAME"
          test "$(jq -r '.assets[0].state' <<<"$JSON")" = uploaded
          test "$(jq -r '.assets[0].size' <<<"$JSON")" = "$EXPECTED_SIZE"
          test "$(jq -r '.assets[0].digest' <<<"$JSON")" = "sha256:$EXPECTED_SHA256"
          rm -rf /tmp/releasecheck && mkdir -p /tmp/releasecheck
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME" --dir /tmp/releasecheck
          APK="/tmp/releasecheck/$APK_NAME"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' "$APK")" = "$EXPECTED_SIZE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          tr '[:upper:]' '[:lower:]' < /tmp/apksigner.txt | tr -d ':' | grep -F "$EXPECTED_SIGNER_SHA256"
          echo "VERIFIED_RELEASE_URL=$(jq -r '.html_url' <<<"$JSON")"
          echo "VERIFIED_ASSET_URL=$(jq -r '.assets[0].browser_download_url' <<<"$JSON")"
          echo "VERIFIED_APK_SHA256=$EXPECTED_SHA256"
          echo "VERIFIED_APK_SIZE=$EXPECTED_SIZE"
          echo "VERIFIED_SIGNER_SHA256=$EXPECTED_SIGNER_SHA256"
