name: UI wow fused definitive gate temp

on:
  push:
    branches:
      - ui-wow-fused-gate-temp
    paths:
      - .github/workflows/ui-wow-fused-definitive-gate-temp.yml

permissions:
  contents: read
  actions: read

env:
  BASE_RUNTIME_SHA: e7f776c9c92ce1152f5951fcd7bb88c3726d30e7
  SPEC_SHA: 975c62931acca374b3727ad10d45e005fcdd7bf2
  CANDIDATE_SHA: c6c73e6bf6d61b72d4ebeea1547c545dc16ed2fe
  GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
  ADHAN_SHA256: 3b350bc210d657727578ed977e32323c06b63c2088c3ebcea9fc9afb7d487702
  HARNESS_SOURCE_SHA: 5c3597e60640f81994cda8c2a3cb11d5de999b4c
  FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
  FROZEN_ASSET_APK: arihna-settings-s25-premium.apk

jobs:
  api28-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact lineage scope and frozen main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main ui-wow-fused-candidate --force
          test "$(git rev-parse origin/main)" = "$SPEC_SHA"
          test "$(git rev-parse origin/ui-wow-fused-candidate)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$SPEC_SHA^")" = "$BASE_RUNTIME_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$SPEC_SHA"
          test "$(git diff --name-only "$BASE_RUNTIME_SHA" "$SPEC_SHA")" = "PROJECT_SPEC.md"
          EXPECTED=$'app/build.gradle.kts\napp/src/androidTest/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreenAndroidTest.kt\napp/src/androidTest/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreenAndroidTest.kt\napp/src/main/AndroidManifest.xml\napp/src/main/java/com/archimedeprojects/arihna/app/AppContainer.kt\napp/src/main/java/com/archimedeprojects/arihna/app/ArihnaNavHost.kt\napp/src/main/java/com/archimedeprojects/arihna/app/StartupCapabilityGate.kt\napp/src/main/java/com/archimedeprojects/arihna/core/location/platform/AndroidLocationEnvironment.kt\napp/src/main/java/com/archimedeprojects/arihna/core/location/platform/GoogleFusedDeviceLocationDataSource.kt\napp/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt\napp/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt\ngradle/libs.versions.toml'
          ACTUAL="$(git diff --name-only "$SPEC_SHA" "$CANDIDATE_SHA" | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git show "$SPEC_SHA:PROJECT_SPEC.md" | grep -Fq 'Home + Settings exact approved mockup and Google fused location takeover — APPROVED 2026-09-06'
          git checkout --detach "$CANDIDATE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Verify approved UI fused and frozen platform contract
        shell: bash
        run: |
          set -euo pipefail
          HOME=app/src/main/java/com/archimedeprojects/arihna/feature/home/HomePrayerScheduleScreen.kt
          SETTINGS=app/src/main/java/com/archimedeprojects/arihna/feature/settings/LocationSettingsScreen.kt
          NAV=app/src/main/java/com/archimedeprojects/arihna/app/ArihnaNavHost.kt
          GATE=app/src/main/java/com/archimedeprojects/arihna/app/StartupCapabilityGate.kt
          DI=app/src/main/java/com/archimedeprojects/arihna/app/AppContainer.kt
          FUSED=app/src/main/java/com/archimedeprojects/arihna/core/location/platform/GoogleFusedDeviceLocationDataSource.kt
          grep -q 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -q 'minSdk = 28' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -Fq 'play-services-location' gradle/libs.versions.toml
          grep -Fq '21.3.0' gradle/libs.versions.toml
          grep -Fq 'material-icons-extended' gradle/libs.versions.toml
          grep -Fq 'libs.play.services.location' app/build.gradle.kts
          grep -Fq 'libs.androidx.compose.material.icons.extended' app/build.gradle.kts
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED USE_FULL_SCREEN_INTENT FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK SYSTEM_ALERT_WINDOW; do grep -q "android.permission.$P" app/src/main/AndroidManifest.xml; done
          ! grep -q 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          grep -Fq 'GoogleFusedDeviceLocationDataSource(appContext)' "$DI"
          grep -Fq 'FusedLocationProviderClient' "$FUSED"
          grep -Fq 'Priority.PRIORITY_HIGH_ACCURACY' "$FUSED"
          grep -Fq 'fusedClient.lastLocation' "$FUSED"
          grep -Fq 'requestLocationUpdates' "$FUSED"
          grep -Fq 'RequestMultiplePermissions()' "$GATE"
          grep -Fq 'locationPermissionStateResolver.permissions' "$GATE"
          grep -Fq 'PopupProperties(focusable = false)' "$SETTINGS"
          grep -Fq 'heightIn(max = 260.dp)' "$SETTINGS"
          grep -Fq 'Icons.Rounded.MyLocation' "$SETTINGS"
          grep -Fq 'settings-city-suggestions' "$SETTINGS"
          grep -Fq 'PROSSIMA PREGHIERA' "$HOME"
          grep -Fq 'Corano 94:5–6' "$HOME"
          grep -Fq 'home-quick-actions' "$HOME"
          grep -Fq 'Icons.Rounded.Home' "$NAV"
          grep -Fq 'label = null' "$NAV"
          ! grep -Fq 'shortLabel' "$NAV"
          ! grep -Fq 'Posizione dispositivo' "$HOME"
          ! grep -Fq 'Posizione manuale' "$HOME"
          ! grep -Fq 'Metodo:' "$HOME"
          ! grep -Fq 'Text("Attuale"' "$SETTINGS"
          ! grep -Fq 'RemoteViews' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -Fq 'WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingOverlay.kt
          grep -Fq 'AudioManager.STREAM_ALARM' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmVolumeController.kt
          grep -Fq 'const val TEST_DELAY_MILLIS = 10_000L' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmDiagnosticTestScheduler.kt
          test "$(stat -c '%s' app/src/main/res/raw/adhan_cc0.ogg)" = "820174"
          test "$(sha256sum app/src/main/res/raw/adhan_cc0.ogg | awk '{print $1}')" = "$ADHAN_SHA256"
      - name: Restore frozen GeoNames from physically shipped APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          test -s app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: JVM regression
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble exact candidate
        run: ./gradlew assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; test -r /dev/kvm; test -w /dev/kvm; fi
      - name: API28 connected regression with Google APIs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Verify API28 zero failures errors and skips
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('app/build/outputs/androidTest-results/connected/debug/**/*.xml', recursive=True)
          assert files
          tests=failures=errors=skipped=0; names=[]
          for f in files:
              r=ET.parse(f).getroot()
              tests += int(r.attrib.get('tests',0)); failures += int(r.attrib.get('failures',0)); errors += int(r.attrib.get('errors',0)); skipped += int(r.attrib.get('skipped',0))
              names += [tc.attrib.get('classname','') for tc in r.iter('testcase')]
          print(f'CONNECTED_TOTAL tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests >= 75 and failures == 0 and errors == 0 and skipped == 0
          for n in ['HomePrayerScheduleScreenAndroidTest','LocationSettingsScreenAndroidTest','AlarmSettingsOverlayVolumeAndroidTest','AlarmsScreenAndroidTest','AlarmOverlayVolumeAndroidTest','QiblaScreenAndroidTest']:
              assert any(n in x for x in names), n
          PY

  api36-modern-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage modern harness and checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main ui-wow-fused-candidate --force
          test "$(git rev-parse origin/main)" = "$SPEC_SHA"
          test "$(git rev-parse origin/ui-wow-fused-candidate)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$SPEC_SHA"
          git show "$HARNESS_SOURCE_SHA:.github/alarms-s25-overlay-volume/OverlayVolumeModernAndroidTest.kt" > /tmp/OverlayVolumeModernAndroidTest.kt
          git show "$HARNESS_SOURCE_SHA:.github/alarms-s25-overlay-volume/run-modern-api36.sh" > /tmp/run-modern-api36.sh
          chmod +x /tmp/run-modern-api36.sh
          git checkout --detach "$CANDIDATE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Verify modern location and alarm contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          grep -Fq 'RequestMultiplePermissions()' app/src/main/java/com/archimedeprojects/arihna/app/StartupCapabilityGate.kt
          grep -Fq 'WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingOverlay.kt
          ! grep -Fq 'RemoteViews' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
      - name: Restore frozen GeoNames from physically shipped APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geonames app/src/main/assets/geonames
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; test -r /dev/kvm; test -w /dev/kvm; fi
      - name: API36 denied granted alarm matrix with Google APIs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: /tmp/run-modern-api36.sh
