name: Quran Tajwid Mushaf UI candidate builder

on:
  push:
    branches:
      - quran-tajwid-mushaf-ui-builder

permissions:
  contents: write

concurrency:
  group: quran-tajwid-mushaf-ui-builder
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: android-actions/setup-android@v3

      - name: Create and preflight one-commit page-first candidate
        shell: bash
        run: |
          set -euo pipefail
          SPEC='0cba37318fff876499b71c704b0709383f53b599'
          RELEASED_RUNTIME='b90473abc2e56111b87901710ae973f0419e345d'
          CANDIDATE_BRANCH='quran-tajwid-mushaf-ui-candidate-1'
          cp .github/builders/quran-tajwid-mushaf-ui/patch.py /tmp/quran-tajwid-mushaf-ui-patch.py
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASED_RUNTIME"
          git checkout --detach "$SPEC"

          python3 /tmp/quran-tajwid-mushaf-ui-patch.py
          git diff --check

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt | sort)"
          test "$CHANGED" = "$EXPECTED"
          ! echo "$CHANGED" | grep -Ei 'prayer|location|qibla|alarm|home'

          grep -Fq 'fun hafsPageStarts(context: Context): List<Pair<Int, Int>>' app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt
          grep -Fq 'require(starts.size == 604)' app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt
          grep -Fq 'quran-mode-tabs' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'quran-tajwid-rtl-pager' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'quran-tajwid-page-surface' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'append("\\u00A0")' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'append("۝${toArabicIndic(ayah.ayah)}")' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          ! grep -Fq 'private fun TajwidAyahCard' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'WindowInsets.displayCutout.union(WindowInsets.statusBars)' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt
          grep -Fq 'Colorazione tajwid · Beta / regole principali' app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt

          ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/archimedeprojects/arihna/feature/quran/QuranPlaceholderScreen.kt \
                  app/src/main/java/com/archimedeprojects/arihna/feature/quran/MushafRepository.kt \
                  app/src/androidTest/java/com/archimedeprojects/arihna/feature/quran/QuranFullscreenAndroidTest.kt
          git commit -m 'fix(quran): render Tajwid as page-first Mushaf'
          test "$(git rev-parse HEAD^)" = "$SPEC"
          test "$(git rev-list --count "$SPEC..HEAD")" -eq 1
          test "$(git diff --name-only "$SPEC..HEAD" | wc -l)" -eq 3
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
