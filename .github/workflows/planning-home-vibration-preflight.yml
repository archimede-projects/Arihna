name: Arihna Planning Home and vibration isolated preflight
# revision 2: include planning instrumentation and home entrypoint from any location state

on:
  push:
    branches:
      - driver/planning-home-vibration-preflight-20261021
    paths:
      - .github/workflows/planning-home-vibration-preflight.yml

permissions:
  contents: read

jobs:
  planning-compile-and-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify planning stage is separate from main
        run: |
          test "$(git rev-parse 5ee6f6c18545a88547e0e427ee786f4c3aa4caed^)" = 4e1bbd7514977bea373a7940c4b17adfb63902d2
          test "$(git rev-parse origin/main)" = 4e1bbd7514977bea373a7940c4b17adfb63902d2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Restore fixed GeoNames data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download settings-s25-premium-3f28b6f0-20260906 --repo "$GITHUB_REPOSITORY" --pattern arihna-settings-s25-premium.apk --dir /tmp/geonames
          unzip -p /tmp/geonames/arihna-settings-s25-premium.apk assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: JVM and Android instrumented compilation, APK assembly
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace
      - name: Audit user-protected APK offline assets
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file()
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              assert sum("mushaf/" in x or "mushaf-warsh/" in x for x in names) >= 1208
              assert any("geonames/cities.db" in x for x in names)
          print("PLANNING PREFLIGHT APK BYTES",apk.stat().st_size)
          PY
