name: Combined Orari location exact-SHA gate

on:
  push:
    branches:
      - parallel-orari-location-combined-gate-driver-20260907

permissions:
  contents: read

env:
  SPEC_SHA: 21c7f8763734c2646e24f34c792c58f1816625d2
  CANDIDATE_SHA: 882e434ea036ef9033608131b428e46b16b64d1e
  PACKAGE_NAME: com.archimedeprojects.arihna
  GEONAMES_SHA256: 7bf32ed8845b293518880f00345406b5fc45e83b4c0e0555313c42472569c6bb
  ADHAN_SHA256: 3b350bc210d657727578ed977e32323c06b63c2088c3ebcea9fc9afb7d487702
  ADHAN_BEAUTIFUL_SHA256: 35fe06b08fe80505c550c33fed8a783fa9901ddc81ac884958b4be048f5b2a79
  ADHAN_SHORT_SHA256: faeb03e4338554fb8b54dba98ed4949648615b58e991bbd560a89f4837dde413
  FROZEN_ASSET_RELEASE: settings-s25-premium-3f28b6f0-20260906
  FROZEN_ASSET_APK: arihna-settings-s25-premium.apk

jobs:
  static-jvm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 882e434ea036ef9033608131b428e46b16b64d1e
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify exact SHA lineage and exact union scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
          git diff --name-only "$SPEC_SHA" HEAD | sort > /tmp/actual
          printf '%s\n' \
            app/src/main/java/com/archimedeprojects/arihna/core/location/domain/LocationCoordinator.kt \
            app/src/main/java/com/archimedeprojects/arihna/core/location/platform/GoogleFusedDeviceLocationDataSource.kt \
            app/src/test/java/com/archimedeprojects/arihna/core/location/domain/LocationCoordinatorTest.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/alarms/AlarmsViewModel.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/alarms/domain/AlarmModels.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt \
            app/src/main/java/com/archimedeprojects/arihna/feature/prayers/PrayerTimesPlaceholderScreen.kt \
            app/src/main/res/raw/adhan_beautiful_cc0.ogg \
            app/src/main/res/raw/adhan_short_cc0.ogg \
            app/src/test/java/com/archimedeprojects/arihna/feature/alarms/domain/AdhanVariantTest.kt \
            docs/audio/ADHAN_SOURCES.md | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Verify combined contracts
        shell: bash
        run: |
          set -euo pipefail
          LOCATION=app/src/main/java/com/archimedeprojects/arihna/core/location/domain/LocationCoordinator.kt
          FUSED=app/src/main/java/com/archimedeprojects/arihna/core/location/platform/GoogleFusedDeviceLocationDataSource.kt
          SCREEN=app/src/main/java/com/archimedeprojects/arihna/feature/prayers/PrayerTimesPlaceholderScreen.kt
          grep -F 'explicitRefresh = true' "$LOCATION"
          grep -F 'forceAccept = explicitRefresh' "$LOCATION"
          grep -F 'if (!forceAccept && !updatePolicy.shouldAccept(previous, candidate)' "$LOCATION"
          grep -F 'CurrentLocationRequest.Builder()' "$FUSED"
          grep -F 'Priority.PRIORITY_HIGH_ACCURACY' "$FUSED"
          grep -F '.setMaxUpdateAgeMillis(0L)' "$FUSED"
          grep -F 'fusedClient.lastLocation' "$FUSED"
          grep -F 'requestLocationUpdates' "$FUSED"
          grep -F 'freshExplicitRefreshBelowFiveKilometersReplacesCache' app/src/test/java/com/archimedeprojects/arihna/core/location/domain/LocationCoordinatorTest.kt
          ! grep -Fq 'LazyColumn' "$SCREEN"
          ! grep -Fq 'verticalScroll' "$SCREEN"
          ! grep -Fq 'import androidx.compose.foundation.layout.weight' "$SCREEN"
          grep -F 'modifier = Modifier.weight(1f),' "$SCREEN"
          grep -F 'Icons.Rounded.Mosque' "$SCREEN"
          grep -F 'Icons.Rounded.VolumeOff' "$SCREEN"
          grep -F 'AdhanVariant.entries.forEach' "$SCREEN"
          grep -F 'R.raw.adhan_beautiful_cc0' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          grep -F 'R.raw.adhan_short_cc0' app/src/main/java/com/archimedeprojects/arihna/feature/alarms/platform/AlarmRingingService.kt
          echo "$ADHAN_BEAUTIFUL_SHA256  app/src/main/res/raw/adhan_beautiful_cc0.ogg" | sha256sum -c -
          echo "$ADHAN_SHORT_SHA256  app/src/main/res/raw/adhan_short_cc0.ogg" | sha256sum -c -
          grep -F 'CC0 1.0 Universal' docs/audio/ADHAN_SOURCES.md
          test -z "$(git diff --name-only "$SPEC_SHA" HEAD -- app/src/main/java/com/archimedeprojects/arihna/feature/home app/src/main/java/com/archimedeprojects/arihna/feature/alarms/AlarmsPlaceholderScreen.kt)"
      - name: Restore frozen assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
          echo "$ADHAN_SHA256  app/src/main/res/raw/adhan_cc0.ogg" | sha256sum -c -
      - name: Verify frozen platform policy and permissions
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.archimedeprojects.arihna"' app/build.gradle.kts
          grep -F 'minSdk = 28' app/build.gradle.kts
          grep -F 'compileSdk = 37' app/build.gradle.kts
          grep -F 'targetSdk = 37' app/build.gradle.kts
          grep -F 'playServicesLocation = "21.3.0"' gradle/libs.versions.toml
          grep -F 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          grep -F 'android.permission.ACCESS_COARSE_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.USE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          grep -o 'android:name="android.permission.[^"]*"' app/src/main/AndroidManifest.xml | sed 's/android:name="//;s/"//' | sort -u > /tmp/actual-permissions
          printf '%s\n' \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK \
            android.permission.POST_NOTIFICATIONS \
            android.permission.RECEIVE_BOOT_COMPLETED \
            android.permission.SCHEDULE_EXACT_ALARM \
            android.permission.SYSTEM_ALERT_WINDOW \
            android.permission.USE_FULL_SCREEN_INTENT | sort > /tmp/expected-permissions
          diff -u /tmp/expected-permissions /tmp/actual-permissions
      - name: Host tests compile instrumentation and build APK
        run: ./gradlew testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace
      - name: Inspect built APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -s "$APK" && test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.archimedeprojects.arihna'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'28'"
          "$AAPT" dump badging "$APK" | grep -F "targetSdkVersion:'37'"
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.ACCESS_FINE_LOCATION'
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.ACCESS_COARSE_LOCATION'
          ! "$AAPT" dump permissions "$APK" | grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION'
          ! "$AAPT" dump permissions "$APK" | grep -Fq 'android.permission.USE_EXACT_ALARM'
          test "$(unzip -p "$APK" assets/geonames/cities.db | sha256sum | cut -d' ' -f1)" = "$GEONAMES_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_cc0.ogg | sha256sum | cut -d' ' -f1)" = "$ADHAN_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_beautiful_cc0.ogg | sha256sum | cut -d' ' -f1)" = "$ADHAN_BEAUTIFUL_SHA256"
          test "$(unzip -p "$APK" res/raw/adhan_short_cc0.ogg | sha256sum | cut -d' ' -f1)" = "$ADHAN_SHORT_SHA256"
          sha256sum "$APK"

  api28-full-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve validator and checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/validate_connected_xml.py /tmp/validate_connected_xml.py
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore frozen assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
          echo "$ADHAN_SHA256  app/src/main/res/raw/adhan_cc0.ogg" | sha256sum -c -
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true
      - name: Run every instrumentation test on API28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Require real zero-failure zero-skip XML
        run: python3 /tmp/validate_connected_xml.py

  api36-location-permission-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 882e434ea036ef9033608131b428e46b16b64d1e
          fetch-depth: 0
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SPEC_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore frozen GeoNames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geonames app/src/main/assets/geonames
          gh release download "$FROZEN_ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FROZEN_ASSET_APK" --dir /tmp/geonames
          unzip -p "/tmp/geonames/$FROZEN_ASSET_APK" assets/geonames/cities.db > app/src/main/assets/geonames/cities.db
          echo "$GEONAMES_SHA256  app/src/main/assets/geonames/cities.db" | sha256sum -c -
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true
      - name: Android 16 API36 permission matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew :app:installDebug --stacktrace
            adb shell pm revoke "$PACKAGE_NAME" android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm revoke "$PACKAGE_NAME" android.permission.ACCESS_COARSE_LOCATION || true
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -n 1 | grep -q 'granted=false'
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -n 1 | grep -q 'granted=false'
            adb shell pm grant "$PACKAGE_NAME" android.permission.ACCESS_COARSE_LOCATION
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -n 1 | grep -q 'granted=false'
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -n 1 | grep -q 'granted=true'
            adb shell pm grant "$PACKAGE_NAME" android.permission.ACCESS_FINE_LOCATION
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -n 1 | grep -q 'granted=true'
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -n 1 | grep -q 'granted=true'
            adb shell pm revoke "$PACKAGE_NAME" android.permission.ACCESS_FINE_LOCATION
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -n 1 | grep -q 'granted=false'
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -n 1 | grep -q 'granted=true'
            adb shell pm revoke "$PACKAGE_NAME" android.permission.ACCESS_COARSE_LOCATION
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_FINE_LOCATION:' | head -n 1 | grep -q 'granted=false'
            adb shell dumpsys package "$PACKAGE_NAME" | grep -F 'android.permission.ACCESS_COARSE_LOCATION:' | head -n 1 | grep -q 'granted=false'
