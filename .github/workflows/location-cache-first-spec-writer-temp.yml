name: Location cache-first spec writer temp

on:
  push:
    branches:
      - location-cache-first-spec-writer-temp
    paths:
      - .github/workflows/location-cache-first-spec-writer-temp.yml
      - .github/scripts/write-location-cache-first-spec.py

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build cache-first spec-only commit
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/write-location-cache-first-spec.py /tmp/write-location-cache-first-spec.py
          git checkout --detach 685f37336fffc1cbfcd7169b74e2f0866c23498c
          python3 /tmp/write-location-cache-first-spec.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(location): approve cache-first foreground reentry'
          git push origin HEAD:fix-location-cache-first-reentry
