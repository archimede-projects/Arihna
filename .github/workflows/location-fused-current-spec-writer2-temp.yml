name: Location fused current spec writer 2 temp

on:
  push:
    branches:
      - fix-location-fused-current-spec-writer2-temp
    paths:
      - .github/workflows/location-fused-current-spec-writer2-temp.yml

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-location-fused-current-spec-writer2-temp
          fetch-depth: 0
      - name: Build clean spec-only commit above production main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/temp/write_fused_current_spec.py /tmp/write_fused_current_spec.py
          git fetch origin main
          git checkout -B fix-location-fused-current-production origin/main
          test "$(git rev-parse HEAD)" = "df5bcaa8c394cc332547453f30fbe4fdeaee8900"
          python3 /tmp/write_fused_current_spec.py
          git diff --check -- PROJECT_SPEC.md
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(location): approve fused current production correction'
          git push --force-with-lease origin HEAD:fix-location-fused-current-production
