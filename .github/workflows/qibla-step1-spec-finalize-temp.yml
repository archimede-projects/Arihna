name: Qibla STEP 1 spec finalize temp

on:
  push:
    branches:
      - qibla-step1-spec-finalize-temp

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2600a2f13fc126acbae48cae28fefca377500da7
          fetch-depth: 0

      - name: Verify exact base and source spec
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2600a2f13fc126acbae48cae28fefca377500da7"
          test "$(git rev-parse origin/main)" = "2600a2f13fc126acbae48cae28fefca377500da7"
          git cat-file -e ec0744afdee696365c2429b8b40464057c56ea91^{commit}
          git show ec0744afdee696365c2429b8b40464057c56ea91:PROJECT_SPEC.md > PROJECT_SPEC.md

      - name: Prefer API33 true-heading sensor in spec
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_SPEC.md')
          text = p.read_text(encoding='utf-8')

          old = '''- Android orientation sensors may report orientation against **magnetic north**. Arihna must never compare a magnetic heading directly with the true-north Qibla bearing without correction.
- For sensor paths whose heading is magnetic, calculate declination with Android `android.hardware.GeomagneticField` using the exact active `SelectedLocation.coordinates`, the injected/testable current time, and altitude `0 m` because altitude is not part of Arihna's closed Location contract. The `0 m` value is an explicit geomagnetic-model approximation only; it is not a fabricated user location and must not propagate into Location or Prayer state.'''
          new = '''- Android orientation sources may be **direct true-north** or **magnetic-north** sources. Arihna must keep the reference explicit and must never apply magnetic declination twice.
- On API 33+ (`Build.VERSION_CODES.TIRAMISU` and newer), prefer `Sensor.TYPE_HEADING` when the runtime actually exposes it. Android defines this sensor as the direction the device is pointing relative to **true north**; `values[0]` is heading in degrees and `values[1]` is heading accuracy in degrees. This path uses the reported true heading directly and does **not** apply `GeomagneticField` correction.
- For fallback sensor paths whose heading is magnetic, calculate declination with Android `android.hardware.GeomagneticField` using the exact active `SelectedLocation.coordinates`, the injected/testable current time, and altitude `0 m` because altitude is not part of Arihna's closed Location contract. The `0 m` value is an explicit geomagnetic-model approximation only; it is not a fabricated user location and must not propagate into Location or Prayer state.'''
          if old not in text:
              raise SystemExit('north-reference block not found')
          text = text.replace(old, new, 1)

          old = '''Preferred foreground sensor hierarchy:

1. `Sensor.TYPE_ROTATION_VECTOR` — preferred when available. Android documents its earth reference as approximately east / magnetic north / sky and exposes estimated heading accuracy in `SensorEvent.values[4]` when available.
2. `Sensor.TYPE_GEOMAGNETIC_ROTATION_VECTOR` — controlled fallback when the normal rotation vector is unavailable. It is lower-power/lower-accuracy and does not use the gyroscope, but retains a geomagnetic north reference.
3. Calibrated `TYPE_ACCELEROMETER + TYPE_MAGNETIC_FIELD` with `SensorManager.getRotationMatrix()`, `remapCoordinateSystem()` and `getOrientation()` — final compatibility fallback when neither rotation-vector sensor exists.'''
          new = '''Preferred foreground sensor hierarchy:

1. **API 33+ `Sensor.TYPE_HEADING`**, when actually available — preferred because Android reports heading directly relative to true north and includes a degree accuracy estimate. Runtime capability detection remains mandatory; API level alone does not guarantee that the physical sensor exists.
2. `Sensor.TYPE_ROTATION_VECTOR` — preferred magnetic-reference fallback. Android documents its earth reference as approximately east / magnetic north / sky and exposes estimated heading accuracy in `SensorEvent.values[4]` when available; convert to true north with the approved declination path.
3. `Sensor.TYPE_GEOMAGNETIC_ROTATION_VECTOR` — controlled fallback when the normal rotation vector is unavailable. It is lower-power/lower-accuracy and does not use the gyroscope, but retains a geomagnetic north reference; convert to true north with declination.
4. Calibrated `TYPE_ACCELEROMETER + TYPE_MAGNETIC_FIELD` with `SensorManager.getRotationMatrix()`, `remapCoordinateSystem()` and `getOrientation()` — final compatibility fallback when no heading/rotation-vector path exists.'''
          if old not in text:
              raise SystemExit('sensor hierarchy block not found')
          text = text.replace(old, new, 1)

          old = '''- Do not use deprecated `Sensor.TYPE_ORIENTATION`.
- Do not use `TYPE_GAME_ROTATION_VECTOR` for Qibla heading because Android documents that it deliberately does not use the geomagnetic field and its north reference may drift.'''
          new = '''- Do not use deprecated `Sensor.TYPE_ORIENTATION`.
- `TYPE_HEADING` was added in API 33; the implementation must be SDK-guarded and capability-checked so API28 remains fully supported through the documented fallback hierarchy.
- Do not use `TYPE_GAME_ROTATION_VECTOR` for Qibla heading because Android documents that it deliberately does not use the geomagnetic field and its north reference may drift.'''
          if old not in text:
              raise SystemExit('exclusion block not found')
          text = text.replace(old, new, 1)

          old = '''- Convert the selected sensor to a rotation matrix and derive azimuth with `SensorManager.getOrientation()` after remapping axes for the current display rotation. Portrait/landscape changes must not silently rotate the compass reference.
- Normalize magnetic and true headings to `[0°, 360°)`.'''
          new = '''- For `TYPE_HEADING`, consume the direct true-north heading/accuracy values without converting them through a magnetic rotation matrix. For rotation-vector and accelerometer+magnetometer fallbacks, derive azimuth through the appropriate rotation matrix and `SensorManager.getOrientation()`.
- Android sensor coordinates are based on the device's natural orientation. Any sensor value mapped to an on-screen compass must account for the current display rotation; use `getRotation()` / `remapCoordinateSystem()` where applicable so portrait/landscape changes do not silently rotate the compass reference.
- Normalize magnetic and true headings to `[0°, 360°)`.'''
          if old not in text:
              raise SystemExit('screen mapping block not found')
          text = text.replace(old, new, 1)

          old = '''- For `TYPE_ROTATION_VECTOR`, retain Android's `values[4]` estimated heading accuracy in radians/degrees when available (`-1` means unavailable); it may be displayed as secondary diagnostic guidance but must not be converted into a fabricated platform accuracy category.'''
          new = '''- For `TYPE_HEADING`, retain Android's direct `values[1]` accuracy in degrees. For `TYPE_ROTATION_VECTOR`, retain `values[4]` estimated heading accuracy in radians/degrees when available (`-1` means unavailable). Numeric accuracy may be displayed as secondary guidance but must not be converted into a fabricated platform accuracy category.'''
          if old not in text:
              raise SystemExit('accuracy block not found')
          text = text.replace(old, new, 1)

          old = '''DeviceHeadingState
- Unavailable(reason)
- Reading(
    magneticHeadingDegrees,
    trueHeadingDegrees,
    declinationDegrees,
    quality,
    estimatedAccuracyDegrees?
  )'''
          new = '''DeviceHeadingState
- Unavailable(reason)
- Reading(
    trueHeadingDegrees,
    quality,
    estimatedAccuracyDegrees?,
    source,
    magneticHeadingDegrees?,
    declinationDegrees?
  )

HeadingSource
- TRUE_HEADING_SENSOR
- ROTATION_VECTOR
- GEOMAGNETIC_ROTATION_VECTOR
- ACCELEROMETER_MAGNETIC_FIELD'''
          if old not in text:
              raise SystemExit('heading model block not found')
          text = text.replace(old, new, 1)

          old = '''- magnetic-to-true correction with positive and negative declination;
- Device Ready and CACHED Ready use exact accepted coordinates without a fresh-location request;'''
          new = '''- direct `TYPE_HEADING` true-north input is not declination-corrected a second time;
- magnetic-to-true fallback correction with positive and negative declination;
- sensor-source fallback selection is deterministic and API33 `TYPE_HEADING` absence falls through safely;
- Device Ready and CACHED Ready use exact accepted coordinates without a fresh-location request;'''
          if old not in text:
              raise SystemExit('test block not found')
          text = text.replace(old, new, 1)

          old = '''- fallback selection order is deterministic;
- no deprecated orientation sensor path;'''
          new = '''- fallback selection order is deterministic, with API28 exercising the no-`TYPE_HEADING` compatibility path;
- no deprecated orientation sensor path;'''
          if old not in text:
              raise SystemExit('API28 block not found')
          text = text.replace(old, new, 1)

          old = '''- device-source Qibla screen opens without requesting new permissions;
- compass responds smoothly to real rotation and crosses north without a 360° jump;'''
          new = '''- device-source Qibla screen opens without requesting new permissions;
- validation records which heading source the S25 actually exposes/selects, preferring `TYPE_HEADING` when available;
- compass responds smoothly to real rotation and crosses north without a 360° jump;'''
          if old not in text:
              raise SystemExit('S25 block not found')
          text = text.replace(old, new, 1)

          old = '''Evidence basis reviewed for STEP 1 on 2026-09-02: Android Developers documentation for `Sensor`, `SensorEvent`, `SensorManager`, rotation-vector/position sensors and `GeomagneticField`; GeoNames Kaaba shrine record for the frozen target coordinates. The Android documentation states that rotation-vector orientation references magnetic north, `TYPE_GAME_ROTATION_VECTOR` omits geomagnetic north and may drift, sensor accuracy status is explicitly reported, and `GeomagneticField.getDeclination()` estimates magnetic declination from true north.'''
          new = '''Evidence basis reviewed for STEP 1 on 2026-09-02: Android Developers documentation for `Sensor`, `SensorEvent`, `SensorManager`, sensor coordinate/display remapping, `TYPE_HEADING`, rotation-vector/position sensors and `GeomagneticField`; GeoNames Kaaba shrine record for the frozen target coordinates. Android documents `TYPE_HEADING` (API 33+) as direct true-north heading with degree accuracy, rotation-vector orientation as magnetic-north referenced, `TYPE_GAME_ROTATION_VECTOR` as omitting geomagnetic north and potentially drifting, and `GeomagneticField.getDeclination()` as the magnetic-to-true-north declination estimate.'''
          if old not in text:
              raise SystemExit('evidence block not found')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "PROJECT_SPEC.md"
          grep -Fq 'API 33+ `Sensor.TYPE_HEADING`' PROJECT_SPEC.md
          grep -Fq 'TRUE_HEADING_SENSOR' PROJECT_SPEC.md
          grep -Fq 'API28 exercising the no-`TYPE_HEADING` compatibility path' PROJECT_SPEC.md
          grep -Fq 'STEP 2 — pure bearing engine: NOT STARTED.' PROJECT_SPEC.md

      - name: Commit one clean STEP 1 spec commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs(qibla): approve step1 architecture'
          test "$(git rev-parse HEAD^)" = "2600a2f13fc126acbae48cae28fefca377500da7"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "PROJECT_SPEC.md"
          git push origin HEAD:refs/heads/qibla-step1-spec-final
