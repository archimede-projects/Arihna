name: Alarms S25 Overlay Volume Spec Writer Temp

on:
  push:
    branches:
      - alarms-s25-overlay-volume-spec-writer-20260905

permissions:
  contents: write

jobs:
  write-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify authorized base runtime
        shell: bash
        run: |
          set -euo pipefail
          expected="925a3c45193d059122c2b65c09c33e9a22fb6b48"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD^)" = "29d8b765bbe4f063db09aac1016b5a09be992509"

      - name: Append authorized overlay and alarm-volume specification
        shell: bash
        run: |
          set -euo pipefail
          marker="Galaxy S25 unlocked overlay + alarm-volume correction — APPROVED 2026-09-05"
          if grep -Fq "$marker" PROJECT_SPEC.md; then
            echo "Spec marker already present; refusing duplicate append."
            exit 1
          fi
          cat >> PROJECT_SPEC.md <<'EOF'

          #### Galaxy S25 unlocked overlay + alarm-volume correction — APPROVED 2026-09-05

          Physical Galaxy S25 validation of corrected runtime `925a3c45193d059122c2b65c09c33e9a22fb6b48` confirms that the ringing session is now stable: the alarm remains active, lock-screen/full-screen presentation works when Android permits it, and the standard expanded One UI alarm notification exposes `Interrompi` and `Rinvia`. The remaining user-visible limitation is that on an **unlocked** Galaxy S25 One UI initially renders the standard heads-up notification in its compact form, so the two actions are hidden until the user expands the notification. The user explicitly rejects that extra expansion gesture. The same physical session also established that the device alarm stream volume can be too low for the desired use.

          This corrective round is authorized **only** for the two items below; all other Alarms, Prayer, Location, Qibla, persistence and scheduling behavior remains frozen.

          **1. Unlocked alarm overlay — authorized special access**

          - Arihna may declare `android.permission.SYSTEM_ALERT_WINDOW` solely to support a large alarm control surface while an already-validated alarm is actively ringing and the device is unlocked.
          - The permission is special app access, never an ordinary runtime permission prompt. Arihna must check `Settings.canDrawOverlays(context)` and expose a user-triggered Settings action using `Settings.ACTION_MANAGE_OVERLAY_PERMISSION`. It must never claim overlay readiness while Android reports it unavailable.
          - When overlay access is granted and the device is **unlocked**, the existing bounded ringing foreground service may attach one Arihna-owned `TYPE_APPLICATION_OVERLAY` window. The overlay is allowed only for the active ringing session, must be removed immediately on `Interrompi`, successful `Rinvia`, service destruction or terminal safety timeout, and must never remain as an always-on floating window.
          - The overlay must be large enough to avoid the One UI compact-notification expansion gesture and must show the active alarm identity plus directly visible actions **Interrompi** and **Rinvia 5 min**. It should use the approved Arihna Green/Gold visual language and must not introduce unrelated content.
          - When the device is locked, preserve the already-working lock-screen/full-screen alarm path; do not place the application overlay above the lock-screen ringing Activity. When overlay access is absent, preserve the stable OEM-safe standard `CATEGORY_ALARM` notification fallback rather than reintroducing the custom `RemoteViews` path that crashed on the physical S25.
          - The standard ongoing notification remains part of the foreground-service contract and continues to contain `Interrompi` and `Rinvia` actions for the expanded shade/fallback path.

          **2. Alarm-stream volume control in Settings**

          - Add a `Volume sveglia` control under `Impostazioni → Sveglie e notifiche`. It must read the real Android `AudioManager.STREAM_ALARM` current/max volume and present it as a slider/percentage; it is not an Arihna-only software gain.
          - User changes explicitly set the real alarm-stream volume through `AudioManager.setStreamVolume(AudioManager.STREAM_ALARM, ...)`, clamped to the platform minimum/maximum. The UI must state that this changes the phone's alarm volume globally.
          - Do not request Notification Policy / Do-Not-Disturb access merely to move the normal alarm-volume slider. If the platform rejects a particular change, preserve the previous platform value and surface a controlled message instead of fabricating success.
          - Do not add audio amplification beyond the device stream maximum, DSP boost, normalization, clipping, or a new audio dependency. Existing Adhan/system-ringtone `USAGE_ALARM` playback remains unchanged.
          - Keep both real diagnostic buttons at **20 seconds**. They are the physical-device validation path for the new overlay and volume behavior.

          **Required regression for this correction:** keep unfiltered JVM/build/API28 regression green with zero skipped tests; add focused Android coverage for manifest `SYSTEM_ALERT_WINDOW`, overlay access state/settings intent, overlay session lifecycle (created only when authorized+unlocked and removed on stop/snooze/destroy), absence of custom `RemoteViews`, and alarm-volume read/clamp/set behavior. The modern API36 gate must preserve denied/granted exact-alarm, notification and full-screen checks and add denied/granted overlay-access assertions without changing the exact-alarm semantics. The technical candidate must be a direct child of this specification commit, pass the exact-SHA gate, then be promoted by non-forced fast-forward and packaged with the persistent Arihna debug signer for another Galaxy S25 physical validation. No other screen redesign or feature is authorized by this correction.
          EOF

      - name: Commit specification only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_SPEC.md
          test "$(git diff --cached --name-only)" = "PROJECT_SPEC.md"
          git commit -m "docs(alarms): authorize overlay and alarm volume correction"
          git push origin HEAD:refs/heads/alarms-s25-overlay-volume-spec
